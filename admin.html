<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OtaHub Admin</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
:root {
  --bg: #0b0418; --surf: #150a2c; --surf2: #1d1040; --card: #190c36;
  --cyan: #00e5ff; --sakura: #ff3080; --violet: #7c3aed; --lav: #a78bfa;
  --amber: #fbbf24; --green: #34d399; --white: #f0eeff;
  --dim: rgba(240,238,255,.72); --muted: rgba(240,238,255,.38);
  --border: rgba(255,255,255,.09); --bcyan: rgba(0,229,255,.15);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--white); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

/* ── Layout ── */
.layout { display: grid; grid-template-columns: 72px 1fr; min-height: 100vh; }
.sidebar { background: var(--surf); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; position: sticky; top: 0; height: 100vh; overflow: visible; padding: 4px 0 14px; gap: 2px; }
.main { overflow-y: auto; }

/* ── Sidebar ── */
.logo { padding: 10px 0 14px; width: 100%; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 6px; }
.logo-mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--cyan), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; letter-spacing: -.02em; color: #0a0a12; }
.logo-text { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.logo-text span { color: var(--cyan); }
.logo-badge { font-size: 9px; background: var(--violet); color: #fff; padding: 2px 7px; border-radius: 20px; font-weight: 600; letter-spacing: .05em; }

.sidebar-section { padding: 12px 12px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Collapsed icon nav with hover flyout submenus (WordPress-style) */
.nav-group { position: relative; width: 100%; display: flex; justify-content: center; }
.nav-group.sidebar-footer-group { margin-top: auto; }
.nav-group-head { width: 46px; height: 46px; border-radius: 11px; border: none; background: none; color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 19px; cursor: pointer; transition: all .15s; }
.nav-group-head:hover { background: var(--surf2); color: var(--white); }
.nav-group:has(.nav-item.active) .nav-group-head { background: var(--bcyan); color: var(--cyan); }
.nav-flyout { position: absolute; left: calc(100% + 10px); top: -6px; min-width: 240px; background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.45); display: none; z-index: 60; }
.nav-group:hover .nav-flyout, .nav-group:focus-within .nav-flyout { display: block; }
.flyout-title { padding: 6px 10px 8px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.nav-flyout .nav-item { white-space: nowrap; }
.nav-flyout .connected-info { padding: 4px 10px 2px; }
.nav-flyout .disconnect-btn { width: calc(100% - 16px); margin: 8px 8px 2px; }

.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 8px; margin: 2px 8px; cursor: pointer; color: var(--dim); transition: all .15s; font-size: 13.5px; border: none; background: none; width: calc(100% - 16px); text-align: left; }
.nav-item:hover { background: var(--surf2); color: var(--white); }
.nav-item.active { background: var(--bcyan); color: var(--cyan); box-shadow: inset 3px 0 0 var(--cyan); }
.nav-item .icon { width: 16px; text-align: center; flex-shrink: 0; opacity: .8; }
.nav-item .badge { margin-left: auto; background: var(--violet); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; }

.sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); }
.connected-info { font-size: 11px; color: var(--muted); line-height: 1.7; }
.connected-info strong { color: var(--dim); }
.disconnect-btn { margin-top: 8px; padding: 5px 10px; background: rgba(255,48,128,.12); border: 1px solid rgba(255,48,128,.3); color: var(--sakura); border-radius: 6px; cursor: pointer; font-size: 11px; width: 100%; }
.disconnect-btn:hover { background: rgba(255,48,128,.22); }

/* ── Header ── */
.page-header { padding: 24px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.page-title small { font-size: 12px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; text-decoration: none; }
.btn-primary { background: var(--cyan); color: #000; }
.btn-primary:hover { background: #00ccee; }
.btn-secondary { background: var(--surf2); color: var(--white); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-danger { background: rgba(255,48,128,.15); color: var(--sakura); border: 1px solid rgba(255,48,128,.3); }
.btn-danger:hover { background: rgba(255,48,128,.25); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-icon { padding: 7px; border-radius: 7px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── Setup screen ── */
#setup-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.setup-card { background: var(--surf); border: 1px solid var(--border); border-radius: 16px; padding: 40px; max-width: 460px; width: 100%; }
.setup-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.setup-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; line-height: 1.7; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 6px; letter-spacing: .03em; }
.field input, .field select { width: 100%; background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--white); font-size: 13px; outline: none; transition: border .15s; }
.field input:focus, .field select:focus { border-color: var(--cyan); }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
.field .hint a { color: var(--cyan); }
.setup-submit { width: 100%; margin-top: 8px; padding: 11px; font-size: 14px; }
.setup-error { background: rgba(255,48,128,.1); border: 1px solid rgba(255,48,128,.3); border-radius: 8px; padding: 10px 14px; color: var(--sakura); font-size: 12px; margin-top: 12px; display: none; }

/* ── Article list ── */
.content-area { padding: 24px 32px 48px; }
.search-row { display: flex; gap: 10px; margin-bottom: 20px; }
.search-input { flex: 1; background: var(--surf); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; color: var(--white); font-size: 13px; outline: none; }
.search-input:focus { border-color: var(--cyan); }
.filter-select { background: var(--surf); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--white); font-size: 13px; outline: none; }

.articles-grid { display: grid; gap: 8px; }
.article-card { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: 68px 1fr auto; gap: 14px; align-items: center; transition: border .15s, transform .15s, box-shadow .15s; cursor: pointer; }
.article-card:hover { border-color: rgba(0,229,255,.35); transform: translateX(2px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.article-card:hover { border-color: rgba(0,229,255,.35); }
.art-thumb-wrap { position: relative; width: 68px; height: 46px; border-radius: 8px; overflow: hidden; background: var(--surf2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.art-thumb-ph { font-size: 19px; opacity: .5; }
.art-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.art-thumb.loaded, .art-thumb[src]:not([src=""]) { opacity: 1; }
.art-info { min-width: 0; }
.art-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--white); }
.art-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 10px; }
.art-meta .art-file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.art-cat { background: var(--bcyan); color: var(--cyan); padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; letter-spacing: .02em; flex-shrink: 0; }
.art-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ── Editor (bố cục kiểu WordPress: tiêu đề to, ô soạn thảo là trung tâm,
      hộp "Xuất bản" cố định bên phải) ── */
.editor-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 24px 32px 48px; align-items: start; }
.editor-main {}
.editor-sidebar { position: sticky; top: 24px; }

.title-field { width: 100%; background: transparent; border: none; border-bottom: 2px solid transparent; outline: none; color: var(--white); font-size: 30px; font-weight: 700; letter-spacing: -.01em; font-family: inherit; padding: 6px 2px 14px; margin-bottom: 18px; transition: border-color .15s; }
.title-field::placeholder { color: var(--muted); font-weight: 600; }
.title-field:focus { border-bottom-color: var(--cyan); }

.publish-box { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.pb-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
.pb-body { padding: 16px 18px; }
.pb-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--dim); padding: 7px 0; border-bottom: 1px dashed var(--border); }
.pb-row:last-of-type { border-bottom: none; }
.pb-row .pb-label { color: var(--muted); }
.pb-row .pb-val { font-weight: 600; color: var(--white); }
.pb-link { color: var(--cyan); text-decoration: none; font-size: 11.5px; }
.pb-link:hover { text-decoration: underline; }
.pb-actions { display: flex; gap: 8px; margin-top: 14px; }
.pb-actions .btn-primary { flex: 1; justify-content: center; font-size: 13.5px; padding: 10px; }
.pb-savelog { margin-top: 10px; font-size: 10.5px; color: var(--muted); line-height: 1.7; max-height: 70px; overflow-y: auto; }

.side-box { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.side-box-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

.meta-box-collapsed { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; }
.meta-box-head { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.meta-box-head .field-group-title { margin: 0; padding: 0; border: none; }
.meta-box-head .chev { color: var(--muted); transition: transform .15s; font-size: 12px; }
.meta-box-head.open .chev { transform: rotate(90deg); }
.meta-box-content { padding: 0 20px 20px; display: none; }
.meta-box-content.open { display: block; }

.field-group { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
.field-group-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.form-input { width: 100%; background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--white); font-size: 13px; outline: none; transition: border .15s; font-family: inherit; }
.form-input:focus { border-color: var(--cyan); }
textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.6; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--dim); margin-bottom: 5px; letter-spacing: .03em; margin-top: 12px; }
.form-label:first-child { margin-top: 0; }
.img-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: var(--surf2); display: block; }
.img-preview-placeholder { width: 100%; height: 120px; border-radius: 8px; margin-top: 8px; background: var(--surf2); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }

/* Body editor — thanh công cụ kiểu WordPress: nút icon nhỏ gọn, sát nhau */
.body-editor { background: var(--surf2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.body-toolbar { display: flex; gap: 2px; padding: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: var(--surf); }
.tb-btn { min-width: 30px; height: 30px; padding: 0 8px; background: transparent; border: none; border-radius: 5px; color: var(--dim); font-size: 12.5px; cursor: pointer; transition: all .12s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
.tb-btn:hover { background: var(--surf2); color: var(--cyan); }
.tb-sep { width: 1px; background: var(--border); margin: 4px 4px; }
#body-textarea { width: 100%; min-height: 400px; background: transparent; border: none; padding: 14px; color: var(--dim); font-size: 13px; line-height: 1.8; resize: vertical; outline: none; font-family: 'Consolas', 'Monaco', monospace; }

/* Body mode tabs (Khối / Trực quan / HTML) */
.body-mode-tabs { display: flex; gap: 4px; padding: 10px 10px 0; background: var(--surf); }
.body-mode-tab { padding: 8px 16px; background: transparent; border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0; color: var(--muted); font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .12s; }
.body-mode-tab:hover { color: var(--dim); }
.body-mode-tab.active { background: var(--surf2); color: var(--cyan); border-color: var(--cyan); }

/* Visual (WYSIWYG) editor — approximates live article prose styling */
#body-visual { width: 100%; min-height: 400px; max-height: 700px; overflow-y: auto; background: var(--surf2); padding: 18px 20px; color: var(--white); font-size: 15px; line-height: 1.8; outline: none; }
#body-visual h2 { font-size: 22px; font-weight: 800; margin: 24px 0 12px; color: var(--white); }
#body-visual h3 { font-size: 18px; font-weight: 700; margin: 20px 0 10px; color: var(--white); }
#body-visual p { margin: 0 0 14px; color: var(--dim); }
#body-visual strong { color: var(--white); }
#body-visual figure { margin: 18px 0; }
#body-visual figure img { width: 100%; border-radius: 10px; display: block; }
#body-visual figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
#body-visual blockquote { border-left: 3px solid var(--cyan); margin: 18px 0; padding: 4px 0 4px 16px; color: var(--dim); font-style: italic; }
#body-visual blockquote cite { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); font-style: normal; }
#body-visual ul, #body-visual ol { margin: 0 0 14px; padding-left: 22px; color: var(--dim); }
#body-visual a { color: var(--cyan); }
#body-visual:empty:before { content: 'Bắt đầu viết nội dung...'; color: var(--muted); }

/* Block editor (kéo-thả) — canvas kiểu Elementor/Gutenberg: mỗi khối hiển thị
   đúng như bài thật, sửa trực tiếp trên khối, kéo-thả để sắp xếp lại. */
.block-canvas { background: var(--surf2); padding: 24px; }
.block-item { position: relative; margin-bottom: 6px; border: 1px dashed transparent; border-radius: 10px; padding: 10px 16px 10px 34px; transition: border-color .12s, background .12s; }
.block-item:hover, .block-item.dragging { border-color: rgba(0,229,255,.3); background: rgba(0,229,255,.035); }
.block-toolbar-mini { display: none; position: absolute; top: 8px; right: 10px; gap: 2px; background: var(--surf); border: 1px solid var(--border); border-radius: 7px; padding: 3px; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.block-item:hover .block-toolbar-mini, .block-item:focus-within .block-toolbar-mini { display: flex; }
.block-mini-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 5px; color: var(--dim); cursor: pointer; font-size: 12px; }
.block-mini-btn:hover { background: var(--bcyan); color: var(--cyan); }
.block-drag { position: absolute; left: 6px; top: 10px; width: 22px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: grab; color: var(--muted); font-size: 15px; border-radius: 5px; opacity: 0; transition: opacity .12s; }
.block-item:hover .block-drag, .block-item:focus-within .block-drag { opacity: 1; }
.block-drag:hover { color: var(--cyan); background: var(--bcyan); }
.block-drag:active { cursor: grabbing; }
.block-type-tag { position: absolute; top: 8px; left: 34px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); background: var(--surf); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; display: none; }
.block-item:hover .block-type-tag, .block-item:focus-within .block-type-tag { display: block; }
.block-canvas h2 { font-size: 20px; font-weight: 800; color: var(--white); outline: none; margin-top: 6px; }
.block-canvas h3 { font-size: 17px; font-weight: 700; color: var(--white); outline: none; margin-top: 6px; }
.block-canvas p { font-size: 15px; line-height: 1.8; color: var(--dim); outline: none; min-height: 1.6em; }
.block-canvas p:empty:before { content: 'Nhập đoạn văn...'; color: var(--muted); }
.block-canvas blockquote { border-left: 3px solid var(--cyan); padding: 4px 0 4px 16px; color: var(--dim); font-style: italic; }
.block-canvas blockquote p { outline: none; }
.block-canvas figure { text-align: center; }
.block-canvas figure img { max-width: 100%; max-height: 220px; border-radius: 8px; }
.block-canvas figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.block-add-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 18px 18px; border-top: 1px solid var(--border); margin-top: 4px; }
.block-add-bar .tb-btn { height: 34px; padding: 0 13px; border: 1px dashed var(--border); border-radius: 8px; font-weight: 600; }
.block-add-bar .tb-btn:hover { border-style: solid; border-color: var(--cyan); background: var(--bcyan); }
.block-field-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 8px; margin-top: 8px; }
.block-img-empty { width: 100%; height: 90px; border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }

/* Sidebar widgets */
.status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 10px 0; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulse 2s infinite; }
.status-dot.saving { background: var(--amber); animation: none; }
.status-dot.error { background: var(--sakura); animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.save-log { font-size: 11px; color: var(--muted); line-height: 1.7; max-height: 120px; overflow-y: auto; }

.deploy-info { background: rgba(0,229,255,.05); border: 1px solid var(--bcyan); border-radius: 8px; padding: 12px; font-size: 11px; color: var(--dim); line-height: 1.8; }
.deploy-info strong { color: var(--cyan); }

/* ── Loading ── */
.loading { display: flex; align-items: center; justify-content: center; padding: 60px; flex-direction: column; gap: 16px; color: var(--muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ── */
#toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast-item { background: var(--surf); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 13px; min-width: 260px; display: flex; align-items: center; gap: 10px; animation: toastIn .2s ease; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
.toast-item.success { border-color: rgba(52,211,153,.4); }
.toast-item.error { border-color: rgba(255,48,128,.4); }
.toast-icon { font-size: 16px; flex-shrink: 0; }
@keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }

/* ── Rankings editor ── */
.rank-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
.rank-tab { padding: 9px 18px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; transition: all .15s; }
.rank-tab:hover { color: var(--white); }
.rank-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

<script>
// ── State ──────────────────────────────────────────────────────────────────
let CURRENT_USER = null;
let ARTICLES = [];
let currentFile = null;
let currentSha = null;
let currentRawHtml = '';
let BODY_MODE = 'visual'; // 'visual' | 'code' | 'blocks' — chế độ soạn thảo nội dung bài viết
let BODY_BLOCKS = null; // mảng block khi bài đang ở chế độ Khối kéo-thả (chỉ bài mới); null = không dùng block

// ── Đăng nhập ──────────────────────────────────────────────────────────────
window.onload = async () => {
  try {
    const r = await fetch('/api/admin/me', { credentials: 'same-origin' });
    if (r.ok) {
      const data = await r.json();
      CURRENT_USER = data.user;
      startApp();
    }
  } catch(e) { /* chưa đăng nhập — cứ để màn hình đăng nhập hiện ra */ }
};

async function doLogin() {
  const username = document.getElementById('setup-username').value.trim();
  const password = document.getElementById('setup-password').value;
  const errEl  = document.getElementById('setup-error');
  errEl.style.display = 'none';

  if (!username || !password) {
    errEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.querySelector('.setup-submit');
  btn.textContent = 'Đang đăng nhập...'; btn.disabled = true;
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Đăng nhập thất bại.');
    CURRENT_USER = data.user;
    startApp();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Đăng nhập →'; btn.disabled = false;
  }
}

function startApp() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('conn-info').innerHTML =
    `<strong>${esc(CURRENT_USER.username)}</strong><br>Embisu/otahub-`;
  loadArticles();
}

async function disconnect() {
  if (!confirm('Đăng xuất khỏi admin?')) return;
  try { await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' }); } catch(e) {}
  location.reload();
}

// ── GitHub API (qua Cloudflare Worker — token GitHub thật không rời server) ──
async function ghGet(path) {
  const r = await fetch(`/api/admin/gh/${path}`, { credentials: 'same-origin' });
  if (r.status === 401) { location.reload(); throw new Error('Phiên đăng nhập đã hết hạn.'); }
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || ('Lỗi API: ' + r.status)); }
  return r.json();
}

async function ghPut(path, content, sha, message) {
  const r = await fetch(`/api/admin/gh/${path}`, {
    method: 'PUT',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      content: btoa(unescape(encodeURIComponent(content))),
      sha,
      message
    })
  });
  if (r.status === 401) { location.reload(); throw new Error('Phiên đăng nhập đã hết hạn.'); }
  if (!r.ok) {
    const e = await r.json().catch(()=>({}));
    throw new Error(e.error || 'Lỗi khi lưu file');
  }
  return r.json();
}

// ── Load articles ──────────────────────────────────────────────────────────
// Danh sách bài viết được lấy động từ assets/search.js (IDX) thay vì danh sách
// cứng, để tự động bao phủ toàn bộ ~150+ bài trên site (chỉ bài tiếng Việt —
// bài tiếng Anh dùng template khác, chưa hỗ trợ sửa qua trình soạn thảo này).
async function loadArticles() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải danh sách bài viết...</span></div>`);
  try {
    const data = await ghGet('assets/search.js');
    const js = decodeURIComponent(escape(atob(data.content)));
    const m = js.match(/var IDX\s*=\s*(\[[\s\S]*?\]);/);
    if (!m) throw new Error('Không đọc được danh sách bài viết từ assets/search.js');
    const idx = new Function('return ' + m[1])();
    const SKIP_CATS = new Set(['Chuyên mục','Trang']);
    ARTICLES = idx
      .filter(e => e.u && e.u.indexOf('?') === -1 && !SKIP_CATS.has(e.c) && !e.u.startsWith('/en/'))
      .map(e => ({
        file: e.u.replace(/^\//,'') + '.html',
        sha: null,
        title: e.t || e.u,
        desc: e.s || '',
        hero: '',
        cat: e.c || 'Gaming',
        date: '',
      }));
    document.getElementById('article-count').textContent = ARTICLES.length;
    showView('articles');
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải bài viết: ${e.message}</p></div>`);
  }
}

function extract(html, re) {
  const m = html.match(re);
  return m ? m[1].replace(' · OtaHub','').trim() : null;
}

function extractHero(html) {
  const m = html.match(/class="art-hero-img"\s+style="([^"]+)"/);
  if (m) {
    const u = m[1].match(/url\(([^)]+)\)/);
    return u ? u[1] : '';
  }
  const f = html.match(/<figure><img src="([^"]+)"/);
  return f ? f[1] : '';
}

function extractHeroPos(html) {
  const m = html.match(/class="art-hero-img"\s+style="([^"]+)"/);
  if (!m) return 50;
  const p = m[1].match(/background-position[^:]*:\s*center\s+(\d+)%/);
  return p ? parseInt(p[1]) : 50;
}

// ── Views ──────────────────────────────────────────────────────────────────
function setMain(html) { document.getElementById('main-content').innerHTML = html; }

function showView(view) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const navMap = { articles: 'nav-articles', rankings: 'nav-rankings', users: 'nav-users' };
  document.getElementById(navMap[view] || 'nav-articles')?.classList.add('active');

  if (view === 'articles') renderArticleList();
  else if (view === 'rankings') loadRankings();
  else if (view === 'users') loadUsers();
}

// ── Quản lý người dùng ────────────────────────────────────────────────────
async function loadUsers() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải danh sách người dùng...</span></div>`);
  try {
    const r = await fetch('/api/admin/users', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('Không tải được danh sách người dùng.');
    const data = await r.json();
    renderUsersView(data.users || []);
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>${esc(e.message)}</p></div>`);
  }
}

function renderUsersView(users) {
  const rows = users.map(u => `
    <div class="article-card" style="grid-template-columns:1fr auto">
      <div class="art-info">
        <div class="art-title">${esc(u.username)}${u.username === CURRENT_USER.username ? ' <span style="color:var(--muted);font-weight:400">(bạn)</span>' : ''}</div>
        <div class="art-meta">${u.createdAt ? 'Tạo lúc ' + new Date(u.createdAt).toLocaleString('vi-VN') : ''}</div>
      </div>
      <div class="art-actions">
        ${u.username === CURRENT_USER.username ? '' : `<button class="btn btn-danger btn-sm" onclick="deleteUser('${esc(u.username)}')">🗑 Xoá</button>`}
      </div>
    </div>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Người dùng <small>${users.length} tài khoản</small></div>
    </div>
    <div class="content-area">
      <div class="field-group">
        <div class="field-group-title">➕ Thêm tài khoản mới</div>
        <label class="form-label">Tên đăng nhập</label>
        <input class="form-input" id="nu-username" placeholder="ten-dang-nhap"/>
        <label class="form-label">Mật khẩu (tối thiểu 8 ký tự)</label>
        <input class="form-input" type="password" id="nu-password" placeholder="••••••••"/>
        <button class="btn btn-primary" style="margin-top:14px" onclick="addUser()">Thêm tài khoản</button>
        <div id="nu-error" class="setup-error"></div>
      </div>
      <div class="articles-grid">${rows}</div>
    </div>
  `);
}

async function addUser() {
  const username = document.getElementById('nu-username').value.trim();
  const password = document.getElementById('nu-password').value;
  const errEl = document.getElementById('nu-error');
  errEl.style.display = 'none';
  if (!username || !password || password.length < 8) {
    errEl.textContent = 'Cần tên đăng nhập và mật khẩu tối thiểu 8 ký tự.';
    errEl.style.display = 'block';
    return;
  }
  try {
    const r = await fetch('/api/admin/users', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Không thêm được tài khoản.');
    toast('success', '✅ Đã thêm tài khoản ' + username);
    loadUsers();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function deleteUser(username) {
  if (!confirm(`Xoá tài khoản "${username}"?`)) return;
  try {
    const r = await fetch('/api/admin/users?username=' + encodeURIComponent(username), {
      method: 'DELETE',
      credentials: 'same-origin'
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Không xoá được tài khoản.');
    toast('success', '✅ Đã xoá tài khoản ' + username);
    loadUsers();
  } catch(e) {
    toast('error', e.message);
  }
}

const CAT_ICON = { Gaming:'🎮', Anime:'⛩️', Manga:'📚', Reviews:'⭐', Rankings:'📊', Guide:'📘', News:'📰' };
const HERO_CACHE = new Map();
let thumbObserver = null;

function renderArticleList(filter='', cat='') {
  const filtered = ARTICLES.filter(a => {
    const q = filter.toLowerCase();
    const matchQ = !q || a.title.toLowerCase().includes(q) || a.file.includes(q);
    const matchCat = !cat || a.cat === cat;
    return matchQ && matchCat;
  });

  const cats = [...new Set(ARTICLES.map(a => a.cat))].sort();
  const catOpts = `<option value="">Tất cả danh mục</option>` +
    cats.map(c => `<option value="${c}" ${c===cat?'selected':''}>${c}</option>`).join('');

  const cards = filtered.length ? filtered.map(a => `
    <div class="article-card" onclick="editArticle('${a.file}')">
      <div class="art-thumb-wrap">
        <span class="art-thumb-ph">${CAT_ICON[a.cat] || '📄'}</span>
        <img class="art-thumb" data-file="${a.file}" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.remove()"/>
      </div>
      <div class="art-info">
        <div class="art-title">${esc(a.title)}</div>
        <div class="art-meta">
          <span class="art-cat">${esc(a.cat)}</span>
          <span class="art-file">${esc(a.file)}</span>
          ${a.date ? `<span>${esc(a.date.slice(0,10))}</span>` : ''}
        </div>
      </div>
      <div class="art-actions">
        <a class="btn btn-secondary btn-sm btn-icon" href="https://otahub.asia/${a.file}" target="_blank" onclick="event.stopPropagation()" title="Xem bài">🔗</a>
        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editArticle('${a.file}')">Chỉnh sửa</button>
      </div>
    </div>
  `).join('') : `<div class="empty-state"><div class="empty-icon">🔍</div><p>Không tìm thấy bài viết nào.</p></div>`;

  setMain(`
    <div class="page-header">
      <div class="page-title">Bài viết <small>${filtered.length}/${ARTICLES.length} bài</small></div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadArticles()">🔄 Tải lại</button>
        <button class="btn btn-primary" onclick="newArticle()">✏️ Viết mới</button>
      </div>
    </div>
    <div class="content-area">
      <div class="search-row">
        <input class="search-input" placeholder="🔍 Tìm bài viết..." value="${esc(filter)}" oninput="renderArticleList(this.value, document.getElementById('cat-filter').value)" />
        <select class="filter-select" id="cat-filter" onchange="renderArticleList(document.querySelector('.search-input').value, this.value)">
          ${catOpts}
        </select>
      </div>
      <div class="articles-grid">${cards}</div>
    </div>
  `);

  const searchEl = document.querySelector('.search-input');
  if (searchEl) { searchEl.value = filter; searchEl.focus(); searchEl.selectionStart = searchEl.selectionEnd = filter.length; }
  observeThumbs();
}

// Lazy-load thumbnail ảnh thật (og:image) cho từng bài khi cuộn tới, có cache trong phiên làm việc
function observeThumbs() {
  if (thumbObserver) thumbObserver.disconnect();
  thumbObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        loadThumb(en.target);
        thumbObserver.unobserve(en.target);
      }
    });
  }, { rootMargin: '300px' });
  document.querySelectorAll('.art-thumb[data-file]').forEach(img => thumbObserver.observe(img));
}

async function loadThumb(imgEl) {
  const file = imgEl.getAttribute('data-file');
  if (!file) return;
  if (HERO_CACHE.has(file)) {
    const url = HERO_CACHE.get(file);
    if (url) imgEl.src = url;
    return;
  }
  try {
    const data = await ghGet(file);
    const html = decodeURIComponent(escape(atob(data.content)));
    const m = html.match(/property="og:image"\s+content="([^"]*)"/);
    const url = m ? m[1] : '';
    HERO_CACHE.set(file, url);
    if (url) imgEl.src = url;
  } catch(e) {
    HERO_CACHE.set(file, '');
  }
}

async function editArticle(file) {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải bài viết...</span></div>`);
  try {
    const data = await ghGet(file);
    const html = decodeURIComponent(escape(atob(data.content)));
    currentFile = file;
    currentSha = data.sha;
    renderEditor(file, html);
  } catch(e) {
    toast('error', 'Không tải được bài: ' + e.message);
    showView('articles');
  }
}

// Mẫu bài viết hiện tại (từ giữa dự án) dùng 1 khối art-body duy nhất, không
// còn tách lang-vi/lang-en trong cùng file — bản tiếng Anh nằm ở file riêng
// trong thư mục en/. Một vài bài rất cũ có thể vẫn còn định dạng cũ, nên vẫn
// thử fallback để không mất dữ liệu.
function extractBody(html) {
  let m = html.match(/<article class="art-body">([\s\S]*?)<\/article>/);
  if (m) return m[1].trim();
  m = html.match(/<article class="art-body lang-vi active">([\s\S]*?)<\/article>/);
  return m ? m[1].trim() : '';
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function unesc(s) { return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }

function markChanged() {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (dot) dot.className = 'status-dot saving';
  if (txt) txt.textContent = 'Có thay đổi chưa lưu';
}

function updateHeroPreview(url) {
  const img = document.getElementById('hero-preview');
  const ph  = document.getElementById('hero-placeholder');
  if (!img || !ph) return;
  if (url) {
    img.src = url;
    img.style.display = 'block';
    ph.style.display  = 'none';
  } else {
    img.style.display = 'none';
    ph.style.display  = 'flex';
  }
  markChanged();
}

function updateHeroPosLabel(val) {
  const lbl = document.getElementById('hero-pos-label');
  if (lbl) lbl.textContent = val + '%';
  const img = document.getElementById('hero-preview');
  if (img) img.style.objectPosition = `center ${val}%`;
  markChanged();
}

function renderBodyImgs(bodyHtml) {
  const el = document.getElementById('body-imgs-list');
  if (!el) return;
  const imgs = [...bodyHtml.matchAll(/<img[^>]+src="([^"]+)"/g)].map(m => m[1]);
  if (!imgs.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:12px">Không có ảnh trong bài. Dùng nút 📷 Ảnh trong toolbar bên dưới để thêm.</p>';
    return;
  }
  el.innerHTML = imgs.map((src, i) => `
    <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
      <label class="form-label">Ảnh ${i+1}</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="form-input" style="flex:1;font-size:12px" id="body-img-${i}"
          value="${esc(src)}" placeholder="URL ảnh..."
          oninput="syncBodyImg(${i},this.value)"/>
        <button class="tb-btn" onclick="applyBodyImg(${i})">✓ Áp dụng</button>
      </div>
      <img src="${src}" id="body-img-prev-${i}"
        style="width:100%;height:90px;object-fit:cover;border-radius:6px;margin-top:6px;background:var(--surf2)"
        onerror="this.style.opacity=0.3"/>
    </div>
  `).join('');
}

function syncBodyImg(idx, newUrl) {
  const prev = document.getElementById(`body-img-prev-${idx}`);
  if (prev) { prev.src = newUrl; prev.style.opacity = 1; }
}

function applyBodyImg(idx) {
  const ta = document.getElementById('body-textarea');
  const inp = document.getElementById(`body-img-${idx}`);
  if (!ta || !inp) return;
  const newUrl = inp.value.trim();
  const imgs = [...ta.value.matchAll(/<img[^>]+src="([^"]+)"/g)];
  if (idx >= imgs.length) return;
  const oldSrc = imgs[idx][1];
  ta.value = ta.value.replace(new RegExp(oldSrc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'), newUrl);
  syncBodyImg(idx, newUrl);
  toast('success', `Đã thay ảnh ${idx+1}`);
  markChanged();
}

// ── Toolbar helpers ────────────────────────────────────────────────────────
function wrapSel(open, close) {
  const ta = document.getElementById('body-textarea');
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const decoded = unesc(open) + sel + unesc(close);
  ta.value = ta.value.slice(0, s) + decoded + ta.value.slice(e);
  markChanged();
}

function insertImg() {
  const url = prompt('URL ảnh:');
  if (!url) return;
  const alt = prompt('Alt text (mô tả ảnh):') || '';
  const cap = prompt('Caption (chú thích):') || '';
  const html = `\n<figure><img src="${url}" alt="${alt}" loading="lazy"/>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>\n`;
  insertAt(html);
}

function insertPara() { insertAt('\n<p></p>\n'); }
function insertBlock() { insertAt('\n<blockquote>\n\n<cite></cite>\n</blockquote>\n'); }

function insertAt(text) {
  const ta = document.getElementById('body-textarea');
  if (!ta) return;
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0, pos) + text + ta.value.slice(pos);
  ta.selectionStart = ta.selectionEnd = pos + text.length;
  ta.focus();
  markChanged();
}

// ── Chế độ soạn thảo Trực quan (WYSIWYG) / HTML ────────────────────────────
function cleanVisualHtml(html) {
  return html
    .replace(/<div>/gi, '<p>').replace(/<\/div>/gi, '</p>')
    .replace(/<p>(\s|&nbsp;|<br\s*\/?>)*<\/p>/gi, '')
    .replace(/ style="[^"]*"/gi, '')
    .replace(/ dir="[^"]*"/gi, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function toggleMetaBox(head) {
  head.classList.toggle('open');
  head.nextElementSibling?.classList.toggle('open');
}

function switchBodyMode(mode) {
  if (mode === BODY_MODE) return;
  const vis = document.getElementById('body-visual');
  const ta = document.getElementById('body-textarea');

  if (BODY_MODE === 'blocks' && mode !== 'blocks') {
    // Rời khỏi chế độ Khối = "tốt nghiệp" sang HTML tự do — không thể quay lại
    // chỉnh theo khối cho bài này nữa (nhưng nội dung HTML vẫn giữ nguyên).
    if (!confirm('Chuyển khỏi chế độ Khối sẽ không thể quay lại chỉnh theo khối (kéo-thả) cho bài này nữa — nội dung vẫn được giữ nguyên dưới dạng HTML. Tiếp tục?')) return;
    const rendered = blocksToHtml(BODY_BLOCKS);
    if (vis) vis.innerHTML = rendered;
    if (ta) ta.value = rendered;
    BODY_BLOCKS = null;
    document.getElementById('body-mode-tab-blocks')?.remove();
  } else if (mode === 'code') {
    if (vis && ta) ta.value = cleanVisualHtml(vis.innerHTML);
  } else if (mode === 'visual' && BODY_MODE === 'code') {
    if (vis && ta) vis.innerHTML = ta.value;
  }

  BODY_MODE = mode;
  document.getElementById('body-mode-tab-blocks')?.classList.toggle('active', mode === 'blocks');
  document.getElementById('body-mode-tab-visual')?.classList.toggle('active', mode === 'visual');
  document.getElementById('body-mode-tab-code')?.classList.toggle('active', mode === 'code');
  document.getElementById('body-blocks-wrap').style.display = mode === 'blocks' ? 'block' : 'none';
  document.getElementById('body-toolbar-visual').style.display = mode === 'visual' ? 'flex' : 'none';
  document.getElementById('body-toolbar-code').style.display = mode === 'code' ? 'flex' : 'none';
  document.getElementById('body-visual-wrap').style.display = mode === 'visual' ? 'block' : 'none';
  document.getElementById('body-code-wrap').style.display = mode === 'code' ? 'block' : 'none';
}

function visExec(cmd, val) {
  document.getElementById('body-visual')?.focus();
  document.execCommand(cmd, false, val);
  markChanged();
}
function visH2() { visExec('formatBlock', 'H2'); }
function visH3() { visExec('formatBlock', 'H3'); }
function visPara() { visExec('formatBlock', 'P'); }
function visBold() { visExec('bold'); }
function visItalic() { visExec('italic'); }
function visList() { visExec('insertUnorderedList'); }
function visImg() {

function visQuote() {

// ── Trình soạn thảo Khối (kéo-thả, kiểu Elementor/Gutenberg) ───────────────
// Chỉ dùng cho bài viết MỚI (xem newArticle()) — dữ liệu khối lưu ẩn trong
// <script type="application/json" id="admin-block-data"> ngay sau </article>,
// vô hình với người đọc, chỉ admin.html đọc lại để chỉnh sửa lần sau. Bài cũ
// không có marker này nên không hiện chế độ Khối, tránh tự suy diễn sai.
const BLOCK_TYPES = {
  paragraph: { label: 'Đoạn văn', icon: '¶' },
  heading:   { label: 'Tiêu đề',  icon: 'H' },
  image:     { label: 'Ảnh',      icon: '📷' },
  quote:     { label: 'Trích dẫn', icon: '❝' },
  list:      { label: 'Danh sách', icon: '•' },
};
let DRAG_FROM_IDX = null;

function newBlockData(type) {
  if (type === 'heading') return { type, level: 2, text: '' };
  if (type === 'image') return { type, src: '', alt: '', caption: '' };
  if (type === 'quote') return { type, text: '', cite: '' };
  if (type === 'list') return { type, items: [''] };
  return { type: 'paragraph', html: '' };
}
function blockToHtml(b) {
  if (b.type === 'heading') { const lvl = b.level === 3 ? 3 : 2; return `<h${lvl}>${esc(b.text || '')}</h${lvl}>`; }
  if (b.type === 'image') return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.alt || '')}" loading="lazy">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>` : '';
  if (b.type === 'quote') return `<blockquote><p>${b.text || ''}</p>${b.cite ? `<cite>${esc(b.cite)}</cite>` : ''}</blockquote>`;
  if (b.type === 'list') { const items = (b.items || []).map(s => s.trim()).filter(Boolean); return items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''; }
  return b.html ? `<p>${b.html}</p>` : '';
}
function blocksToHtml(blocks) { return (blocks || []).map(blockToHtml).filter(Boolean).join('\n'); }

async function renderBlockEditor() {
  const el = document.getElementById('body-blocks-editor');
  if (!el) return;
  const addMenu = Object.entries(BLOCK_TYPES).map(([t, m]) =>
    `<button class="tb-btn" onclick="blockAdd('${t}')">${m.icon} ${esc(m.label)}</button>`).join('');

  const items = BODY_BLOCKS.map((b, i) => {
    const toolbar = `
      <div class="block-type-tag">${esc(BLOCK_TYPES[b.type]?.label || b.type)}</div>
      <div class="block-toolbar-mini">
        <span class="block-mini-btn block-drag" draggable="true" ondragstart="blockDragStart(event,${i})" title="Kéo để sắp xếp">⠿</span>
        ${b.type === 'heading' ? `<button class="block-mini-btn" onclick="blockSetLevel(${i},2)" title="H2">H2</button><button class="block-mini-btn" onclick="blockSetLevel(${i},3)" title="H3">H3</button>` : ''}
        <button class="block-mini-btn" onclick="blockMove(${i},-1)" title="Lên">↑</button>
        <button class="block-mini-btn" onclick="blockMove(${i},1)" title="Xuống">↓</button>
        <button class="block-mini-btn" onclick="blockDuplicate(${i})" title="Nhân bản">⧉</button>
        <button class="block-mini-btn" onclick="blockDelete(${i})" title="Xoá">🗑</button>
      </div>`;

    let body = '';
    if (b.type === 'paragraph') {
      body = `<p contenteditable="true" oninput="blockTextInput(${i},'html',this)">${b.html || ''}</p>`;
    } else if (b.type === 'heading') {
      const lvl = b.level === 3 ? 3 : 2;
      body = `<h${lvl} contenteditable="true" oninput="blockTextInput(${i},'text',this)">${esc(b.text || '')}</h${lvl}>`;
    } else if (b.type === 'quote') {
      body = `<blockquote><p contenteditable="true" oninput="blockTextInput(${i},'text',this)">${b.text || ''}</p></blockquote>
        <input class="rank-input-sm" style="width:100%;margin-top:6px" placeholder="Nguồn / tác giả (tuỳ chọn)" value="${esc(b.cite || '')}" oninput="blockField(${i},'cite',this.value)"/>`;
    } else if (b.type === 'list') {
      const val = (b.items || ['']).join('\n');
      body = `<textarea class="rank-input-sm" style="width:100%;min-height:70px;font-family:inherit" placeholder="Mỗi dòng 1 mục" oninput="blockListInput(${i},this)">${esc(val)}</textarea>
        <ul id="block-list-prev-${i}" style="margin-top:8px;padding-left:20px;color:var(--dim);font-size:14px">${(b.items||[]).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
    } else if (b.type === 'image') {
      body = (b.src
        ? `<figure><img src="${esc(b.src)}" alt="${esc(b.alt||'')}" onerror="this.style.display='none'"></figure>`
        : `<div class="block-img-empty">Chưa có ảnh — nhập URL bên dưới</div>`) +
        `<div class="block-field-row">
          <input class="rank-input-sm" placeholder="URL ảnh" value="${esc(b.src||'')}" oninput="blockField(${i},'src',this.value)" onblur="renderBlockEditor()"/>
          <input class="rank-input-sm" placeholder="Alt text" value="${esc(b.alt||'')}" oninput="blockField(${i},'alt',this.value)"/>
          <input class="rank-input-sm" placeholder="Chú thích (tuỳ chọn)" value="${esc(b.caption||'')}" oninput="blockField(${i},'caption',this.value)"/>
        </div>`;
    }

    return `<div class="block-item" draggable="false" ondragover="event.preventDefault()" ondrop="blockDrop(event,${i})">${toolbar}${body}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="block-canvas">${items || '<div style="color:var(--muted);font-size:13px;padding:10px">Chưa có khối nào — thêm khối bên dưới.</div>'}</div>
    <div class="block-add-bar">${addMenu}</div>
  `;
}

function blockField(i, key, value) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i][key] = value; markChanged(); } }
function blockTextInput(i, key, el) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i][key] = el.innerHTML; markChanged(); } }
function blockListInput(i, el) {
  if (!BODY_BLOCKS[i]) return;
  const items = el.value.split('\n');
  BODY_BLOCKS[i].items = items;
  const prev = document.getElementById('block-list-prev-' + i);
  if (prev) prev.innerHTML = items.map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join('');
  markChanged();
}
function blockSetLevel(i, level) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i].level = level; renderBlockEditor(); markChanged(); } }
function blockAdd(type) { BODY_BLOCKS.push(newBlockData(type)); renderBlockEditor(); markChanged(); }
function blockDuplicate(i) { BODY_BLOCKS.splice(i + 1, 0, JSON.parse(JSON.stringify(BODY_BLOCKS[i]))); renderBlockEditor(); markChanged(); }
function blockDelete(i) { if (!confirm('Xoá khối này?')) return; BODY_BLOCKS.splice(i, 1); renderBlockEditor(); markChanged(); }
function blockMove(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= BODY_BLOCKS.length) return;
  const t = BODY_BLOCKS[i]; BODY_BLOCKS[i] = BODY_BLOCKS[j]; BODY_BLOCKS[j] = t;
  renderBlockEditor(); markChanged();
}
function blockDragStart(e, i) { DRAG_FROM_IDX = i; e.dataTransfer.effectAllowed = 'move'; }
function blockDrop(e, i) {
  e.preventDefault();
  if (DRAG_FROM_IDX === null || DRAG_FROM_IDX === i) return;
  const [moved] = BODY_BLOCKS.splice(DRAG_FROM_IDX, 1);
  BODY_BLOCKS.splice(i, 0, moved);
  DRAG_FROM_IDX = null;
  renderBlockEditor(); markChanged();
}

// ── Save ───────────────────────────────────────────────────────────────────
async function saveArticle() {
  // Nếu đang ở chế độ Trực quan hoặc Khối, đồng bộ nội dung sang ô HTML thô
  // trước khi lưu (ô HTML thô luôn là nguồn dữ liệu thật sự được ghi vào file).
  if (BODY_MODE === 'visual') {
    const vis = document.getElementById('body-visual');
    const ta = document.getElementById('body-textarea');
    if (vis && ta) ta.value = cleanVisualHtml(vis.innerHTML);
  } else if (BODY_MODE === 'blocks') {
    const ta = document.getElementById('body-textarea');
    if (ta) ta.value = blocksToHtml(BODY_BLOCKS);
  }

  const title   = document.getElementById('ed-title')?.value || '';
  const desc    = document.getElementById('ed-desc')?.value || '';
  const hero    = document.getElementById('ed-hero')?.value || '';
  const heroPos = document.getElementById('ed-hero-pos')?.value || '50';
  const cat     = document.getElementById('ed-cat')?.value || 'Gaming';
  const bodyVi  = document.getElementById('body-textarea')?.value || '';

  if (!currentFile) return;

  const btn = document.getElementById('save-btn');
  btn.textContent = '⏳ Đang lưu...'; btn.disabled = true;

  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (dot) dot.className = 'status-dot saving';
  if (txt) txt.textContent = 'Đang commit lên GitHub...';

  const isNewFile = !currentSha;
  try {
    // Bài đã tồn tại: lấy lại nội dung mới nhất từ GitHub để không đè lên thay đổi khác.
    // Bài mới: dùng template đang có sẵn trong editor, sha để trống để GitHub tự tạo file.
    let html, sha;
    if (isNewFile) {
      html = currentRawHtml;
      sha = undefined;
    } else {
      const data = await ghGet(currentFile);
      html = decodeURIComponent(escape(atob(data.content)));
      sha = data.sha;
    }

    // Apply edits
    html = html.replace(/<title>[^<]+<\/title>/, `<title>${title} · OtaHub</title>`);
    html = html.replace(/(<meta name="description" content=")[^"]*(")/,   `$1${desc}$2`);
    html = html.replace(/(<meta property="og:title" content=")[^"]*(")/,  `$1${title} · OtaHub$2`);
    html = html.replace(/(<meta property="og:description" content=")[^"]*(")/,  `$1${desc}$2`);
    html = html.replace(/(<meta name="twitter:title" content=")[^"]*(")/,  `$1${title} · OtaHub$2`);
    html = html.replace(/(<meta name="twitter:description" content=")[^"]*(")/,  `$1${desc}$2`);
    html = html.replace(/("headline": ")[^"]*(")/,  `$1${title}$2`);
    html = html.replace(/(<meta property="article:section" content=")[^"]*(")/,  `$1${cat}$2`);
    // Hero
    html = html.replace(/(class="art-hero-img"\s+style=")[^"]*(")/,
      `$1background-image:url(${hero});background-position:center ${heroPos}%;background-color:#0b0418;$2`);
    // H1
    // H1 — hỗ trợ cả mẫu hiện tại (art-hero-title) lẫn mẫu cũ (art-hero-title lang-vi active)
    if (/<h1 class="art-hero-title">[^<]*<\/h1>/.test(html)) {
      html = html.replace(/(<h1 class="art-hero-title">)[^<]*(<\/h1>)/, `$1${title}$2`);
    } else {
      html = html.replace(/(<h1 class="art-hero-title lang-vi active">)[^<]*(<\/h1>)/, `$1${title}$2`);
    }
    // Body — hỗ trợ cả mẫu hiện tại (art-body) lẫn mẫu cũ (art-body lang-vi active)
    if (/<article class="art-body">[\s\S]*?<\/article>/.test(html)) {
      html = html.replace(/<article class="art-body">[\s\S]*?<\/article>/, `<article class="art-body">\n${bodyVi}\n</article>`);
    } else {
      html = html.replace(/<article class="art-body lang-vi active">[\s\S]*?<\/article>/, `<article class="art-body lang-vi active">\n${bodyVi}\n</article>`);
    }

    // Dữ liệu Khối ẩn (admin-block-data) — chỉ tồn tại cho bài dùng chế độ Khối.
    // Nếu vẫn đang dùng Khối: ghi lại JSON khối mới nhất để lần sau mở lại vẫn
    // chỉnh được bằng kéo-thả. Nếu đã "tốt nghiệp" sang Trực quan/HTML (BODY_BLOCKS
    // = null) nhưng file vẫn còn marker cũ: gỡ bỏ để không lưu dữ liệu khối lỗi thời.
    const blockMarkerRe = /<script type="application\/json" id="admin-block-data">[\s\S]*?<\/script>\n?/;
    if (BODY_BLOCKS) {
      const newMarker = `<script type="application/json" id="admin-block-data">${JSON.stringify(BODY_BLOCKS)}<\/script>\n`;
      html = blockMarkerRe.test(html) ? html.replace(blockMarkerRe, newMarker) : html.replace(/<\/article>/, `</article>\n${newMarker}`);
    } else if (blockMarkerRe.test(html)) {
      html = html.replace(blockMarkerRe, '');
    }

    const putResult = await ghPut(currentFile, html, sha, `[admin] cap nhat: ${title.slice(0,50)}`);

    // Update local state — với bài mới, lấy sha thật từ kết quả commit để lần
    // lưu tiếp theo được nhận diện là "sửa bài đã tồn tại" thay vì tạo lại.
    currentSha = putResult?.content?.sha || sha;
    currentRawHtml = html;
    let art = ARTICLES.find(a => a.file === currentFile);
    if (art) { art.title = title; art.desc = desc; art.hero = hero; art.cat = cat; }
    else { art = { file: currentFile, sha: currentSha, title, desc, hero, cat, date: '' }; ARTICLES.unshift(art); }

    if (dot) dot.className = 'status-dot';
    if (txt) txt.textContent = 'Đã lưu • ' + new Date().toLocaleTimeString('vi-VN');
    const log = document.getElementById('save-log');
    if (log) log.innerHTML = `✅ Commit lúc ${new Date().toLocaleTimeString('vi-VN')}<br>` + log.innerHTML;

    toast('success', '✅ Đã lưu và deploy! Chờ ~1-2 phút để live.');

    if (isNewFile && confirm('Bài viết mới đã được lưu.\n\nBạn có muốn tự động thêm bài này vào Trang chủ, trang chuyên mục, Tìm kiếm, RSS và Sitemap không?')) {
      await syncNewArticle({ file: currentFile, title, desc, cat, hero });
    }
  } catch(e) {
    if (dot) dot.className = 'status-dot error';
    if (txt) txt.textContent = 'Lỗi: ' + e.message;
    toast('error', 'Lỗi lưu: ' + e.message);
  } finally {
    btn.textContent = '💾 Lưu & Deploy'; btn.disabled = false;
  }
}

// ── Rankings Editor ────────────────────────────────────────────────────────
let rankingsHtml = '';
let rankingsSha  = '';
let CATS_DATA    = null;
let currentRankTab = 'pc';

async function loadRankings() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải bảng xếp hạng...</span></div>`);
  try {
    const data = await ghGet('rankings.html');
    rankingsHtml = decodeURIComponent(escape(atob(data.content)));
    rankingsSha  = data.sha;
    // Extract CATS object
    const m = rankingsHtml.match(/const CATS\s*=\s*(\{[\s\S]*?\n\})\s*;/);
    if (!m) throw new Error('Không tìm thấy dữ liệu CATS trong rankings.html');
    CATS_DATA = new Function('return ' + m[1])();
    renderRankingsEditor();
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi: ${e.message}</p></div>`);
  }
}

function renderRankingsEditor() {
  const tabs = Object.keys(CATS_DATA).map(k => `
    <button class="rank-tab ${k===currentRankTab?'active':''}" onclick="switchRankTab('${k}')">
      ${CATS_DATA[k].icon} ${CATS_DATA[k].label}
    </button>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Bảng xếp hạng <small>rankings.html</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="https://otahub.asia/rankings" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" id="rank-save-btn" onclick="saveRankings()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px">
        <div class="rank-tabs" id="rank-tabs">${tabs}</div>
        <div id="rank-content"></div>
      </div>
    </div>
  `);
  renderRankTab(currentRankTab);
}

function switchRankTab(key) {
  currentRankTab = key;
  document.querySelectorAll('.rank-tab').forEach((t,i) => {
    t.classList.toggle('active', Object.keys(CATS_DATA)[i] === key);
  });
  renderRankTab(key);
}

function renderRankTab(key) {
  const cat = CATS_DATA[key];
  if (!cat) return;
  const el = document.getElementById('rank-content');
  if (!el) return;

  const topHtml = (cat.top||[]).map((e,i) => renderRankEntry(key,'top',i,e,true)).join('');
  const restHtml = (cat.rest||[]).map((e,i) => renderRankEntry(key,'rest',i,e,false)).join('');

  el.innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">
      💡 Chỉnh URL ảnh, tên, điểm số rồi nhấn <strong style="color:var(--cyan)">💾 Lưu & Deploy</strong>
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">🏆 Top 3</div>
    ${topHtml}
    ${restHtml ? `<div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px">Còn lại</div>${restHtml}` : ''}
  `;
}

function renderRankEntry(catKey, listKey, idx, e, isTop) {
  const numLabel = listKey==='top' ? ['🥇','🥈','🥉'][idx]||`#${idx+1}` : `#${idx+4}`;
  const numClass = listKey==='top' ? ['gold','silver','bronze'][idx]||'' : '';
  const imgId    = `ri_${catKey}_${listKey}_${idx}`;
  const titleId  = `rt_${catKey}_${listKey}_${idx}`;
  const studioId = `rs_${catKey}_${listKey}_${idx}`;
  const scoreId  = `rsc_${catKey}_${listKey}_${idx}`;
  const trendId  = `rtr_${catKey}_${listKey}_${idx}`;

  return `
    <div class="rank-entry${isTop?' top3':''}">
      <div style="text-align:center">
        <div class="rank-num ${numClass}">${numLabel}</div>
        <img class="rank-img-prev" id="prev_${imgId}" src="${esc(e.img||'')}"
          onerror="this.style.opacity=.3" alt="${esc(e.title||'')}"/>
      </div>
      <div class="rank-fields">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">URL ảnh</div>
          <input class="rank-input-sm" style="width:100%" id="${imgId}" value="${esc(e.img||'')}"
            oninput="document.getElementById('prev_${imgId}').src=this.value;updateRankData('${catKey}','${listKey}',${idx},'img',this.value)"/>
        </div>
        <div class="rank-row">
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Tên</div>
            <input class="rank-input-sm" id="${titleId}" value="${esc(e.title||'')}"
              oninput="updateRankData('${catKey}','${listKey}',${idx},'title',this.value)"/>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Điểm</div>
            <input class="rank-input-sm" id="${scoreId}" value="${esc(e.score||'')}"
              oninput="updateRankData('${catKey}','${listKey}',${idx},'score',this.value)"/>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Trend</div>
            <input class="rank-input-sm" id="${trendId}" value="${esc(e.trend||'')}"
              oninput="updateRankData('${catKey}','${listKey}',${idx},'trend',this.value)"/>
          </div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Studio / Thể loại</div>
          <input class="rank-input-sm" style="width:100%" id="${studioId}"
            value="${esc(e.studio||e.sub||'')}"
            oninput="updateRankData('${catKey}','${listKey}',${idx},e.studio!==undefined?'studio':'sub',this.value)"/>
        </div>
      </div>
    </div>`;
}

function updateRankData(catKey, listKey, idx, field, value) {
  if (!CATS_DATA[catKey]) return;
  const list = CATS_DATA[catKey][listKey];
  if (!list || !list[idx]) return;
  list[idx][field] = value;
}

async function saveRankings() {
  const btn = document.getElementById('rank-save-btn');
  btn.textContent = '⏳ Đang lưu...'; btn.disabled = true;
  try {
    // Re-fetch to get latest SHA
    const latest = await ghGet('rankings.html');
    const sha = latest.sha;
    let html = decodeURIComponent(escape(atob(latest.content)));

    // Rebuild CATS entries via targeted replacements
    // Replace each entry's img and title in the CATS block
    for (const catKey of Object.keys(CATS_DATA)) {
      const cat = CATS_DATA[catKey];
      for (const listKey of ['top','rest']) {
        (cat[listKey]||[]).forEach((entry, idx) => {
          // Replace img URL
          if (entry._origImg && entry._origImg !== entry.img) {
            html = html.replace(
              new RegExp(entry._origImg.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'),
              entry.img
            );
          }
        });
      }
    }

    // Better: replace full CATS block with serialized version
    const newCats = 'const CATS = ' + serializeCats(CATS_DATA) + ';';
    html = html.replace(/const CATS\s*=\s*\{[\s\S]*?\n\}\s*;/, newCats);

    await ghPut('rankings.html', html, sha, '[admin] cap nhat bang xep hang');
    toast('success', '✅ Đã lưu bảng xếp hạng! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  } finally {
    btn.textContent = '💾 Lưu & Deploy'; btn.disabled = false;
  }
}

function serializeCats(cats) {
  // Custom serializer to keep JS object style
  function serEntry(e) {
    const parts = [];
    for (const [k,v] of Object.entries(e)) {
      if (v === null) parts.push(`${k}:null`);
      else if (typeof v === 'object') parts.push(`${k}:${JSON.stringify(v)}`);
      else if (typeof v === 'string') parts.push(`${k}:'${v.replace(/'/g,"\\'")}'`);
      else parts.push(`${k}:${v}`);
    }
    return '{' + parts.join(',') + '}';
  }
  function serList(arr) {
    return '[' + arr.map(serEntry).join(',\n      ') + ']';
  }
  const catParts = Object.entries(cats).map(([k,cat]) => {
    const entryParts = [];
    for (const [ck,cv] of Object.entries(cat)) {
      if (Array.isArray(cv)) entryParts.push(`${ck}:${serList(cv)}`);
      else if (typeof cv === 'string') entryParts.push(`${ck}:'${cv.replace(/'/g,"\\'")}'`);
      else entryParts.push(`${ck}:${JSON.stringify(cv)}`);
    }
    return `  ${k}:{\n    ${entryParts.join(',\n    ')}\n  }`;
  });
  return '{\n' + catParts.join(',\n') + '\n}';
}

// ── Pages View ─────────────────────────────────────────────────────────────
// (Đã gỡ "Trang khác" — toàn bộ 9 trang trước đây hỏng nay có trình soạn thảo riêng trong sidebar.)

// ── Shared card-field helpers (dùng chung cho trang chủ + trang chuyên mục) ──
function fieldGet(raw, re) { const m = raw.match(re); return m ? m[1] : ''; }
function replaceField(raw, pattern, newVal) {
  if (newVal === undefined) return raw;
  return pattern.test(raw) ? raw.replace(pattern, (full, p1, p2) => p1 + esc(newVal) + p2) : raw;
}
function splitBlocks(html, startPattern) {
  const re = new RegExp(startPattern.source, 'g');
  const starts = [];
  let mm;
  while ((mm = re.exec(html))) starts.push(mm.index);
  const blocks = [];
  for (let i = 0; i < starts.length; i++) blocks.push(html.slice(starts[i], i + 1 < starts.length ? starts[i + 1] : html.length));
  return blocks;
}
async function ghSpliceInsert(path, anchorPattern, insertHtml, after, commitMsg) {
  const data = await ghGet(path);
  let content = decodeURIComponent(escape(atob(data.content)));
  if (!anchorPattern.test(content)) throw new Error('Không tìm thấy điểm chèn trong ' + path);
  content = after
    ? content.replace(anchorPattern, (m) => m + insertHtml)
    : content.replace(anchorPattern, (m) => insertHtml + m);
  await ghPut(path, content, data.sha, commitMsg);
}

    tag: fieldGet(raw, /class="tag[^"]*"[^>]*>([^<]*)</),
  };
}
function acApply(raw, f) {
  let out = raw;
  out = replaceField(out, /(<a href=")[^"]*(")/, f.href);
  out = replaceField(out, /(<img src=")[^"]*(")/, f.img);

async function saveHome() {
  try {
    const latest = await ghGet(HOME_FILE);
    let html = decodeURIComponent(escape(atob(latest.content)));

    const heroTitle = document.getElementById('home-hero-title').value;
    const heroSub   = document.getElementById('home-hero-sub').value;
    const heroCat   = document.getElementById('home-hero-cat').value;
    const heroDate  = document.getElementById('home-hero-date').value;
    const heroHref  = document.getElementById('home-hero-href').value;
    const heroImg   = document.getElementById('home-hero-img').value;

    html = html.replace(/(id="h-title">)[^<]*(<)/, (m, p1, p2) => p1 + esc(heroTitle) + p2);
    html = html.replace(/(id="h-sub">)[^<]*(<)/, (m, p1, p2) => p1 + esc(heroSub) + p2);
    html = html.replace(/(class="h-meta-cat">)[^<]*(<)/, (m, p1, p2) => p1 + esc(heroCat) + p2);
    html = html.replace(/(id="h-time">)[^<]*(<)/, (m, p1, p2) => p1 + esc(heroDate) + p2);
    html = html.replace(/(<a href=")[^"]*(" class="read-more" id="h-read")/, (m, p1, p2) => p1 + esc(heroHref) + p2);
    html = html.replace(/(<div class="hero-main" onclick="location\.href=')[^']*(')/, (m, p1, p2) => p1 + heroHref.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + p2);
    html = html.replace(/(\.h-img\{[^}]*background:url\(')[^']*('\))/, (m, p1, p2) => p1 + heroImg.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + p2);

    const fc = {
      href: document.getElementById('home-fc-href').value,
      img: document.getElementById('home-fc-img').value,
      tag: document.getElementById('home-fc-tag').value,
      title: document.getElementById('home-fc-title').value,
      sub: document.getElementById('home-fc-sub').value,
    };
    const newFc = fcApply(HOME_FEATURED.fc, fc);
    const newFeatured = '\n    ' + newFc.trim() + '\n\n    ' + HOME_FEATURED.sc.map(c => c.raw.trim()).join('\n\n    ') + '\n    ';
    html = html.replace(/(<!-- ADMIN:FEATURED_START -->)[\s\S]*?(<!-- ADMIN:FEATURED_END -->)/, (m, p1, p2) => p1 + newFeatured + p2);

    const tickerHtml = HOME_TICKER.map(t => `<span class="tick-item">${esc(t)}</span>`).join('');
    html = html.replace(TICKER_RE, (m, p1, p2, p3) => p1 + tickerHtml.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + p3);

    await ghPut(HOME_FILE, html, latest.sha, '[admin] cap nhat trang chu');
    toast('success', '✅ Đã lưu trang chủ! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

let ARR_CFG = null;
let ARR_DATA = [];
let ARR_SHA = null;

async function arrayEditor(cfgKey) {
  const cfg = ARRAY_PAGE_CONFIGS[cfgKey];
  if (!cfg) return;
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải ${cfg.label}...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-arr-' + cfgKey)?.classList.add('active');
  try {
    const data = await ghGet(cfg.file);
    const raw = decodeURIComponent(escape(atob(data.content)));
    const re = new RegExp('const\\s+' + cfg.varName + '\\s*=\\s*(\\[[\\s\\S]*?\\n\\]);');
    const m = raw.match(re);
    if (!m) throw new Error(`Không tìm thấy mảng dữ liệu "${cfg.varName}" trong ${cfg.file}`);
    ARR_CFG = { ...cfg, key: cfgKey };
    ARR_DATA = new Function('return ' + m[1])();

    renderArrayEditor();

    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải ${cfg.label}: ${e.message}</p></div>`);
  }
}

  const cfg = ARR_CFG;

    const thumb = cfg.imgField && entry[cfg.imgField]
      ? `<img class="rank-img-prev" src="${esc(entry[cfg.imgField])}" onerror="this.style.opacity=.3" alt=""/>`

      const val = entry[f.key];

        return `<div style="grid-column:1/-1"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${esc(f.label)}</div><textarea class="rank-input-sm" style="width:100%;min-height:50px;font-family:inherit" oninput="arrUpdate(${i},'${f.key}','${f.type}',this.value)">${esc(displayVal)}</textarea></div>`;
      }
      return `<div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${esc(f.label)}</div><input class="rank-input-sm" style="width:100%" value="${esc(displayVal)}" oninput="arrUpdate(${i},'${f.key}','${f.type}',this.value)"/></div>`;
    }).join('');

    return `<div class="rank-entry" style="grid-template-columns:70px 1fr">
      <div style="text-align:center">${thumb}<div style="display:flex;gap:4px;justify-content:center;margin-top:6px">

      <div>

          <textarea class="rank-input-sm" style="width:100%;min-height:80px;font-family:monospace;font-size:11px;margin-top:6px" onblur="arrUpdateJson(${i},this.value)">${esc(JSON.stringify(entry, null, 2))}</textarea>
        </details>
        <button class="btn btn-danger btn-sm" style="margin-top:8px" onclick="arrDelete(${i})">🗑 Xoá mục này</button>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">${esc(cfg.label)} <small>${cfg.file} · ${ARR_DATA.length} mục</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="${cfg.urlBase}" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" onclick="saveArrayEditor()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      ${cfg.note ? `<div style="font-size:11px;color:var(--muted);margin-bottom:14px">${cfg.note}</div>` : ''}
      <button class="btn btn-secondary" style="margin-bottom:14px" onclick="arrAdd()">➕ Thêm mục mới vào đầu danh sách</button>
      ${rows}
    </div>
  `);
}

function arrUpdate(i, key, type, value) {
  if (type === 'array') {
    ARR_DATA[i][key] = value.split(',').map(s => s.trim()).filter(Boolean);
  } else if (type === 'number') {
    ARR_DATA[i][key] = parseFloat(value) || 0;
  } else {
    ARR_DATA[i][key] = value;
  }
}
function arrUpdateJson(i, text) {
  try {
    ARR_DATA[i] = JSON.parse(text);
    renderArrayEditor();
  } catch(e) {
    toast('error', 'JSON không hợp lệ, chưa áp dụng thay đổi này.');
  }
}
function arrMove(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= ARR_DATA.length) return;
  const t = ARR_DATA[i]; ARR_DATA[i] = ARR_DATA[j]; ARR_DATA[j] = t;
  renderArrayEditor();
}
function arrDelete(i) {
  if (!confirm('Xoá mục này?')) return;
  ARR_DATA.splice(i, 1);
  renderArrayEditor();
}
function arrAdd() {
  const entry = ARR_CFG.newEntry ? ARR_CFG.newEntry() : JSON.parse(JSON.stringify(ARR_DATA[0] || {}));
  ARR_DATA.unshift(entry);
  renderArrayEditor();
  toast('success', 'Đã thêm mục mới — nhớ điền thông tin trước khi lưu.');
}
async function saveArrayEditor() {
  const cfg = ARR_CFG;
  try {
    const latest = await ghGet(cfg.file);
    let raw = decodeURIComponent(escape(atob(latest.content)));
    const re = new RegExp('const\\s+' + cfg.varName + '\\s*=\\s*\\[[\\s\\S]*?\\n\\];');
    const newBlock = 'const ' + cfg.varName + ' = ' + JSON.stringify(ARR_DATA, null, 2) + ';';
    if (!re.test(raw)) throw new Error(`Không tìm thấy mảng "${cfg.varName}" để ghi lại.`);
    raw = raw.replace(re, newBlock);
    await ghPut(cfg.file, raw, latest.sha, `[admin] cap nhat ${cfg.varName} trong ${cfg.file}`);
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Trình soạn thảo "Đang Hot" (choi-gi.html) ─────────────────────────────
// Khối này là 8 thẻ <div class="hot-card"> lồng nhau nhiều cấp — không dùng
// regex non-greedy đơn giản được vì có nhiều div con. Ta đếm độ sâu thẻ <div>
// để tìm đúng vị trí đóng của khối "hot-grid".
function extractBalancedBlock(html, startTag) {
  const startIdx = html.indexOf(startTag);
  if (startIdx === -1) return null;
  let i = startIdx + startTag.length;
  let depth = 1;
  while (depth > 0 && i < html.length) {
    const nextOpen = html.indexOf('<div', i);
    const nextClose = html.indexOf('</div>', i);
    if (nextClose === -1) return null;
    if (nextOpen !== -1 && nextOpen < nextClose) { depth++; i = html.indexOf('>', nextOpen) + 1; }
    else { depth--; i = nextClose + 6; }
  }
  return { start: startIdx, end: i, block: html.slice(startIdx, i) };
}

const HOT_COLORS = {
  amber: '251,191,36', cyan: '0,229,255', green: '52,211,153',
  lavender: '167,139,250', sakura: '255,48,128', violet: '124,58,237',
};
let HOT_CARDS = [];

function hotFields(raw) {
  const colorM = raw.match(/background:var\(--([a-z]+)\);width:0/);
  return {
    name: fieldGet(raw, /class="hot-name">([^<]*)</),
    meta: fieldGet(raw, /class="hot-meta">([^<]*)</),
    width: fieldGet(raw, /data-w="([^"]*)"/),
    badge: fieldGet(raw, /class="hot-badge">([^<]*)</),
    pill: fieldGet(raw, /class="hot-pill"[^>]*>([^<]*)</),
    color: colorM ? colorM[1] : 'cyan',
    gameId: fieldGet(raw, /pickGame\('([^']*)'\)/),
  };
}
function hotApply(raw, f) {
  let out = raw;
  out = replaceField(out, /(class="hot-name">)[^<]*(<)/, f.name);
  out = replaceField(out, /(class="hot-meta">)[^<]*(<)/, f.meta);
  out = replaceField(out, /(data-w=")[^"]*(")/, f.width);
  out = replaceField(out, /(class="hot-badge">)[^<]*(<)/, f.badge);
  out = replaceField(out, /(class="hot-pill"[^>]*>)[^<]*(<)/, f.pill);
  out = replaceField(out, /(pickGame\(')[^']*('\))/, f.gameId);
  if (f.color && HOT_COLORS[f.color]) {
    out = out.replace(/background:var\(--[a-z]+\);width:0/, `background:var(--${f.color});width:0`);
    out = out.replace(/border-color:rgba\([^)]*\);color:var\(--[a-z]+\)/, `border-color:rgba(${HOT_COLORS[f.color]},.3);color:var(--${f.color})`);
  }
  return out;
}

          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Màu</div><select class="rank-input-sm" onchange="hotUpdate(${i},'color',this.value)">${colorOpts.replace(`value="${f.color}"`,`value="${f.color}" selected`)}</select></div>
        </div>
        <div style="margin-top:8px;display:flex;gap:6px">
          <button class="tb-btn" onclick="hotMove(${i},-1)">↑ Lên</button>
          <button class="tb-btn" onclick="hotMove(${i},1)">↓ Xuống</button>
          <button class="btn btn-danger btn-sm" onclick="hotDelete(${i})">🗑 Xoá</button>
        </div>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Đang Hot <small>choi-gi.html · top ${HOT_CARDS.length}</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="https://otahub.asia/choi-gi" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" onclick="saveHotGrid()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      <div style="font-size:11px;color:var(--muted);margin-bottom:14px">💡 Thứ hạng (#1-#${HOT_CARDS.length}) tự tính theo vị trí trong danh sách. Không thêm/xoá mục ở đây — chỉ sắp xếp lại và sửa nội dung.</div>
      ${rows}
    </div>
  `);
}

function hotUpdate(i, field, value) { HOT_CARDS[i].raw = hotApply(HOT_CARDS[i].raw, { [field]: value }); }
function hotMove(i, dir) { const j = i + dir; if (j < 0 || j >= HOT_CARDS.length) return; const t = HOT_CARDS[i]; HOT_CARDS[i] = HOT_CARDS[j]; HOT_CARDS[j] = t; renderHotGridEditor(); }
function hotDelete(i) { if (!confirm('Xoá mục này?')) return; HOT_CARDS.splice(i, 1); renderHotGridEditor(); }
async function saveHotGrid() {
  try {
    const latest = await ghGet('choi-gi.html');
    let raw = decodeURIComponent(escape(atob(latest.content)));
    const grid = extractBalancedBlock(raw, '<div class="hot-grid">');
    if (!grid) throw new Error('Không tìm thấy khối "hot-grid" để lưu.');
    const ranks = HOT_CARDS.map((c, i) => c.raw.replace(/class="hot-rank">[^<]*</, `class="hot-rank">${String(i+1).padStart(2,'0')}<`));
    const newInner = ranks.map(r => r.trim()).join('');
    const newBlock = '<div class="hot-grid">' + newInner + '</div>';
    raw = raw.slice(0, grid.start) + newBlock + raw.slice(grid.end);
    await ghPut('choi-gi.html', raw, latest.sha, '[admin] cap nhat Dang Hot choi-gi.html');
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
