    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Trình soạn thảo Sắp ra mắt (sap-ra-mat.html) ──────────────────────────
// RELEASES là object lồng 2 cấp: { game:[{month,items:[...]}], anime:[...], manga:[...] }
const RELEASES_FIELDS = {
  game:  [ {key:'title',label:'Tên game',type:'text'}, {key:'dev',label:'Nhà phát triển',type:'text'}, {key:'platforms',label:'Nền tảng (vd pc, ps5, xbox)',type:'array'}, {key:'genres',label:'Thể loại',type:'array'}, {key:'date',label:'Ngày (hiển thị)',type:'text'}, {key:'dateRaw',label:'Ngày (YYYY-MM-DD, để sắp xếp)',type:'text'}, {key:'hot',label:'Nổi bật? (true/false)',type:'text'}, {key:'img',label:'URL ảnh',type:'text'} ],
  anime: [ {key:'title',label:'Tên anime',type:'text'}, {key:'type',label:'Loại (tv/movie/ona)',type:'text'}, {key:'studio',label:'Studio',type:'text'}, {key:'genres',label:'Thể loại',type:'array'}, {key:'date',label:'Ngày (hiển thị)',type:'text'}, {key:'dateRaw',label:'Ngày (YYYY-MM-DD)',type:'text'}, {key:'hot',label:'Nổi bật? (true/false)',type:'text'}, {key:'img',label:'URL ảnh',type:'text'} ],
  manga: [ {key:'title',label:'Tên manga',type:'text'}, {key:'publisher',label:'NXB',type:'text'}, {key:'genres',label:'Thể loại',type:'array'}, {key:'date',label:'Ngày (hiển thị)',type:'text'}, {key:'dateRaw',label:'Ngày (YYYY-MM-DD)',type:'text'}, {key:'hot',label:'Nổi bật? (true/false)',type:'text'}, {key:'img',label:'URL ảnh',type:'text'} ],
};
let RELEASES_DATA = null;
let RELEASES_TAB = 'game';

async function releasesEditor() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải Sắp ra mắt...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-releases')?.classList.add('active');
  try {
    const data = await ghGet('sap-ra-mat.html');
    const raw = decodeURIComponent(escape(atob(data.content)));
    const m = raw.match(/const RELEASES\s*=\s*(\{[\s\S]*?\n\s*\});/);
    if (!m) throw new Error('Không tìm thấy dữ liệu RELEASES trong sap-ra-mat.html');
    RELEASES_DATA = new Function('return ' + m[1])();
    renderReleasesEditor();
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải: ${e.message}</p></div>`);
  }
}

function renderReleasesEditor() {
  const cats = Object.keys(RELEASES_DATA);
  const tabs = cats.map(c => `<button class="rank-tab ${c===RELEASES_TAB?'active':''}" onclick="switchReleasesTab('${c}')">${c==='game'?'🎮 Game':c==='anime'?'⛩️ Anime':'📚 Manga'}</button>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Sắp ra mắt <small>sap-ra-mat.html</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="https://otahub.asia/sap-ra-mat" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" onclick="saveReleases()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px">
        <div class="rank-tabs">${tabs}</div>
        <div id="releases-content"></div>
      </div>
    </div>
  `);
  renderReleasesTab();
}

function switchReleasesTab(c) { RELEASES_TAB = c; renderReleasesEditor(); }

function renderReleasesTab() {
  const el = document.getElementById('releases-content');
  const groups = RELEASES_DATA[RELEASES_TAB] || [];
  const fields = RELEASES_FIELDS[RELEASES_TAB];

  const groupsHtml = groups.map((g, gi) => {
    const itemsHtml = (g.items || []).map((item, ii) => {
      const inputs = fields.map(f => {
        const val = item[f.key];
        const displayVal = f.type === 'array' ? (Array.isArray(val) ? val.join(', ') : (val || '')) : (val ?? '');
        return `<div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${esc(f.label)}</div><input class="rank-input-sm" style="width:100%" value="${esc(displayVal)}" oninput="releasesUpdate('${RELEASES_TAB}',${gi},${ii},'${f.key}','${f.type}',this.value)"/></div>`;
      }).join('');
      return `<div class="rank-entry" style="grid-template-columns:1fr">
        <div>
          <div class="rank-row" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${inputs}</div>
          <div style="margin-top:6px;display:flex;gap:6px">
            <button class="tb-btn" onclick="releasesMoveItem('${RELEASES_TAB}',${gi},${ii},-1)">↑</button>
            <button class="tb-btn" onclick="releasesMoveItem('${RELEASES_TAB}',${gi},${ii},1)">↓</button>
            <button class="btn btn-danger btn-sm" onclick="releasesDeleteItem('${RELEASES_TAB}',${gi},${ii})">🗑 Xoá mục</button>
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <input class="rank-input-sm" style="font-weight:700;font-size:14px;width:220px" value="${esc(g.month||'')}" oninput="releasesUpdateMonth('${RELEASES_TAB}',${gi},this.value)"/>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="releasesAddItem('${RELEASES_TAB}',${gi})">➕ Thêm mục</button>
          <button class="btn btn-danger btn-sm" onclick="releasesDeleteGroup('${RELEASES_TAB}',${gi})">🗑 Xoá cả tháng này</button>
        </div>
      </div>
      ${itemsHtml || '<div style="color:var(--muted);font-size:12px">Chưa có mục nào trong tháng này.</div>'}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">💡 Mỗi nhóm là 1 tháng/quý. "Nổi bật?" gõ đúng chữ <code style="color:var(--cyan)">true</code> hoặc <code style="color:var(--cyan)">false</code>.</div>
    <button class="btn btn-secondary" onclick="releasesAddGroup('${RELEASES_TAB}')">➕ Thêm nhóm tháng mới</button>
    ${groupsHtml}
  `;
}

function releasesUpdate(cat, gi, ii, key, type, value) {
  const item = RELEASES_DATA[cat][gi].items[ii];
  if (type === 'array') item[key] = value.split(',').map(s => s.trim()).filter(Boolean);
  else if (key === 'hot') item[key] = value.trim().toLowerCase() === 'true';
  else item[key] = value;
}
function releasesUpdateMonth(cat, gi, value) { RELEASES_DATA[cat][gi].month = value; }
function releasesMoveItem(cat, gi, ii, dir) {
  const arr = RELEASES_DATA[cat][gi].items;
  const j = ii + dir;
  if (j < 0 || j >= arr.length) return;
  const t = arr[ii]; arr[ii] = arr[j]; arr[j] = t;
  renderReleasesTab();
}
function releasesDeleteItem(cat, gi, ii) {
  if (!confirm('Xoá mục này?')) return;
  RELEASES_DATA[cat][gi].items.splice(ii, 1);
  renderReleasesTab();
}
function releasesAddItem(cat, gi) {
  const cur = RELEASES_DATA[cat][gi].items;
  const template = cur[0] ? JSON.parse(JSON.stringify(cur[0])) : { cat, title: 'Tên mới', date: '', dateRaw: '', hot: false, img: '', genres: [] };
  template.title = 'Tên mới'; template.hot = false;
  cur.unshift(template);
  renderReleasesTab();
}
function releasesDeleteGroup(cat, gi) {
  if (!confirm('Xoá cả nhóm tháng này (và mọi mục bên trong)?')) return;
  RELEASES_DATA[cat].splice(gi, 1);
  renderReleasesTab();
}
function releasesAddGroup(cat) {
  RELEASES_DATA[cat].unshift({ month: 'Tháng mới', items: [] });
  renderReleasesTab();
}
async function saveReleases() {
  try {
    const latest = await ghGet('sap-ra-mat.html');
    let raw = decodeURIComponent(escape(atob(latest.content)));
    const re = /const RELEASES\s*=\s*\{[\s\S]*?\n\s*\};/;
    if (!re.test(raw)) throw new Error('Không tìm thấy RELEASES để ghi lại.');
    const newBlock = 'const RELEASES = ' + JSON.stringify(RELEASES_DATA, null, 2) + ';';
    raw = raw.replace(re, newBlock);
    await ghPut('sap-ra-mat.html', raw, latest.sha, '[admin] cap nhat RELEASES trong sap-ra-mat.html');
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Trình soạn thảo Đội ngũ (about.html · .team-grid) ─────────────────────
let TEAM_CARDS = [];

function teamFields(raw) {
  return {
    img: fieldGet(raw, /<img src="([^"]*)"/),
    alt: fieldGet(raw, /<img[^>]+alt="([^"]*)"/),
    badge: fieldGet(raw, /class="tc-role-badge">([^<]*)</),
    name: fieldGet(raw, /class="tc-name">([^<]*)</),
    role: fieldGet(raw, /class="tc-role">([^<]*)</),
    bio: fieldGet(raw, /class="tc-bio">([^<]*)</),
  };
}
function teamApply(raw, f) {
  let out = raw;
  out = replaceField(out, /(<img src=")[^"]*(")/, f.img);
  out = replaceField(out, /(<img[^>]+alt=")[^"]*(")/, f.alt);
  out = replaceField(out, /(class="tc-role-badge">)[^<]*(<)/, f.badge);
  out = replaceField(out, /(class="tc-name">)[^<]*(<)/, f.name);
  out = replaceField(out, /(class="tc-role">)[^<]*(<)/, f.role);
  out = replaceField(out, /(class="tc-bio">)[^<]*(<)/, f.bio);
  return out;
}

async function teamEditor() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải Đội ngũ...</span></div>`);

  try {

    const inner = grid.block.slice('<div class="team-grid">'.length, -'</div>'.length);
    TEAM_CARDS = splitBlocks(inner, /<div class="team-card">/).map(r => ({ raw: r }));

    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải: ${e.message}</p></div>`);

}

function renderTeamEditor() {

        <button class="btn btn-secondary" onclick="teamAdd()">➕ Thêm thành viên</button>
        <button class="btn btn-primary" onclick="saveTeam()">💾 Lưu & Deploy</button>

      ${rows || '<div class="empty-state"><p>Chưa có thành viên nào.</p></div>'}

` });

// ── Trình soạn thảo nội dung thô (lien-he.html / chinh-sach-bao-mat.html) ──
// Hai trang này là văn bản tự do (không có cấu trúc thẻ lặp lại), nên dùng
// ô soạn thảo HTML thô, giới hạn trong vùng đánh dấu ADMIN:CONTENT_START/END
// để không đụng tới header/nav/footer dùng chung.
const SECTION_CONTENT_RE = /<!-- ADMIN:CONTENT_START -->([\s\S]*?)<!-- ADMIN:CONTENT_END -->/;
let SECTION_CTX = null;

async function sectionEditor(file, navId, label, liveUrl) {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải ${esc(label)}...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(navId)?.classList.add('active');
  try {
    const data = await ghGet(file);
    const raw = decodeURIComponent(escape(atob(data.content)));
    const m = raw.match(SECTION_CONTENT_RE);
    if (!m) throw new Error(`Không tìm thấy vùng nội dung (ADMIN:CONTENT) trong ${file}`);
    SECTION_CTX = { file, navId, label, liveUrl };
    setMain(`
      <div class="page-header">
        <div class="page-title">${esc(label)} <small>${esc(file)}</small></div>
        <div class="header-actions">
          <a class="btn btn-secondary btn-sm" href="${esc(liveUrl)}" target="_blank">🔗 Xem live</a>
          <button class="btn btn-primary" onclick="saveSection()">💾 Lưu & Deploy</button>
        </div>
      </div>
      <div class="content-area">
        <div style="font-size:11px;color:var(--muted);margin-bottom:14px">💡 Trang này là văn bản tự do, chưa có form theo từng ô — sửa trực tiếp mã HTML bên dưới. Chỉ phần nội dung chính (không đụng menu/footer) mới hiển thị ở đây.</div>
        <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden">
          <textarea id="section-textarea" class="form-input" style="border:none;border-radius:0;min-height:520px;font-family:monospace;font-size:12px">${esc(m[1])}</textarea>
        </div>
      </div>
    `);
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải: ${e.message}</p></div>`);
  }
}

async function saveSection() {
  if (!SECTION_CTX) return;
  try {
    const newInner = document.getElementById('section-textarea')?.value || '';
    const latest = await ghGet(SECTION_CTX.file);
    let raw = decodeURIComponent(escape(atob(latest.content)));
    if (!SECTION_CONTENT_RE.test(raw)) throw new Error(`Không tìm thấy vùng nội dung (ADMIN:CONTENT) trong ${SECTION_CTX.file}`);
    raw = raw.replace(SECTION_CONTENT_RE, `<!-- ADMIN:CONTENT_START -->${newInner}<!-- ADMIN:CONTENT_END -->`);
    await ghPut(SECTION_CTX.file, raw, latest.sha, `[admin] cap nhat noi dung ${SECTION_CTX.file}`);
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Trình soạn thảo trang News ────────────────────────────────────────────
let NEWS_CARDS = [];
const NEWS_CARD_START = /<a href="[^"]*" style="display:block;background:#150a2c/;

function newsFields(raw) {
  return {
    href: fieldGet(raw, /<a href="([^"]*)"/),
    img: fieldGet(raw, /<img src="([^"]*)"/),
    alt: fieldGet(raw, /<img[^>]+alt="([^"]*)"/),
    cat: fieldGet(raw, /letter-spacing:\.15em">([^<]*)</),
    title: fieldGet(raw, /<h3[^>]*>([^<]*)<\/h3>/),
    desc: fieldGet(raw, /<p[^>]*>([^<]*)<\/p>/),
  };
}
function newsApply(raw, f) {
  let out = raw;
  out = replaceField(out, /(<a href=")[^"]*(")/, f.href);
  out = replaceField(out, /(<img src=")[^"]*(")/, f.img);
  out = replaceField(out, /(<img[^>]+alt=")[^"]*(")/, f.alt);
  out = replaceField(out, /(letter-spacing:\.15em">)[^<]*(<)/, f.cat);
  out = replaceField(out, /(<h3[^>]*>)[^<]*(<\/h3>)/, f.title);
  out = replaceField(out, /(<p[^>]*>)[^<]*(<\/p>)/, f.desc);
  return out;
}

async function newsEditor() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải News...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-news')?.classList.add('active');
  try {
    const data = await ghGet('news.html');
    const raw = decodeURIComponent(escape(atob(data.content)));
    const m = raw.match(/<!-- OTAHUB_NEW30_START -->([\s\S]*?)<!-- OTAHUB_NEW30_END -->/);
    if (!m) throw new Error('Không tìm thấy khối tin tức (thiếu marker OTAHUB_NEW30).');
    NEWS_CARDS = splitBlocks(m[1], NEWS_CARD_START).map(r => ({ raw: r }));
    renderNewsEditor();
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải News: ${e.message}</p></div>`);
  }
}

function renderNewsEditor() {
  const rows = NEWS_CARDS.map((c, i) => {
    const f = newsFields(c.raw);
    return `<div class="rank-entry">
      <div style="text-align:center"><img class="rank-img-prev" src="${esc(f.img)}" onerror="this.style.opacity=.3" alt=""/></div>
      <div class="rank-fields">
        <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Tiêu đề</div><input class="rank-input-sm" style="width:100%" value="${esc(f.title)}" oninput="newsUpdate(${i},'title',this.value)"/></div>
        <div style="margin-top:6px"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">URL ảnh</div><input class="rank-input-sm" style="width:100%" value="${esc(f.img)}" oninput="newsUpdate(${i},'img',this.value)"/></div>
        <div style="margin-top:6px"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Mô tả</div><input class="rank-input-sm" style="width:100%" value="${esc(f.desc)}" oninput="newsUpdate(${i},'desc',this.value)"/></div>
        <div class="rank-row" style="margin-top:6px;grid-template-columns:1fr 1fr auto">
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Link</div><input class="rank-input-sm" value="${esc(f.href)}" oninput="newsUpdate(${i},'href',this.value)"/></div>
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Danh mục (GAMING/ANIME/MANGA)</div><input class="rank-input-sm" value="${esc(f.cat)}" oninput="newsUpdate(${i},'cat',this.value)"/></div>
          <div style="display:flex;gap:4px;align-items:end">
            <button class="tb-btn" onclick="newsMove(${i},-1)" title="Lên">↑</button>
            <button class="tb-btn" onclick="newsMove(${i},1)" title="Xuống">↓</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="newsDelete(${i})" title="Xoá">🗑</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">News <small>news.html · ${NEWS_CARDS.length} tin</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="https://otahub.asia/news" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" onclick="saveNews()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      <div style="font-size:11px;color:var(--muted);margin-bottom:14px">💡 Số "N tin mới đã kiểm chứng" trên site sẽ tự cập nhật theo số lượng thẻ tin bên dưới.</div>
      <button class="btn btn-secondary" style="margin-bottom:14px" onclick="newsAdd()">➕ Thêm tin vào đầu danh sách</button>
      ${rows}
    </div>
  `);
}

function newsUpdate(i, field, value) { NEWS_CARDS[i].raw = newsApply(NEWS_CARDS[i].raw, { [field]: value }); }
function newsMove(i, dir) { const j = i + dir; if (j < 0 || j >= NEWS_CARDS.length) return; const t = NEWS_CARDS[i]; NEWS_CARDS[i] = NEWS_CARDS[j]; NEWS_CARDS[j] = t; renderNewsEditor(); }
function newsDelete(i) { if (!confirm('Xoá tin này?')) return; NEWS_CARDS.splice(i, 1); renderNewsEditor(); }
function newsAdd() {
  if (!NEWS_CARDS.length) { toast('error', 'Không có thẻ mẫu để nhân bản.'); return; }
  const clone = { raw: newsApply(NEWS_CARDS[0].raw, { href: '/duong-dan-tin-moi', img: '/assets/img/placeholder.svg', alt: 'Tiêu đề tin mới', title: 'Tiêu đề tin mới', desc: 'Mô tả ngắn...' }) };
  NEWS_CARDS.unshift(clone);
  renderNewsEditor();
  toast('success', 'Đã thêm tin mới — nhớ điền link/ảnh/tiêu đề trước khi lưu.');
}
async function saveNews() {
  try {
    const latest = await ghGet('news.html');
    let html = decodeURIComponent(escape(atob(latest.content)));
    const newSection = NEWS_CARDS.map(c => c.raw.trim()).join('');
    html = html.replace(/(<!-- OTAHUB_NEW30_START -->[\s\S]*?<h2[^>]*>)\d+( tin mới đã kiểm chứng<\/h2><div[^>]*>)[\s\S]*?(<\/div><\/section><!-- OTAHUB_NEW30_END -->)/,
      (m, p1, p2, p3) => p1 + NEWS_CARDS.length + p2 + newSection + p3);
    await ghPut('news.html', html, latest.sha, `[admin] cap nhat danh sach tin tuc news.html`);
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function openSite()   { window.open('https://otahub.asia', '_blank'); }
function openGitHub() { window.open('https://github.com/Embisu/otahub-', '_blank'); }

function toast(type, msg) {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.innerHTML = `<span class="toast-icon">${type==='success'?'✅':'❌'}</span><span>${msg}</span>`;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
</script>
