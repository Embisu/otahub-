<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OtaHub Admin</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
:root {
  --bg: #f0f0f1; --surf: #ffffff; --surf2: #f6f7f7; --card: #ffffff;
  --cyan: #0e7490; --sakura: #d6336c; --violet: #6d28d9; --lav: #8b5cf6;
  --amber: #d97706; --green: #059669; --white: #1d2327;
  --dim: #50575e; --muted: #757c82;
  --border: #dcdcde; --bcyan: rgba(14,116,144,.12);
}
/* Sidebar giữ nguyên bảng màu tối gốc (kiểu wp-admin: sidebar tối, nội dung sáng) */
.sidebar {
  --surf: #150a2c; --surf2: #1d1040; --white: #f0eeff;
  --dim: rgba(240,238,255,.72); --muted: rgba(240,238,255,.38);
  --border: rgba(255,255,255,.09); --cyan: #00e5ff; --violet: #7c3aed;
  --sakura: #ff3080; --bcyan: rgba(0,229,255,.15);
}
/* Các khối "xem trước trực tiếp" mô phỏng đúng giao diện tối của site công khai — giữ tối để xem trước chính xác */
.live-hero-card, .live-fc-card, #body-visual, .block-canvas {
  --surf: #150a2c; --surf2: #150a2c; --white: #f0eeff;
  --dim: rgba(240,238,255,.72); --muted: rgba(240,238,255,.38);
  --border: rgba(255,255,255,.09); --cyan: #00e5ff; --violet: #7c3aed;
  --bcyan: rgba(0,229,255,.15);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--white); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

/* ── Layout ── */
.layout { display: grid; grid-template-columns: 72px 1fr; min-height: 100vh; }
.sidebar { background: var(--surf); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; position: sticky; top: 0; height: 100vh; overflow: visible; padding: 4px 0 14px; gap: 2px; }
.main { overflow-y: auto; }

/* ── Sidebar ── */
.logo { padding: 10px 0 14px; width: 100%; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 6px; }
.logo-clickable { cursor: pointer; }
.logo-mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--cyan), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; letter-spacing: -.02em; color: #0a0a12; transition: transform .15s, box-shadow .15s; }
.logo-clickable:hover .logo-mark { transform: scale(1.06); box-shadow: 0 4px 16px rgba(0,229,255,.35); }
.logo-text { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.logo-text span { color: var(--cyan); }
.logo-badge { font-size: 9px; background: var(--violet); color: #fff; padding: 2px 7px; border-radius: 20px; font-weight: 600; letter-spacing: .05em; }

.sidebar-section { padding: 12px 12px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Collapsed icon nav with hover flyout submenus (WordPress-style) */
.nav-group { position: relative; width: 100%; display: flex; justify-content: center; }
.nav-group.sidebar-footer-group { margin-top: auto; }
.nav-group-head { width: 46px; height: 46px; border-radius: 11px; border: none; background: none; color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 19px; cursor: pointer; transition: all .15s; }
.nav-group-head:hover { background: var(--surf2); color: var(--white); }
.nav-group:has(.nav-item.active) .nav-group-head { background: var(--bcyan); color: var(--cyan); }
.cmdk-sidebar-btn { width: 46px; height: 46px; border-radius: 11px; border: 1px dashed var(--border); background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; transition: all .15s; margin: 0 0 10px; flex-shrink: 0; }
.cmdk-sidebar-btn:hover { background: var(--surf2); color: var(--cyan); border-color: rgba(0,229,255,.35); border-style: solid; }
.nav-flyout { position: absolute; left: calc(100% + 10px); top: -6px; min-width: 240px; background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.45); display: none; z-index: 60; }
.nav-group:hover .nav-flyout, .nav-group:focus-within .nav-flyout { display: block; }
.flyout-title { padding: 6px 10px 8px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.nav-flyout .nav-item { white-space: nowrap; }
.nav-flyout .connected-info { padding: 4px 10px 2px; }
.nav-flyout .disconnect-btn { width: calc(100% - 16px); margin: 8px 8px 2px; }

.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 8px; margin: 2px 8px; cursor: pointer; color: var(--dim); transition: all .15s; font-size: 13.5px; border: none; background: none; width: calc(100% - 16px); text-align: left; }
.nav-item:hover { background: var(--surf2); color: var(--white); }
.nav-item.active { background: var(--bcyan); color: var(--cyan); box-shadow: inset 3px 0 0 var(--cyan); }
.nav-item .icon { width: 16px; text-align: center; flex-shrink: 0; opacity: .8; }
.nav-item .badge { margin-left: auto; background: var(--violet); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; }

.sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); }
.connected-info { font-size: 11px; color: var(--muted); line-height: 1.7; }
.connected-info strong { color: var(--dim); }
.disconnect-btn { margin-top: 8px; padding: 5px 10px; background: rgba(255,48,128,.12); border: 1px solid rgba(255,48,128,.3); color: var(--sakura); border-radius: 6px; cursor: pointer; font-size: 11px; width: 100%; }
.disconnect-btn:hover { background: rgba(255,48,128,.22); }

/* ── Header ── */
.page-header { padding: 24px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.page-title small { font-size: 12px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; text-decoration: none; }
.btn-primary { background: var(--cyan); color: #fff; }
.btn-primary:hover { background: #0b5f78; }
.btn-secondary { background: var(--surf2); color: var(--white); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-danger { background: rgba(255,48,128,.15); color: var(--sakura); border: 1px solid rgba(255,48,128,.3); }
.btn-danger:hover { background: rgba(255,48,128,.25); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-icon { padding: 7px; border-radius: 7px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── Setup screen ── */
#setup-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.setup-card { background: var(--surf); border: 1px solid var(--border); border-radius: 16px; padding: 40px; max-width: 460px; width: 100%; }
.setup-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.setup-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; line-height: 1.7; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 6px; letter-spacing: .03em; }
.field input, .field select { width: 100%; background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--white); font-size: 13px; outline: none; transition: border .15s; }
.field input:focus, .field select:focus { border-color: var(--cyan); }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
.field .hint a { color: var(--cyan); }
.setup-submit { width: 100%; margin-top: 8px; padding: 11px; font-size: 14px; }
.setup-error { background: rgba(255,48,128,.1); border: 1px solid rgba(255,48,128,.3); border-radius: 8px; padding: 10px 14px; color: var(--sakura); font-size: 12px; margin-top: 12px; display: none; }

/* ── Article list ── */
.content-area { padding: 24px 32px 48px; }
.search-row { display: flex; gap: 10px; margin-bottom: 20px; }
.search-input { flex: 1; background: var(--surf); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; color: var(--white); font-size: 13px; outline: none; }
.search-input:focus { border-color: var(--cyan); }
.filter-select { background: var(--surf); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--white); font-size: 13px; outline: none; }

.articles-grid { display: grid; gap: 8px; }
.article-card { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: 68px 1fr auto; gap: 14px; align-items: center; transition: border .15s, transform .15s, box-shadow .15s; cursor: pointer; }
.article-card:hover { border-color: rgba(0,229,255,.35); transform: translateX(2px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.article-card:hover { border-color: rgba(0,229,255,.35); }
.art-thumb-wrap { position: relative; width: 68px; height: 46px; border-radius: 8px; overflow: hidden; background: var(--surf2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.art-thumb-ph { font-size: 19px; opacity: .5; }
.art-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.art-thumb.loaded, .art-thumb[src]:not([src=""]) { opacity: 1; }
.art-info { min-width: 0; }
.art-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--white); }
.art-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 10px; }
.art-meta .art-file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.art-cat { background: var(--bcyan); color: var(--cyan); padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; letter-spacing: .02em; flex-shrink: 0; }
.art-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ── Editor (bố cục kiểu WordPress: tiêu đề to, ô soạn thảo là trung tâm,
      hộp "Xuất bản" cố định bên phải) ── */
.editor-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 24px 32px 48px; align-items: start; }
.editor-main {}
.editor-sidebar { position: sticky; top: 24px; }

.title-field { width: 100%; background: transparent; border: none; border-bottom: 2px solid transparent; outline: none; color: var(--white); font-size: 30px; font-weight: 700; letter-spacing: -.01em; font-family: inherit; padding: 6px 2px 14px; margin-bottom: 18px; transition: border-color .15s; }
.title-field::placeholder { color: var(--muted); font-weight: 600; }
.title-field:focus { border-bottom-color: var(--cyan); }

.publish-box { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.pb-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
.pb-body { padding: 16px 18px; }
.pb-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--dim); padding: 7px 0; border-bottom: 1px dashed var(--border); }
.pb-row:last-of-type { border-bottom: none; }
.pb-row .pb-label { color: var(--muted); }
.pb-row .pb-val { font-weight: 600; color: var(--white); }
.pb-link { color: var(--cyan); text-decoration: none; font-size: 11.5px; }
.pb-link:hover { text-decoration: underline; }
.pb-actions { display: flex; gap: 8px; margin-top: 14px; }
.pb-actions .btn-primary { flex: 1; justify-content: center; font-size: 13.5px; padding: 10px; }
.pb-savelog { margin-top: 10px; font-size: 10.5px; color: var(--muted); line-height: 1.7; max-height: 70px; overflow-y: auto; }

.side-box { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.side-box-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

.meta-box-collapsed { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; }
.meta-box-head { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.meta-box-head .field-group-title { margin: 0; padding: 0; border: none; }
.meta-box-head .chev { color: var(--muted); transition: transform .15s; font-size: 12px; }
.meta-box-head.open .chev { transform: rotate(90deg); }
.meta-box-content { padding: 0 20px 20px; display: none; }
.meta-box-content.open { display: block; }

.field-group { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
.field-group-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.form-input { width: 100%; background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--white); font-size: 13px; outline: none; transition: border .15s; font-family: inherit; }
.form-input:focus { border-color: var(--cyan); }
textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.6; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--dim); margin-bottom: 5px; letter-spacing: .03em; margin-top: 12px; }
.form-label:first-child { margin-top: 0; }
.img-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: var(--surf2); display: block; }
.img-preview-placeholder { width: 100%; height: 120px; border-radius: 8px; margin-top: 8px; background: var(--surf2); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }

/* Body editor — thanh công cụ kiểu WordPress: nút icon nhỏ gọn, sát nhau */
.body-editor { background: var(--surf2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.body-toolbar { display: flex; gap: 2px; padding: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: var(--surf); }
.tb-btn { min-width: 30px; height: 30px; padding: 0 8px; background: transparent; border: none; border-radius: 5px; color: var(--dim); font-size: 12.5px; cursor: pointer; transition: all .12s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
.tb-btn:hover { background: var(--surf2); color: var(--cyan); }
.tb-sep { width: 1px; background: var(--border); margin: 4px 4px; }
#body-textarea { width: 100%; min-height: 400px; background: transparent; border: none; padding: 14px; color: var(--dim); font-size: 13px; line-height: 1.8; resize: vertical; outline: none; font-family: 'Consolas', 'Monaco', monospace; }

/* Body mode tabs (Khối / Trực quan / HTML) */
.body-mode-tabs { display: flex; gap: 4px; padding: 10px 10px 0; background: var(--surf); }
.body-mode-tab { padding: 8px 16px; background: transparent; border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0; color: var(--muted); font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .12s; }
.body-mode-tab:hover { color: var(--dim); }
.body-mode-tab.active { background: var(--surf2); color: var(--cyan); border-color: var(--cyan); }

/* Visual (WYSIWYG) editor — approximates live article prose styling */
#body-visual { width: 100%; min-height: 400px; max-height: 700px; overflow-y: auto; background: var(--surf2); padding: 18px 20px; color: var(--white); font-size: 15px; line-height: 1.8; outline: none; }
#body-visual h2 { font-size: 22px; font-weight: 800; margin: 24px 0 12px; color: var(--white); }
#body-visual h3 { font-size: 18px; font-weight: 700; margin: 20px 0 10px; color: var(--white); }
#body-visual p { margin: 0 0 14px; color: var(--dim); }
#body-visual strong { color: var(--white); }
#body-visual figure { margin: 18px 0; }
#body-visual figure img { width: 100%; max-height: 340px; object-fit: cover; border-radius: 10px; display: block; transition: box-shadow .3s; }
#body-visual figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
#body-visual figure.vis-img-flash img { box-shadow: 0 0 0 3px var(--cyan); }
#body-visual blockquote { border-left: 3px solid var(--cyan); margin: 18px 0; padding: 4px 0 4px 16px; color: var(--dim); font-style: italic; }
#body-visual blockquote cite { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); font-style: normal; }
#body-visual ul, #body-visual ol { margin: 0 0 14px; padding-left: 22px; color: var(--dim); }
#body-visual a { color: var(--cyan); }
#body-visual:empty:before { content: 'Bắt đầu viết nội dung...'; color: var(--muted); }

/* Block editor (kéo-thả) — canvas kiểu Elementor/Gutenberg: mỗi khối hiển thị
   đúng như bài thật, sửa trực tiếp trên khối, kéo-thả để sắp xếp lại. */
.block-canvas { background: var(--surf2); padding: 24px; }
.block-item { position: relative; margin-bottom: 6px; border: 1px dashed transparent; border-radius: 10px; padding: 10px 16px 10px 34px; transition: border-color .12s, background .12s; }
.block-item:hover, .block-item.dragging { border-color: rgba(0,229,255,.3); background: rgba(0,229,255,.035); }
.block-toolbar-mini { display: none; position: absolute; top: 8px; right: 10px; gap: 2px; background: var(--surf); border: 1px solid var(--border); border-radius: 7px; padding: 3px; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.block-item:hover .block-toolbar-mini, .block-item:focus-within .block-toolbar-mini { display: flex; }
.block-mini-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 5px; color: var(--dim); cursor: pointer; font-size: 12px; }
.block-mini-btn:hover { background: var(--bcyan); color: var(--cyan); }
.block-drag { position: absolute; left: 6px; top: 10px; width: 22px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: grab; color: var(--muted); font-size: 15px; border-radius: 5px; opacity: 0; transition: opacity .12s; }
.block-item:hover .block-drag, .block-item:focus-within .block-drag { opacity: 1; }
.block-drag:hover { color: var(--cyan); background: var(--bcyan); }
.block-drag:active { cursor: grabbing; }
.block-type-tag { position: absolute; top: 8px; left: 34px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); background: var(--surf); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; display: none; }
.block-item:hover .block-type-tag, .block-item:focus-within .block-type-tag { display: block; }
.block-canvas h2 { font-size: 20px; font-weight: 800; color: var(--white); outline: none; margin-top: 6px; }
.block-canvas h3 { font-size: 17px; font-weight: 700; color: var(--white); outline: none; margin-top: 6px; }
.block-canvas p { font-size: 15px; line-height: 1.8; color: var(--dim); outline: none; min-height: 1.6em; }
.block-canvas p:empty:before { content: 'Nhập đoạn văn...'; color: var(--muted); }
.block-canvas blockquote { border-left: 3px solid var(--cyan); padding: 4px 0 4px 16px; color: var(--dim); font-style: italic; }
.block-canvas blockquote p { outline: none; }
.block-canvas figure { text-align: center; }
.block-canvas figure img { max-width: 100%; max-height: 220px; border-radius: 8px; }
.block-canvas figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.block-add-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 18px 18px; border-top: 1px solid var(--border); margin-top: 4px; }
.block-add-bar .tb-btn { height: 34px; padding: 0 13px; border: 1px dashed var(--border); border-radius: 8px; font-weight: 600; }
.block-add-bar .tb-btn:hover { border-style: solid; border-color: var(--cyan); background: var(--bcyan); }
.block-field-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 8px; margin-top: 8px; }
.block-img-empty { width: 100%; height: 90px; border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }

/* ── Ảnh trong khối: thu gọn / dải xem nhanh (cho bài nhiều ảnh) ── */
.block-gallery-strip { background: var(--surf); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.block-gallery-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.block-gallery-thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.block-gallery-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; transition: transform .12s, border-color .12s; }
.block-gallery-thumb:hover { transform: scale(1.08); border-color: var(--cyan); }
.block-gallery-actions { display: flex; gap: 8px; margin-top: 10px; }
.block-item-collapsed { padding-top: 6px; padding-bottom: 6px; }
.block-img-collapsed-row { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 2px; border-radius: 8px; }

.block-img-collapsed-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
.block-img-collapsed-empty { display: flex; align-items: center; justify-content: center; background: var(--surf2); border: 1px dashed var(--border); font-size: 15px; }
.block-img-collapsed-info { min-width: 0; flex: 1; }

@keyframes blockFlash { 0%, 100% { background: transparent; } 30% { background: var(--bcyan); } }
.block-item-flash { animation: blockFlash 1.2s ease-out; border-radius: 10px; }

/* Sidebar widgets */
.status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 10px 0; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulse 2s infinite; }

.save-log { font-size: 11px; color: var(--muted); line-height: 1.7; max-height: 120px; overflow-y: auto; }

/* ── Loading ── */
.loading { display: flex; align-items: center; justify-content: center; padding: 60px; flex-direction: column; gap: 16px; color: var(--muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ── */
#toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast-item { background: var(--surf); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 13px; min-width: 260px; display: flex; align-items: center; gap: 10px; animation: toastIn .2s ease; box-shadow: 0 8px 32px rgba(0,0,0,.5); }

.toast-item.error { border-color: rgba(255,48,128,.4); }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }

/* ── Rankings editor ── */
.rank-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
.rank-tab { padding: 9px 18px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; transition: all .15s; }
.rank-tab:hover { color: var(--white); }
.rank-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.rank-entry { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--surf); transition: border .15s, box-shadow .15s; }
.rank-entry:hover { border-color: rgba(0,229,255,.3); box-shadow: 0 4px 14px rgba(0,0,0,.16); }
.rank-entry.top3 { border-color: rgba(0,229,255,.3); background: rgba(0,229,255,.03); }
.rank-num { font-size: 20px; font-weight: 800; color: var(--cyan); text-align: center; padding-top: 6px; }
.rank-num.gold { color: #fbbf24; }
.rank-num.silver { color: #a0aec0; }
.rank-num.bronze { color: #cd7f32; }
.rank-img-prev { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--surf2); display: block; margin-top: 6px; }
.rank-fields { display: grid; gap: 6px; }
.rank-row { display: grid; grid-template-columns: 1fr 90px 90px; gap: 8px; }
.rank-input-sm { background: var(--surf2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; color: var(--white); font-size: 12px; outline: none; width: 100%; }
.rank-input-sm:focus { border-color: var(--cyan); }

/* ── Live preview cards (xem trước trực tiếp, sửa chữ ngay trên thẻ) ── */
.live-hero-card, .live-fc-card { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background-size: cover; background-position: center; background-color: var(--surf2); display: flex; align-items: flex-end; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.live-hero-card { min-height: 240px; }
.live-fc-card { min-height: 170px; }

.live-card-body { position: relative; z-index: 1; padding: 20px; width: 100%; }
.live-tag { display: inline-block; background: var(--cyan); color: #000; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
.live-title { font-size: 22px; font-weight: 800; color: #fff; line-height: 1.3; outline: none; text-shadow: 0 2px 10px rgba(0,0,0,.5); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
.live-title:focus, .live-sub:focus, .sc-title-live:focus, .ticker-text:focus { background: rgba(0,229,255,.12); box-shadow: 0 0 0 1px var(--cyan); }
.live-title:empty:before { content: attr(data-ph); color: rgba(255,255,255,.4); }
.live-sub { font-size: 13px; color: rgba(255,255,255,.88); margin-top: 8px; outline: none; max-width: 640px; border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
.live-sub:empty:before { content: attr(data-ph); color: rgba(255,255,255,.35); }
.live-edit-hint { font-size: 10.5px; color: var(--muted); margin: -8px 0 14px; }
.live-section-badge { position: absolute; top: 14px; left: 14px; z-index: 2; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.live-badge-hero { background: var(--cyan); color: #001018; }
.live-badge-fc { background: var(--violet); color: #fff; }
.toc-link { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 7px; font-size: 12.5px; color: var(--dim); text-decoration: none; transition: background .15s, color .15s; }
.toc-link:hover { background: var(--surf2); color: var(--white); }
.live-edit-hint strong { color: var(--dim); }

/* ── Trình soạn thảo trang chủ kiểu Elementor (iframe + click-to-edit) ── */
.home-visual-editor { grid-template-columns: 1fr 340px; }
.visual-hint { font-size: 12px; color: var(--dim); background: var(--bcyan); border: 1px solid rgba(0,229,255,.25); border-radius: 8px; padding: 9px 14px; margin-bottom: 14px; }
.visual-iframe-wrap { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.14); height: calc(100vh - 220px); min-height: 500px; }
.home-visual-iframe { width: 100%; height: 100%; border: 0; display: block; background: #150a2c; }
.block-nav-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 8px; border-radius: 7px; font-size: 12.5px; color: var(--dim); background: none; border: none; cursor: pointer; transition: background .15s, color .15s; font-family: inherit; }
.block-nav-item:hover { background: var(--surf2); color: var(--white); }
.block-nav-item.active { background: var(--bcyan); color: var(--cyan); font-weight: 600; }
.home-block-panel { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; max-height: calc(100vh - 340px); overflow-y: auto; }
.home-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.home-panel-head h3 { margin: 0; font-size: 13px; color: var(--white); }
.home-item-card { background: var(--surf2); border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-bottom: 10px; }
.home-item-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--muted); }
.home-item-actions { display: flex; gap: 4px; }
.home-item-actions button { background: var(--surf); border: 1px solid var(--border); border-radius: 6px; width: 24px; height: 24px; color: var(--dim); cursor: pointer; font-size: 11px; }
.home-item-actions button:hover { color: var(--white); border-color: var(--cyan); }
.home-ticker-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.home-ticker-row .form-input { margin: 0; }
.empty-state-mini { font-size: 12.5px; color: var(--muted); text-align: center; padding: 24px 8px; }
.home-tab-bar { display: flex; gap: 4px; margin-bottom: 12px; background: var(--surf2); border-radius: 8px; padding: 3px; }
.home-tab-btn { flex: 1; background: none; border: none; border-radius: 6px; padding: 7px 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
.home-tab-btn.active { background: var(--surf); color: var(--cyan); font-weight: 600; }

/* ── Command palette (Ctrl/Cmd+K) — tìm nhanh kiểu Linear/Vercel/Notion ── */
.cmdk-trigger { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; background: var(--surf); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; transition: border-color .15s, background .15s; font-family: inherit; }
.cmdk-trigger:hover { border-color: rgba(0,229,255,.35); background: var(--surf2); }
.cmdk-trigger kbd { margin-left: auto; font-family: inherit; font-size: 10px; font-weight: 700; color: var(--dim); background: rgba(0,0,0,.05); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
.cmdk-ov { position: fixed; inset: 0; z-index: 9999; background: rgba(6,2,20,.72); backdrop-filter: blur(6px); display: none; padding: 11vh 20px 0; }
.cmdk-ov.open { display: block; }
.cmdk-box { max-width: 620px; margin: 0 auto; background: var(--surf); border: 1px solid rgba(0,229,255,.25); border-radius: 14px; box-shadow: 0 24px 64px rgba(0,0,0,.5); overflow: hidden; animation: cmdkIn .14s var(--ease, ease-out); }
@keyframes cmdkIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.cmdk-in-row { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.cmdk-in-row svg { flex-shrink: 0; color: var(--muted); }
.cmdk-input { flex: 1; background: none; border: none; outline: none; color: var(--white); font-size: 16px; font-family: inherit; }
.cmdk-input::placeholder { color: var(--muted); }
.cmdk-esc { font-size: 10px; font-weight: 700; color: var(--muted); background: rgba(0,0,0,.05); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; flex-shrink: 0; }
.cmdk-list { max-height: 54vh; overflow-y: auto; padding: 8px; }
.cmdk-group-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.cmdk-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--dim); }
.cmdk-item.sel { background: rgba(0,229,255,.12); color: var(--white); }
.cmdk-item-icon { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surf2); border-radius: 7px; font-size: 14px; }
.cmdk-item.sel .cmdk-item-icon { background: rgba(0,229,255,.18); }
.cmdk-item-body { flex: 1; min-width: 0; }
.cmdk-item-title { font-size: 13.5px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-item-hint { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.cmdk-item-tag { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); background: rgba(0,229,255,.1); border-radius: 5px; padding: 3px 7px; flex-shrink: 0; }
.cmdk-empty { padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13px; }

.sc-card { display: flex; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--surf); transition: border .15s, box-shadow .15s, opacity .15s; }
.sc-card:hover { border-color: rgba(0,229,255,.3); box-shadow: 0 4px 14px rgba(0,0,0,.16); }
.sc-card.dragging { opacity: .35; }
.sc-drag-handle { cursor: grab; color: var(--muted); display: flex; align-items: center; padding: 0 2px; font-size: 15px; user-select: none; }
.sc-drag-handle:active { cursor: grabbing; }
.sc-thumb { width: 96px; height: 66px; object-fit: cover; border-radius: 8px; background: var(--surf2); flex-shrink: 0; }
.sc-body { flex: 1; min-width: 0; }
.sc-title-live { font-size: 14px; font-weight: 700; color: var(--white); outline: none; border-radius: 4px; padding: 1px 3px; margin: -1px -3px; }
.sc-title-live:empty:before { content: 'Tiêu đề tin phụ...'; color: var(--muted); }
.sc-fields-row { display: flex; gap: 6px; margin-top: 8px; }
.sc-actions-col { display: flex; flex-direction: column; gap: 4px; justify-content: center; }

.ticker-chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surf); margin-bottom: 6px; transition: border .15s, opacity .15s; }
.ticker-chip:hover { border-color: rgba(0,229,255,.3); }
.ticker-chip.dragging { opacity: .35; }
.ticker-chip .drag-handle { cursor: grab; color: var(--muted); flex-shrink: 0; font-size: 14px; user-select: none; }
.ticker-chip .drag-handle:active { cursor: grabbing; }
.ticker-text { flex: 1; outline: none; font-size: 13px; color: var(--white); min-width: 0; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }

/* ── Bảng tin (Dashboard) ── */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.dash-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 2px; border-bottom: 1px dashed var(--border); font-size: 13px; color: var(--dim); }
.dash-stat-row:last-child { border-bottom: none; }
.dash-stat-row strong { color: var(--white); font-size: 14px; }
.dash-stat-total { font-weight: 700; color: var(--white); margin-bottom: 2px; }
.dash-stat-total strong { color: var(--cyan); font-size: 20px; }
.dash-recent-row { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-radius: 8px; cursor: pointer; transition: background .15s; }
.dash-recent-row:hover { background: var(--surf2); }
.dash-recent-cat { flex-shrink: 0; }
.dash-recent-title { flex: 1; min-width: 0; font-size: 13px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dash-recent-row:hover .dash-recent-go { opacity: 1; }
@media(max-width:900px) { .dash-grid { grid-template-columns: 1fr; } }

/* ── Pages grid ── */
.pages-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 10px; }
.page-card { background: var(--surf); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border .15s; }
.page-card:hover { border-color: rgba(0,229,255,.35); }
.page-card .pc-icon { font-size: 24px; margin-bottom: 8px; }
.page-card .pc-name { font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
.page-card .pc-file { font-size: 10px; color: var(--muted); }

/* ── Responsive ── */
@media(max-width:768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; width: 100%; align-items: stretch; }
  .nav-group { display: block; }

  .nav-flyout { position: static; display: block !important; box-shadow: none; border: none; padding: 0; background: none; min-width: 0; }
  .flyout-title { padding: 14px 12px 4px; }
  .editor-layout { grid-template-columns: 1fr; }
}
</style>

<script>

let ART_EXCERPT = '';
let ART_PREVIEW_TIMER = null;
let ART_BLOCKLIST_TIMER = null;

// Cảnh báo trước khi rời trang / đóng tab nếu còn thay đổi chưa lưu

// ── Command Palette: điều hướng nhanh tới mọi màn hình + tìm bài viết ────────
function cmdkNorm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
function cmdkStaticActions() {

    { icon: '📊', title: 'Bảng tin', hint: 'Tổng quan, viết nhanh', tag: 'Đi tới', run: () => showView('dashboard') },
    { icon: '📄', title: 'Bài viết', hint: 'Danh sách toàn bộ bài viết', tag: 'Đi tới', run: () => showView('articles') },
    { icon: '✏️', title: 'Viết bài mới', hint: 'Tạo bài viết trống', tag: 'Hành động', run: () => newArticle() },
    { icon: '🏠', title: 'Trang chủ', hint: 'Hero, ticker, tin nổi bật', tag: 'Đi tới', run: () => homeEditor('index.html') },
    { icon: '🎮', title: 'Gaming', hint: 'Trang chuyên mục gaming.html', tag: 'Đi tới', run: () => hubEditor('gaming.html', 'Gaming') },
    { icon: '⛩️', title: 'Anime', hint: 'Trang chuyên mục anime.html', tag: 'Đi tới', run: () => hubEditor('anime.html', 'Anime') },
    { icon: '📖', title: 'Manga', hint: 'Trang chuyên mục manga.html', tag: 'Đi tới', run: () => hubEditor('manga.html', 'Manga') },

    { icon: '⭐', title: 'Reviews', hint: 'Danh sách bài đánh giá', tag: 'Đi tới', run: () => arrayEditor('reviews') },
    { icon: '🎯', title: 'Chơi Gì?', hint: 'Database gợi ý game', tag: 'Đi tới', run: () => arrayEditor('choigi') },
    { icon: '💡', title: 'Recommend', hint: 'Danh sách gợi ý', tag: 'Đi tới', run: () => arrayEditor('recommend') },

    { icon: '🔥', title: 'Đang Hot', hint: 'Section tĩnh cho choi-gi.html', tag: 'Đi tới', run: () => hotGridEditor() },
    { icon: '🚀', title: 'Sắp ra mắt', hint: 'Lịch phát hành sắp tới', tag: 'Đi tới', run: () => releasesEditor() },
    { icon: '📰', title: 'News', hint: 'Trang tin tức', tag: 'Đi tới', run: () => newsEditor() },
    { icon: '👥', title: 'Đội ngũ / Giới thiệu', hint: 'Trang about', tag: 'Đi tới', run: () => teamEditor() },
    { icon: '✉️', title: 'Liên hệ', hint: 'Trang lien-he.html', tag: 'Đi tới', run: () => sectionEditor('lien-he.html', 'nav-lienhe', 'Liên hệ', 'https://otahub.asia/lien-he') },
    { icon: '🔒', title: 'Chính sách bảo mật', hint: 'Trang chinh-sach-bao-mat.html', tag: 'Đi tới', run: () => sectionEditor('chinh-sach-bao-mat.html', 'nav-chinhsach', 'Chính sách bảo mật', 'https://otahub.asia/chinh-sach-bao-mat') },

  ];
}
function cmdkArticleActions() {
  return (ARTICLES || []).map(a => ({
    icon: '📝', title: a.title, hint: a.cat || 'Bài viết', tag: 'Bài viết',
    run: () => editArticle(a.file),
  }));
}
let CMDK_SEL = 0, CMDK_ITEMS = [];
function openCmdk() {
  const ov = document.getElementById('cmdk-ov');
  const inp = document.getElementById('cmdk-input');
  ov.classList.add('open');
  inp.value = '';
  cmdkFilter();
  setTimeout(() => inp.focus(), 10);
}
function closeCmdk() {
  document.getElementById('cmdk-ov').classList.remove('open');
}
function cmdkFilter() {
  const q = cmdkNorm(document.getElementById('cmdk-input').value.trim());
  const staticItems = cmdkStaticActions();
  let items;
  if (!q) {
    items = staticItems;
  } else {
    const all = staticItems.concat(cmdkArticleActions());
    items = all.filter(it => cmdkNorm(it.title).includes(q) || cmdkNorm(it.hint).includes(q)).slice(0, 40);
  }
  CMDK_ITEMS = items;
  CMDK_SEL = 0;
  cmdkRender();
}
function cmdkRender() {
  const list = document.getElementById('cmdk-list');
  if (!CMDK_ITEMS.length) {
    list.innerHTML = '<div class="cmdk-empty">Không tìm thấy kết quả nào.</div>';
    return;
  }
  list.innerHTML = CMDK_ITEMS.map((it, i) => `
    <div class="cmdk-item${i === CMDK_SEL ? ' sel' : ''}" onmouseenter="CMDK_SEL=${i};cmdkRender()" onclick="cmdkRun(${i})">
      <div class="cmdk-item-icon">${it.icon}</div>
      <div class="cmdk-item-body">
        <div class="cmdk-item-title">${esc(it.title)}</div>
        <div class="cmdk-item-hint">${esc(it.hint || '')}</div>
      </div>
      <div class="cmdk-item-tag">${esc(it.tag)}</div>
    </div>`).join('');
  const sel = list.querySelector('.cmdk-item.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
function cmdkRun(i) {
  const it = CMDK_ITEMS[i];
  if (!it) return;
  closeCmdk();
  it.run();
}
function cmdkKeydown(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); CMDK_SEL = Math.min(CMDK_SEL + 1, CMDK_ITEMS.length - 1); cmdkRender(); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); CMDK_SEL = Math.max(CMDK_SEL - 1, 0); cmdkRender(); return; }
  if (e.key === 'Enter') { e.preventDefault(); cmdkRun(CMDK_SEL); return; }
}

window.onload = async () => {

    }
  } catch(e) { /* chưa đăng nhập — cứ để màn hình đăng nhập hiện ra */ }

async function doLogin() {
  const username = document.getElementById('setup-username').value.trim();
  const password = document.getElementById('setup-password').value;
  const errEl  = document.getElementById('setup-error');
  errEl.style.display = 'none';

  if (!username || !password) {
    errEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.querySelector('.setup-submit');
  btn.textContent = 'Đang đăng nhập...'; btn.disabled = true;
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Đăng nhập thất bại.');
    CURRENT_USER = data.user;
    startApp();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Đăng nhập →'; btn.disabled = false;
  }
}

function startApp() {
  document.getElementById('setup-screen').style.display = 'none';

async function disconnect() {

// ── GitHub API (qua Cloudflare Worker — token GitHub thật không rời server) ──
async function ghGet(path) {
  const r = await fetch(`/api/admin/gh/${path}`, { credentials: 'same-origin' });
  if (r.status === 401) { location.reload(); throw new Error('Phiên đăng nhập đã hết hạn.'); }
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || ('Lỗi API: ' + r.status)); }
  return r.json();
}

async function ghPut(path, content, sha, message) {
  const r = await fetch(`/api/admin/gh/${path}`, {
    method: 'PUT',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      content: btoa(unescape(encodeURIComponent(content))),
      sha,
      message
    })
  });
  if (r.status === 401) { location.reload(); throw new Error('Phiên đăng nhập đã hết hạn.'); }
  if (!r.ok) {
    const e = await r.json().catch(()=>({}));
    throw new Error(e.error || 'Lỗi khi lưu file');
  }
  return r.json();
}

// ── Tải ảnh lên (assets/img/) ─────────────────────────────────────────────
function slugifyFilename(name) {
  return (name || '')
    .toLowerCase()
    .replace(/đ/g, 'd')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

async function uploadImageFile(file) {
  if (!file) return null;
  if (!file.type.startsWith('image/')) throw new Error('Chỉ chấp nhận file ảnh (jpg, png, webp...).');
  if (file.size > 8 * 1024 * 1024) throw new Error('Ảnh quá lớn (tối đa 8MB).');
  const ext = (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
  const hash = Math.random().toString(36).slice(2, 10);
  const cleanName = slugifyFilename(file.name.replace(/\.[a-z0-9]+$/i, '')) || 'anh';
  const destPath = `assets/img/${hash}-${cleanName}.${ext}`;

  const b64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('Không đọc được file ảnh.'));
    reader.readAsDataURL(file);
  });

  const r = await fetch(`/api/admin/gh/${destPath}`, {
    method: 'PUT',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: b64, sha: null, message: `tai anh len qua admin: ${destPath}` }),
  });
  if (r.status === 401) { location.reload(); throw new Error('Phiên đăng nhập đã hết hạn.'); }
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || ('Lỗi tải ảnh lên: ' + r.status));
  }
  return `https://otahub.asia/${destPath}`;
}

let UPLOAD_TARGET_CB = null;
function triggerImageUpload(onUploaded) {
  UPLOAD_TARGET_CB = onUploaded;
  document.getElementById('global-upload-input')?.click();
}
async function handleGlobalUpload(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file || !UPLOAD_TARGET_CB) return;
  const cb = UPLOAD_TARGET_CB;
  UPLOAD_TARGET_CB = null;
  toast('success', '⏳ Đang tải ảnh lên...');
  try {
    const url = await uploadImageFile(file);
    if (url) { cb(url); toast('success', '✅ Đã tải ảnh lên: ' + url.split('/').pop()); }
  } catch (e) {
    toast('error', 'Lỗi tải ảnh: ' + e.message);
  }
}

// ── Load articles ──────────────────────────────────────────────────────────
// Danh sách bài viết được lấy động từ assets/search.js (IDX) thay vì danh sách
// cứng, để tự động bao phủ toàn bộ ~150+ bài trên site (chỉ bài tiếng Việt —
// bài tiếng Anh dùng template khác, chưa hỗ trợ sửa qua trình soạn thảo này).
async function loadArticles(landOnDashboard) {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải danh sách bài viết...</span></div>`);
  try {
    const data = await ghGet('assets/search.js');
    const js = decodeURIComponent(escape(atob(data.content)));
    const m = js.match(/var IDX\s*=\s*(\[[\s\S]*?\]);/);
    if (!m) throw new Error('Không đọc được danh sách bài viết từ assets/search.js');
    const idx = new Function('return ' + m[1])();
    const SKIP_CATS = new Set(['Chuyên mục','Trang']);
    ARTICLES = idx
      .filter(e => e.u && e.u.indexOf('?') === -1 && !SKIP_CATS.has(e.c) && !e.u.startsWith('/en/'))
      .map(e => ({
        file: e.u.replace(/^\//,'') + '.html',
        sha: null,
        title: e.t || e.u,
        desc: e.s || '',
        hero: '',
        cat: e.c || 'Gaming',
        date: '',
      }));
    document.getElementById('article-count').textContent = ARTICLES.length;
    if (landOnDashboard) showView('dashboard'); else showView('articles');
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải bài viết: ${e.message}</p></div>`);
  }
}

function extract(html, re) {
  const m = html.match(re);
  return m ? m[1].replace(' · OtaHub','').trim() : null;
}

function extractHero(html) {
  const m = html.match(/class="art-hero-img"\s+style="([^"]+)"/);
  if (m) {
    const u = m[1].match(/url\(([^)]+)\)/);
    return u ? u[1] : '';
  }
  const f = html.match(/<figure><img src="([^"]+)"/);
  return f ? f[1] : '';
}

function extractHeroPos(html) {
  const m = html.match(/class="art-hero-img"\s+style="([^"]+)"/);
  if (!m) return 50;
  const p = m[1].match(/background-position[^:]*:\s*center\s+(\d+)%/);
  return p ? parseInt(p[1]) : 50;
}

// Mô tả ngắn hiển thị ngay dưới tiêu đề, trên ảnh bìa — trước đây tồn tại trong
// mẫu bài viết nhưng chưa từng được admin đọc/lưu (luôn giữ nguyên placeholder).
function extractExcerpt(html) {
  const m = html.match(/<p class="art-hero-excerpt">([^<]*)<\/p>/);
  return m ? unesc(m[1]).trim() : '';
}

function setMain(html) { document.getElementById('main-content').innerHTML = html; }

function showView(view) {
  if (HAS_UNSAVED_CHANGES && !confirm('Bạn có thay đổi chưa lưu. Rời khỏi trang này sẽ mất các thay đổi đó — tiếp tục?')) return;

  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const navMap = { dashboard: 'nav-dashboard', articles: 'nav-articles', rankings: 'nav-rankings', users: 'nav-users' };
  document.getElementById(navMap[view] || 'nav-articles')?.classList.add('active');

  if (view === 'dashboard') renderDashboard();
  else if (view === 'articles') renderArticleList();
  else if (view === 'rankings') loadRankings();
  else if (view === 'users') loadUsers();
}

    </div>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Bảng tin <small>Chào mừng trở lại, ${esc(CURRENT_USER?.username || '')}</small></div>
    </div>
    <div class="content-area">

          <p style="font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:16px">Quản lý toàn bộ nội dung OtaHub.asia ngay tại đây — mọi thay đổi tự động lưu lên GitHub và deploy qua Cloudflare trong ~1-2 phút.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="newArticle()">✏️ Viết bài mới</button>
            <button class="btn btn-secondary" onclick="homeEditor('index.html')">🏠 Sửa trang chủ</button>
            <a class="btn btn-secondary" href="https://otahub.asia" target="_blank">🌐 Xem website</a>
          </div>
        </div>

        <div class="field-group">
          <div class="field-group-title">📊 Tổng quan</div>

async function addUser() {
  const username = document.getElementById('nu-username').value.trim();
  const password = document.getElementById('nu-password').value;
  const errEl = document.getElementById('nu-error');
  errEl.style.display = 'none';
  if (!username || !password || password.length < 8) {
    errEl.textContent = 'Cần tên đăng nhập và mật khẩu tối thiểu 8 ký tự.';
    errEl.style.display = 'block';
    return;
  }
  try {
    const r = await fetch('/api/admin/users', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Không thêm được tài khoản.');
    toast('success', '✅ Đã thêm tài khoản ' + username);
    loadUsers();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function deleteUser(username) {
  if (!confirm(`Xoá tài khoản "${username}"?`)) return;
  try {
    const r = await fetch('/api/admin/users?username=' + encodeURIComponent(username), {
      method: 'DELETE',
      credentials: 'same-origin'
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Không xoá được tài khoản.');
    toast('success', '✅ Đã xoá tài khoản ' + username);
    loadUsers();
  } catch(e) {
    toast('error', e.message);
  }
}

let thumbObserver = null;

}

// Lazy-load thumbnail ảnh thật (og:image) cho từng bài khi cuộn tới, có cache trong phiên làm việc
function observeThumbs() {
  if (thumbObserver) thumbObserver.disconnect();
  thumbObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        loadThumb(en.target);
        thumbObserver.unobserve(en.target);
      }
    });
  }, { rootMargin: '300px' });
  document.querySelectorAll('.art-thumb[data-file]').forEach(img => thumbObserver.observe(img));
}

async function loadThumb(imgEl) {
  const file = imgEl.getAttribute('data-file');
  if (!file) return;
  if (HERO_CACHE.has(file)) {
    const url = HERO_CACHE.get(file);
    if (url) imgEl.src = url;
    return;
  }
  try {
    const data = await ghGet(file);
    const html = decodeURIComponent(escape(atob(data.content)));
    const m = html.match(/property="og:image"\s+content="([^"]*)"/);
    const url = m ? m[1] : '';
    HERO_CACHE.set(file, url);
    if (url) imgEl.src = url;
  } catch(e) {
    HERO_CACHE.set(file, '');
  }
}

  // Dựng bản xem trước thật kiểu Elementor + gắn cầu nối postMessage cho phép
  // gõ trực tiếp trong iframe (tiêu đề, mô tả ngắn, đoạn văn...) đồng bộ ngược
  // về trạng thái editor mà không làm mất con trỏ/focus.
  const artIframe = document.getElementById('art-visual-iframe');
  if (artIframe) artIframe.srcdoc = buildArticlePreviewHtml();
  bindArticleBridgeMessages();

  // Số từ / thời gian đọc ước tính
  updateWordCount();
}

// Mẫu bài viết hiện tại (từ giữa dự án) dùng 1 khối art-body duy nhất, không
// còn tách lang-vi/lang-en trong cùng file — bản tiếng Anh nằm ở file riêng
// trong thư mục en/. Một vài bài rất cũ có thể vẫn còn định dạng cũ, nên vẫn
// thử fallback để không mất dữ liệu.
function extractBody(html) {
  let m = html.match(/<article class="art-body">([\s\S]*?)<\/article>/);
  if (m) return m[1].trim();
  m = html.match(/<article class="art-body lang-vi active">([\s\S]*?)<\/article>/);
  return m ? m[1].trim() : '';
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function unesc(s) { return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }

function markChanged() {
  HAS_UNSAVED_CHANGES = true;
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (dot) dot.className = 'status-dot saving';
  if (txt) txt.textContent = 'Có thay đổi chưa lưu';
  updateWordCount();
  // Thay đổi cấu trúc (danh mục, ảnh bìa, khối, HTML thô...) cần dựng lại toàn
  // bộ iframe xem trước bài viết — có debounce nên gõ liên tục vẫn mượt.
  scheduleArticlePreviewRefresh();
}

// Dùng cho các chỉnh sửa BẮT NGUỒN từ trong iframe (gõ trực tiếp tiêu đề, mô
// tả ngắn, đoạn văn...) — iframe đã tự hiển thị thay đổi ngay khi gõ nên KHÔNG
// cần dựng lại srcdoc (tránh mất con trỏ/focus giữa chừng).
function markChangedNoRebuild() {
  HAS_UNSAVED_CHANGES = true;
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (dot) dot.className = 'status-dot saving';
  if (txt) txt.textContent = 'Có thay đổi chưa lưu';
}

function updateWordCount() {
  const el = document.getElementById('word-count-bar');
  if (!el) return;
  let text = '';
  if (BODY_MODE === 'code') text = (document.getElementById('body-textarea')?.value || '').replace(/<[^>]+>/g, ' ');
  else if (BODY_MODE === 'blocks') text = document.getElementById('body-blocks-editor')?.textContent || '';
  else text = document.getElementById('body-visual')?.textContent || '';
  const words = (text.trim().match(/\S+/g) || []).length;
  const mins = Math.max(1, Math.round(words / 200));
  el.textContent = `📝 ${words} từ · ~${mins} phút đọc`;
  updateVisImageCount();
}

function updateHeroPreview(url) {
  const img = document.getElementById('hero-preview');

    img.style.display = 'block';

    img.style.display = 'none';

function updateHeroPosLabel(val) {

function renderBodyImgs(bodyHtml) {
  const el = document.getElementById('body-imgs-list');
  if (!el) return;
  const imgs = [...bodyHtml.matchAll(/<img[^>]+src="([^"]+)"/g)].map(m => m[1]);
  if (!imgs.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:12px">Không có ảnh trong bài. Dùng nút 📷 Ảnh trong toolbar bên dưới để thêm.</p>';
    return;
  }
  el.innerHTML = imgs.map((src, i) => `
    <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
      <label class="form-label">Ảnh ${i+1}</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="form-input" style="flex:1;font-size:12px" id="body-img-${i}"
          value="${esc(src)}" placeholder="URL ảnh..."
          oninput="syncBodyImg(${i},this.value)"/>
        <button class="tb-btn" title="Tải ảnh lên từ máy" onclick="triggerImageUpload(url => { const el = document.getElementById('body-img-${i}'); el.value = url; syncBodyImg(${i}, url); applyBodyImg(${i}); })">📤</button>
        <button class="tb-btn" onclick="applyBodyImg(${i})">✓ Áp dụng</button>

      <img src="${src}" id="body-img-prev-${i}"
        style="width:100%;height:90px;object-fit:cover;border-radius:6px;margin-top:6px;background:var(--surf2)"
        onerror="this.style.opacity=0.3"/>
    </div>
  `).join('');
}

function syncBodyImg(idx, newUrl) {
  const prev = document.getElementById(`body-img-prev-${idx}`);
  if (prev) { prev.src = newUrl; prev.style.opacity = 1; }
}

function applyBodyImg(idx) {
  const ta = document.getElementById('body-textarea');
  const inp = document.getElementById(`body-img-${idx}`);
  if (!ta || !inp) return;
  const newUrl = inp.value.trim();
  const imgs = [...ta.value.matchAll(/<img[^>]+src="([^"]+)"/g)];
  if (idx >= imgs.length) return;
  const oldSrc = imgs[idx][1];
  ta.value = ta.value.replace(new RegExp(oldSrc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'), newUrl);
  syncBodyImg(idx, newUrl);
  toast('success', `Đã thay ảnh ${idx+1}`);
  markChanged();
}
