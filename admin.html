// ── Toolbar helpers ────────────────────────────────────────────────────────
function wrapSel(open, close) {
  const ta = document.getElementById('body-textarea');
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const decoded = unesc(open) + sel + unesc(close);
  ta.value = ta.value.slice(0, s) + decoded + ta.value.slice(e);
  markChanged();
}

function insertImg() {
  const url = prompt('URL ảnh:');
  if (!url) return;
  const alt = prompt('Alt text (mô tả ảnh):') || '';
  const cap = prompt('Caption (chú thích):') || '';
  const html = `\n<figure><img src="${url}" alt="${alt}" loading="lazy"/>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>\n`;
  insertAt(html);
}

function insertPara() { insertAt('\n<p></p>\n'); }
function insertBlock() { insertAt('\n<blockquote>\n\n<cite></cite>\n</blockquote>\n'); }

function insertAt(text) {
  const ta = document.getElementById('body-textarea');
  if (!ta) return;
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0, pos) + text + ta.value.slice(pos);
  ta.selectionStart = ta.selectionEnd = pos + text.length;
  ta.focus();
  markChanged();
}

// ── Chế độ soạn thảo Trực quan (WYSIWYG) / HTML ────────────────────────────
function cleanVisualHtml(html) {
  return html
    .replace(/<div>/gi, '<p>').replace(/<\/div>/gi, '</p>')
    .replace(/<p>(\s|&nbsp;|<br\s*\/?>)*<\/p>/gi, '')
    .replace(/ style="[^"]*"/gi, '')
    .replace(/ dir="[^"]*"/gi, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function toggleMetaBox(head) {
  head.classList.toggle('open');
  head.nextElementSibling?.classList.toggle('open');
}

function switchBodyMode(mode) {
  if (mode === BODY_MODE) return;
  const vis = document.getElementById('body-visual');
  const ta = document.getElementById('body-textarea');

  if (BODY_MODE === 'blocks' && mode !== 'blocks') {
    // Rời khỏi chế độ Khối = "tốt nghiệp" sang HTML tự do — không thể quay lại
    // chỉnh theo khối cho bài này nữa (nhưng nội dung HTML vẫn giữ nguyên).
    if (!confirm('Chuyển khỏi chế độ Khối sẽ không thể quay lại chỉnh theo khối (kéo-thả) cho bài này nữa — nội dung vẫn được giữ nguyên dưới dạng HTML. Tiếp tục?')) return;
    const rendered = blocksToHtml(BODY_BLOCKS);
    if (vis) vis.innerHTML = rendered;
    if (ta) ta.value = rendered;
    BODY_BLOCKS = null;
    document.getElementById('body-mode-tab-blocks')?.remove();
  } else if (mode === 'code') {
    if (vis && ta) ta.value = cleanVisualHtml(vis.innerHTML);
  } else if (mode === 'visual' && BODY_MODE === 'code') {
    if (vis && ta) vis.innerHTML = ta.value;
  }

  BODY_MODE = mode;
  document.getElementById('body-mode-tab-blocks')?.classList.toggle('active', mode === 'blocks');
  document.getElementById('body-mode-tab-visual')?.classList.toggle('active', mode === 'visual');
  document.getElementById('body-mode-tab-code')?.classList.toggle('active', mode === 'code');
  document.getElementById('body-blocks-wrap').style.display = mode === 'blocks' ? 'block' : 'none';
  document.getElementById('body-toolbar-visual').style.display = mode === 'visual' ? 'flex' : 'none';
  document.getElementById('body-toolbar-code').style.display = mode === 'code' ? 'flex' : 'none';
  document.getElementById('body-visual-wrap').style.display = mode === 'visual' ? 'block' : 'none';
  document.getElementById('body-code-wrap').style.display = mode === 'code' ? 'block' : 'none';
}

function visExec(cmd, val) {
  document.getElementById('body-visual')?.focus();
  document.execCommand(cmd, false, val);
  markChanged();
}
function visH2() { visExec('formatBlock', 'H2'); }
function visH3() { visExec('formatBlock', 'H3'); }
function visPara() { visExec('formatBlock', 'P'); }
function visBold() { visExec('bold'); }
function visItalic() { visExec('italic'); }
function visList() { visExec('insertUnorderedList'); }
function visImg() {
  const url = prompt('URL ảnh:');
  if (!url) return;
  const alt = prompt('Alt text (mô tả ảnh):') || '';
  const cap = prompt('Caption (chú thích):') || '';
  const html = `<figure><img src="${esc(url)}" alt="${esc(alt)}" loading="lazy"/>${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure><p><br></p>`;
  visExec('insertHTML', html);
}
function visQuote() {
  visExec('insertHTML', '<blockquote><p>Trích dẫn...</p><cite></cite></blockquote><p><br></p>');
}

// Bài nhiều ảnh ở chế độ Trực quan: đếm ảnh + cho phép nhảy nhanh qua từng ảnh
// thay vì phải cuộn tìm thủ công.
let VIS_IMG_JUMP_IDX = -1;
function updateVisImageCount() {
  const btn = document.getElementById('vis-jump-img-btn');
  const countEl = document.getElementById('vis-img-count');
  const vis = document.getElementById('body-visual');
  if (!btn || !countEl || !vis) return;
  const n = vis.querySelectorAll('img').length;
  countEl.textContent = n;
  btn.style.display = n > 0 ? 'inline-flex' : 'none';
}
function visJumpImage() {
  const vis = document.getElementById('body-visual');
  if (!vis) return;
  const imgs = [...vis.querySelectorAll('img')];
  if (!imgs.length) return;
  VIS_IMG_JUMP_IDX = (VIS_IMG_JUMP_IDX + 1) % imgs.length;
  const img = imgs[VIS_IMG_JUMP_IDX];
  const figure = img.closest('figure') || img;
  figure.scrollIntoView({ behavior: 'smooth', block: 'center' });
  figure.classList.add('vis-img-flash');
  setTimeout(() => figure.classList.remove('vis-img-flash'), 1200);
}

// ── Trình soạn thảo Khối (kéo-thả, kiểu Elementor/Gutenberg) ───────────────
// Chỉ dùng cho bài viết MỚI (xem newArticle()) — dữ liệu khối lưu ẩn trong
// <script type="application/json" id="admin-block-data"> ngay sau </article>,
// vô hình với người đọc, chỉ admin.html đọc lại để chỉnh sửa lần sau. Bài cũ
// không có marker này nên không hiện chế độ Khối, tránh tự suy diễn sai.
const BLOCK_TYPES = {
  paragraph: { label: 'Đoạn văn', icon: '¶' },
  heading:   { label: 'Tiêu đề',  icon: 'H' },
  image:     { label: 'Ảnh',      icon: '📷' },
  quote:     { label: 'Trích dẫn', icon: '❝' },
  list:      { label: 'Danh sách', icon: '•' },
};
let DRAG_FROM_IDX = null;

function newBlockData(type) {
  if (type === 'heading') return { type, level: 2, text: '' };
  if (type === 'image') return { type, src: '', alt: '', caption: '', collapsed: false };
  if (type === 'quote') return { type, text: '', cite: '' };
  if (type === 'list') return { type, items: [''] };
  return { type: 'paragraph', html: '' };
}
function blockToHtml(b) {
  if (b.type === 'heading') { const lvl = b.level === 3 ? 3 : 2; return `<h${lvl}>${esc(b.text || '')}</h${lvl}>`; }
  if (b.type === 'image') return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.alt || '')}" loading="lazy">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>` : '';
  if (b.type === 'quote') return `<blockquote><p>${b.text || ''}</p>${b.cite ? `<cite>${esc(b.cite)}</cite>` : ''}</blockquote>`;
  if (b.type === 'list') { const items = (b.items || []).map(s => s.trim()).filter(Boolean); return items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''; }
  return b.html ? `<p>${b.html}</p>` : '';
}
function blocksToHtml(blocks) { return (blocks || []).map(blockToHtml).filter(Boolean).join('\n'); }

// ── Bản HTML "có gắn thẻ" cho khối — chỉ dùng để dựng bản xem trước trong
// iframe (không bao giờ lưu ra file thật). Mỗi khối được đánh data-ohb="{idx}"
// và phần văn bản chính được bật contenteditable trực tiếp trong iframe, đồng
// bộ về BODY_BLOCKS qua postMessage — giống hệt cách Elementor cho sửa ngay
// trên bản xem trước thay vì phải mở form riêng.
function blockToHtmlTagged(b, i) {
  if (b.type === 'heading') {
    const lvl = b.level === 3 ? 3 : 2;
    return `<h${lvl} data-ohb="${i}" data-ohf="text" contenteditable="true">${esc(b.text || '')}</h${lvl}>`;
  }
  if (b.type === 'image') {
    if (!b.src) return `<figure data-oh-jump="block-${i}" class="oh-img-empty"><div class="oh-img-empty-hint">📷 Chưa có ảnh — bấm để thêm bên dưới</div></figure>`;
    return `<figure data-oh-jump="block-${i}"><img src="${esc(b.src)}" alt="${esc(b.alt||'')}"><figcaption data-ohb="${i}" data-ohf="caption" contenteditable="true">${esc(b.caption||'')}</figcaption></figure>`;
  }
  if (b.type === 'quote') {
    return `<blockquote data-oh-jump="block-${i}"><p data-ohb="${i}" data-ohf="text" contenteditable="true">${b.text || ''}</p><cite data-ohb="${i}" data-ohf="cite" contenteditable="true">${esc(b.cite || '')}</cite></blockquote>`;
  }
  if (b.type === 'list') {
    const items = (b.items || []).map(s => s.trim()).filter(Boolean);
    return `<ul data-ohb="${i}" data-ohf="items" contenteditable="true">${items.length ? items.map(it => `<li>${esc(it)}</li>`).join('') : '<li>Mục đầu tiên...</li>'}</ul>`;
  }
  return `<p data-ohb="${i}" data-ohf="html" contenteditable="true">${b.html || ''}</p>`;
}
function blocksToHtmlTagged(blocks) { return (blocks || []).map((b, i) => blockToHtmlTagged(b, i)).join('\n'); }

// Chuyển innerHTML của <ul contenteditable> (gõ trực tiếp trong iframe) ngược
// lại thành mảng chuỗi — Enter trong UL/LI là hành vi gõ danh sách mặc định
// của trình duyệt nên gõ y hệt Word, không cần toolbar riêng.
function parseListItemsFromHtml(html) {
  const tmp = document.createElement('ul');
  tmp.innerHTML = html;
  const items = [...tmp.querySelectorAll('li')].map(li => li.textContent.trim());
  return items.length ? items : [''];
}

async function renderBlockEditor() {
  const el = document.getElementById('body-blocks-editor');
  if (!el) return;
  const addMenu = Object.entries(BLOCK_TYPES).map(([t, m]) =>
    `<button class="tb-btn" onclick="blockAdd('${t}')">${m.icon} ${esc(m.label)}</button>`).join('');

  const imgBlocks = BODY_BLOCKS.map((b, i) => ({ b, i })).filter(x => x.b.type === 'image' && x.b.src);
  const galleryStrip = imgBlocks.length >= 3 ? `
    <div class="block-gallery-strip">
      <div class="block-gallery-label">🖼️ ${imgBlocks.length} ảnh trong bài — bấm để nhảy tới:</div>
      <div class="block-gallery-thumbs">
        ${imgBlocks.map(({ b, i }) => `<img class="block-gallery-thumb" src="${esc(b.src)}" alt="" title="${esc(b.alt || 'Ảnh #' + (i+1))}" onclick="blockScrollTo(${i})" onerror="this.style.opacity=.25">`).join('')}
      </div>
      <div class="block-gallery-actions">
        <button class="btn btn-secondary btn-sm" onclick="blockCollapseAllImages(true)">Thu gọn tất cả</button>
        <button class="btn btn-secondary btn-sm" onclick="blockCollapseAllImages(false)">Mở rộng tất cả</button>
      </div>
    </div>` : '';

  const items = BODY_BLOCKS.map((b, i) => {
    const isCollapsedImg = b.type === 'image' && b.collapsed;
    const toolbar = `
      <div class="block-type-tag">${esc(BLOCK_TYPES[b.type]?.label || b.type)}</div>
      <div class="block-toolbar-mini">
        <span class="block-mini-btn block-drag" draggable="true" ondragstart="blockDragStart(event,${i})" title="Kéo để sắp xếp">⠿</span>
        ${b.type === 'heading' ? `<button class="block-mini-btn" onclick="blockSetLevel(${i},2)" title="H2">H2</button><button class="block-mini-btn" onclick="blockSetLevel(${i},3)" title="H3">H3</button>` : ''}
        ${b.type === 'image' ? `<button class="block-mini-btn" onclick="blockToggleCollapse(${i})" title="${isCollapsedImg ? 'Mở rộng ảnh' : 'Thu gọn ảnh'}">${isCollapsedImg ? '▸' : '▾'}</button>` : ''}
        <button class="block-mini-btn" onclick="blockMove(${i},-1)" title="Lên">↑</button>
        <button class="block-mini-btn" onclick="blockMove(${i},1)" title="Xuống">↓</button>
        <button class="block-mini-btn" onclick="blockDuplicate(${i})" title="Nhân bản">⧉</button>
        <button class="block-mini-btn" onclick="blockDelete(${i})" title="Xoá">🗑</button>
      </div>`;

    let body = '';
    if (b.type === 'paragraph') {
      body = `<p contenteditable="true" oninput="blockTextInput(${i},'html',this)">${b.html || ''}</p>`;
    } else if (b.type === 'heading') {
      const lvl = b.level === 3 ? 3 : 2;
      body = `<h${lvl} contenteditable="true" oninput="blockTextInput(${i},'text',this)">${esc(b.text || '')}</h${lvl}>`;
    } else if (b.type === 'quote') {
      body = `<blockquote><p contenteditable="true" oninput="blockTextInput(${i},'text',this)">${b.text || ''}</p></blockquote>
        <input class="rank-input-sm" style="width:100%;margin-top:6px" placeholder="Nguồn / tác giả (tuỳ chọn)" value="${esc(b.cite || '')}" oninput="blockField(${i},'cite',this.value)"/>`;
    } else if (b.type === 'list') {
      const val = (b.items || ['']).join('\n');
      body = `<textarea class="rank-input-sm" style="width:100%;min-height:70px;font-family:inherit" placeholder="Mỗi dòng 1 mục" oninput="blockListInput(${i},this)">${esc(val)}</textarea>
        <ul id="block-list-prev-${i}" style="margin-top:8px;padding-left:20px;color:var(--dim);font-size:14px">${(b.items||[]).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
    } else if (b.type === 'image') {
      if (isCollapsedImg) {
        body = `<div class="block-img-collapsed-row" onclick="blockToggleCollapse(${i})" title="Bấm để mở rộng">
          ${b.src ? `<img class="block-img-collapsed-thumb" src="${esc(b.src)}" alt="" onerror="this.style.opacity=.25">` : `<div class="block-img-collapsed-thumb block-img-collapsed-empty">📷</div>`}
          <div class="block-img-collapsed-info">
            <div class="block-img-collapsed-alt">${esc(b.alt || '(chưa có alt text)')}</div>
            <div class="block-img-collapsed-caption">${esc(b.caption || '')}</div>
          </div>
        </div>`;
      } else {
        body = (b.src
          ? `<figure><img src="${esc(b.src)}" alt="${esc(b.alt||'')}" onerror="this.style.display='none'"></figure>`
          : `<div class="block-img-empty">Chưa có ảnh — nhập URL bên dưới</div>`) +
          `<div class="block-field-row">
            <input class="rank-input-sm" placeholder="URL ảnh" value="${esc(b.src||'')}" oninput="blockField(${i},'src',this.value)" onblur="renderBlockEditor()"/>
            <input class="rank-input-sm" placeholder="Alt text" value="${esc(b.alt||'')}" oninput="blockField(${i},'alt',this.value)"/>
            <input class="rank-input-sm" placeholder="Chú thích (tuỳ chọn)" value="${esc(b.caption||'')}" oninput="blockField(${i},'caption',this.value)"/>
          </div>`;
      }
    }

    return `<div class="block-item${isCollapsedImg ? ' block-item-collapsed' : ''}" id="block-item-${i}" draggable="false" ondragover="event.preventDefault()" ondrop="blockDrop(event,${i})">${toolbar}${body}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="block-canvas">${galleryStrip}${items || '<div style="color:var(--muted);font-size:13px;padding:10px">Chưa có khối nào — thêm khối bên dưới.</div>'}</div>
    <div class="block-add-bar">${addMenu}</div>
  `;
}

function blockToggleCollapse(i) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i].collapsed = !BODY_BLOCKS[i].collapsed; renderBlockEditor(); } }
function blockCollapseAllImages(collapse) {
  BODY_BLOCKS.forEach(b => { if (b.type === 'image') b.collapsed = collapse; });
  renderBlockEditor();
}
function blockScrollTo(i) {
  const target = document.getElementById('block-item-' + i);
  if (!target) return;
  if (BODY_BLOCKS[i] && BODY_BLOCKS[i].collapsed) { BODY_BLOCKS[i].collapsed = false; renderBlockEditor(); }
  requestAnimationFrame(() => {
    const el = document.getElementById('block-item-' + i);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('block-item-flash');
    setTimeout(() => el.classList.remove('block-item-flash'), 1200);
  });
}

function blockField(i, key, value) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i][key] = value; markChanged(); } }
function blockTextInput(i, key, el) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i][key] = el.innerHTML; markChanged(); } }
function blockListInput(i, el) {
  if (!BODY_BLOCKS[i]) return;
  const items = el.value.split('\n');
  BODY_BLOCKS[i].items = items;
  const prev = document.getElementById('block-list-prev-' + i);
  if (prev) prev.innerHTML = items.map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join('');
  markChanged();
}
function blockSetLevel(i, level) { if (BODY_BLOCKS[i]) { BODY_BLOCKS[i].level = level; renderBlockEditor(); markChanged(); } }
function blockAdd(type) { BODY_BLOCKS.push(newBlockData(type)); renderBlockEditor(); markChanged(); }
function blockDuplicate(i) { BODY_BLOCKS.splice(i + 1, 0, JSON.parse(JSON.stringify(BODY_BLOCKS[i]))); renderBlockEditor(); markChanged(); }
function blockDelete(i) { if (!confirm('Xoá khối này?')) return; BODY_BLOCKS.splice(i, 1); renderBlockEditor(); markChanged(); }
function blockMove(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= BODY_BLOCKS.length) return;
  const t = BODY_BLOCKS[i]; BODY_BLOCKS[i] = BODY_BLOCKS[j]; BODY_BLOCKS[j] = t;
  renderBlockEditor(); markChanged();
}
function blockDragStart(e, i) { DRAG_FROM_IDX = i; e.dataTransfer.effectAllowed = 'move'; }
function blockDrop(e, i) {
  e.preventDefault();
  if (DRAG_FROM_IDX === null || DRAG_FROM_IDX === i) return;
  const [moved] = BODY_BLOCKS.splice(DRAG_FROM_IDX, 1);
  BODY_BLOCKS.splice(i, 0, moved);
  DRAG_FROM_IDX = null;
  renderBlockEditor(); markChanged();
}

// ── Bản xem trước thật kiểu Elementor (iframe + click/gõ trực tiếp) ─────────
// Dựng từ chính currentRawHtml (khung sườn thật của bài, y hệt file sẽ lưu),
// vá lại tiêu đề/mô tả/danh mục/ảnh bìa/nội dung theo trạng thái đang chỉnh,
// rồi gắn bridge script để cho gõ trực tiếp + click để nhảy tới control.
function buildArticlePreviewHtml() {
  let html = currentRawHtml;
  const cat     = document.getElementById('ed-cat')?.value || 'Gaming';
  const hero    = document.getElementById('ed-hero')?.value || '';
  const heroPos = document.getElementById('ed-hero-pos')?.value || '50';

  html = html.replace(/(class="art-hero-img"\s+style=")[^"]*(")/,
    `$1background-image:url(${hero});background-position:center ${heroPos}%;background-color:#0b0418;$2 data-oh-jump="heroimg"`);

  const titleTag = /<h1 class="art-hero-title">/.test(html) ? 'art-hero-title' : 'art-hero-title lang-vi active';
  html = html.replace(new RegExp(`(<h1 class="${titleTag}")>[^<]*(<\\/h1>)`),
    (m, p1, p2) => `${p1} contenteditable="true" data-ohfield="title">${esc(ART_TITLE)}${p2}`);

  if (/<p class="art-hero-excerpt">/.test(html)) {
    html = html.replace(/(<p class="art-hero-excerpt")>[^<]*(<\/p>)/,
      (m, p1, p2) => `${p1} contenteditable="true" data-ohfield="excerpt">${esc(ART_EXCERPT)}${p2}`);
  }
  html = html.replace(/(<span class="art-hero-cat")>[^<]*(<\/span>)/,
    (m, p1, p2) => `${p1} data-oh-jump="cat">${esc(cat)}${p2}`);
  html = html.replace(/(<span class="am-tag">)[^<]*(<\/span>)/, (m, p1, p2) => p1 + esc(cat) + p2);

  const bodyTagged = BODY_BLOCKS
    ? blocksToHtmlTagged(BODY_BLOCKS)
    : `<div data-oh-jump="body-editor">${document.getElementById('body-visual')?.innerHTML || ''}</div>`;
  if (/<article class="art-body">[\s\S]*?<\/article>/.test(html)) {
    html = html.replace(/<article class="art-body">[\s\S]*?<\/article>/, `<article class="art-body">\n${bodyTagged}\n</article>`);
  } else {
    html = html.replace(/<article class="art-body lang-vi active">[\s\S]*?<\/article>/, `<article class="art-body lang-vi active">\n${bodyTagged}\n</article>`);
  }

  html = html.replace('<head>', '<head><base href="https://otahub.asia/">');
  html = html.replace('</body>', ART_BRIDGE_SCRIPT + '</body>');
  return html;
}

const ART_BRIDGE_SCRIPT = `<script>(function(){
  var style = document.createElement('style');
  style.textContent =
    '[data-oh-jump]{cursor:pointer;outline-offset:2px;transition:outline .12s}' +
    '[data-oh-jump]:hover{outline:2px dashed #00e5ff}' +
    '[contenteditable="true"]{outline-offset:3px;transition:outline .12s;cursor:text}' +
    '[contenteditable="true"]:hover{outline:2px dashed rgba(0,229,255,.5)}' +
    '[contenteditable="true"]:focus{outline:2px solid #00e5ff}' +
    'figcaption:empty:before{content:"+ Thêm chú thích ảnh (bấm để nhập)";opacity:.45}' +
    'cite:empty:before{content:"+ Thêm nguồn / tác giả (tuỳ chọn)";opacity:.45}' +
    '.oh-img-empty{display:flex;align-items:center;justify-content:center;min-height:160px;border:2px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.03)}' +
    '.oh-img-empty-hint{color:rgba(240,238,255,.5);font-size:14px}';
  document.head.appendChild(style);

  document.addEventListener('click', function(e){
    var editable = e.target.closest('[contenteditable="true"]');
    if (editable) return; // để trình duyệt tự đặt con trỏ, gõ bình thường
    var jumpEl = e.target.closest('[data-oh-jump]');
    e.preventDefault();
    e.stopPropagation();
    if (jumpEl) parent.postMessage({ type:'art-jump', target: jumpEl.getAttribute('data-oh-jump') }, '*');
  }, true);

  document.addEventListener('input', function(e){
    var fieldEl = e.target.closest('[data-ohfield]');
    if (fieldEl) {
      parent.postMessage({ type:'art-field-input', field: fieldEl.getAttribute('data-ohfield'), value: fieldEl.innerText }, '*');
      return;
    }
    var blockEl = e.target.closest('[data-ohb]');
    if (blockEl) {
      var field = blockEl.getAttribute('data-ohf');
      var value = (field === 'cite' || field === 'caption') ? blockEl.innerText : blockEl.innerHTML;
      parent.postMessage({ type:'art-block-input', idx: parseInt(blockEl.getAttribute('data-ohb'), 10), field: field, value: value }, '*');
    }
  }, true);
})();<\/script>`;

let __artMsgBound = false;
function bindArticleBridgeMessages() {
  if (__artMsgBound) return;
  __artMsgBound = true;
  window.addEventListener('message', function(e) {
    const d = e.data;
    if (!d || !d.type) return;
    if (d.type === 'art-field-input') {
      if (d.field === 'title') ART_TITLE = d.value;
      else if (d.field === 'excerpt') ART_EXCERPT = d.value;
      markChangedNoRebuild();
    } else if (d.type === 'art-block-input') {
      const b = BODY_BLOCKS && BODY_BLOCKS[d.idx];
      if (!b) return;
      if (d.field === 'items') b.items = parseListItemsFromHtml(d.value);
      else b[d.field] = d.value;
      markChangedNoRebuild();
      scheduleBlockListRefresh();
    } else if (d.type === 'art-jump') {
      articleJumpTo(d.target);
    }
  });
}

function articleJumpTo(target) {
  let el = null;
  if (target === 'heroimg') el = document.getElementById('ed-hero');
  else if (target === 'cat') el = document.getElementById('ed-cat');
  else if (target === 'body-editor') el = document.getElementById('body-blocks-wrap') || document.getElementById('body-visual-wrap');
  else if (target && target.startsWith('block-')) { blockScrollTo(parseInt(target.slice(6), 10)); return; }
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('block-item-flash');
  (el.closest('.side-box') || el).classList.add('block-item-flash');
  setTimeout(() => { el.classList.remove('block-item-flash'); (el.closest('.side-box') || el).classList.remove('block-item-flash'); }, 1200);
  try { el.focus({ preventScroll: true }); } catch(e) {}
}

function scheduleArticlePreviewRefresh() {
  if (ART_PREVIEW_TIMER) clearTimeout(ART_PREVIEW_TIMER);
  ART_PREVIEW_TIMER = setTimeout(() => {
    const iframe = document.getElementById('art-visual-iframe');
    if (iframe) iframe.srcdoc = buildArticlePreviewHtml();
  }, 700);
}
function scheduleBlockListRefresh() {
  if (ART_BLOCKLIST_TIMER) clearTimeout(ART_BLOCKLIST_TIMER);
  ART_BLOCKLIST_TIMER = setTimeout(() => { if (BODY_BLOCKS) renderBlockEditor(); }, 900);
}

// ── Save ───────────────────────────────────────────────────────────────────
async function saveArticle() {
  // Nếu đang ở chế độ Trực quan hoặc Khối, đồng bộ nội dung sang ô HTML thô
  // trước khi lưu (ô HTML thô luôn là nguồn dữ liệu thật sự được ghi vào file).
  if (BODY_MODE === 'visual') {
    const vis = document.getElementById('body-visual');
    const ta = document.getElementById('body-textarea');
    if (vis && ta) ta.value = cleanVisualHtml(vis.innerHTML);
  } else if (BODY_MODE === 'blocks') {
    const ta = document.getElementById('body-textarea');
    if (ta) ta.value = blocksToHtml(BODY_BLOCKS);
  }

  const title   = ART_TITLE || '';
  const excerpt = ART_EXCERPT || '';
  const desc    = document.getElementById('ed-desc')?.value || '';
  const hero    = document.getElementById('ed-hero')?.value || '';
  const heroPos = document.getElementById('ed-hero-pos')?.value || '50';
  const cat     = document.getElementById('ed-cat')?.value || 'Gaming';
  const bodyVi  = document.getElementById('body-textarea')?.value || '';

  if (!currentFile) return;

  const btn = document.getElementById('save-btn');
  btn.textContent = '⏳ Đang lưu...'; btn.disabled = true;

  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (dot) dot.className = 'status-dot saving';
  if (txt) txt.textContent = 'Đang commit lên GitHub...';

  const isNewFile = !currentSha;
  try {
    // Bài đã tồn tại: lấy lại nội dung mới nhất từ GitHub để không đè lên thay đổi khác.
    // Bài mới: dùng template đang có sẵn trong editor, sha để trống để GitHub tự tạo file.
    let html, sha;
    if (isNewFile) {
      html = currentRawHtml;
      sha = undefined;
    } else {
      const data = await ghGet(currentFile);
      html = decodeURIComponent(escape(atob(data.content)));
      sha = data.sha;
    }

    // Apply edits (esc() để tránh vỡ HTML nếu tiêu đề/mô tả chứa <, >, &, ")
    html = html.replace(/<title>[^<]+<\/title>/, `<title>${esc(title)} · OtaHub</title>`);
    html = html.replace(/(<meta name="description" content=")[^"]*(")/,   `$1${esc(desc)}$2`);
    html = html.replace(/(<meta property="og:title" content=")[^"]*(")/,  `$1${esc(title)} · OtaHub$2`);
    html = html.replace(/(<meta property="og:description" content=")[^"]*(")/,  `$1${esc(desc)}$2`);
    html = html.replace(/(<meta name="twitter:title" content=")[^"]*(")/,  `$1${esc(title)} · OtaHub$2`);
    html = html.replace(/(<meta name="twitter:description" content=")[^"]*(")/,  `$1${esc(desc)}$2`);
    html = html.replace(/("headline": ")[^"]*(")/,  `$1${title.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}$2`);
    html = html.replace(/(<meta property="article:section" content=")[^"]*(")/,  `$1${esc(cat)}$2`);
    // Hero
    html = html.replace(/(class="art-hero-img"\s+style=")[^"]*(")/,
      `$1background-image:url(${hero});background-position:center ${heroPos}%;background-color:#0b0418;$2`);
    // H1 — hỗ trợ cả mẫu hiện tại (art-hero-title) lẫn mẫu cũ (art-hero-title lang-vi active)
    if (/<h1 class="art-hero-title">[^<]*<\/h1>/.test(html)) {
      html = html.replace(/(<h1 class="art-hero-title">)[^<]*(<\/h1>)/, `$1${esc(title)}$2`);
    } else {
      html = html.replace(/(<h1 class="art-hero-title lang-vi active">)[^<]*(<\/h1>)/, `$1${esc(title)}$2`);
    }
    // Mô tả ngắn dưới tiêu đề, trên ảnh bìa (trước đây tồn tại trong mẫu nhưng
    // chưa từng được đọc/lưu — nay là field thật, xem extractExcerpt()).
    if (/<p class="art-hero-excerpt">[^<]*<\/p>/.test(html)) {
      html = html.replace(/(<p class="art-hero-excerpt">)[^<]*(<\/p>)/, `$1${esc(excerpt)}$2`);
    }
    // Body — hỗ trợ cả mẫu hiện tại (art-body) lẫn mẫu cũ (art-body lang-vi active)
    if (/<article class="art-body">[\s\S]*?<\/article>/.test(html)) {
      html = html.replace(/<article class="art-body">[\s\S]*?<\/article>/, `<article class="art-body">\n${bodyVi}\n</article>`);
    } else {
      html = html.replace(/<article class="art-body lang-vi active">[\s\S]*?<\/article>/, `<article class="art-body lang-vi active">\n${bodyVi}\n</article>`);
    }

    // Dữ liệu Khối ẩn (admin-block-data) — chỉ tồn tại cho bài dùng chế độ Khối.
    // Nếu vẫn đang dùng Khối: ghi lại JSON khối mới nhất để lần sau mở lại vẫn
    // chỉnh được bằng kéo-thả. Nếu đã "tốt nghiệp" sang Trực quan/HTML (BODY_BLOCKS
    // = null) nhưng file vẫn còn marker cũ: gỡ bỏ để không lưu dữ liệu khối lỗi thời.
    const blockMarkerRe = /<script type="application\/json" id="admin-block-data">[\s\S]*?<\/script>\n?/;
    if (BODY_BLOCKS) {
      const newMarker = `<script type="application/json" id="admin-block-data">${JSON.stringify(BODY_BLOCKS)}<\/script>\n`;
      html = blockMarkerRe.test(html) ? html.replace(blockMarkerRe, newMarker) : html.replace(/<\/article>/, `</article>\n${newMarker}`);
    } else if (blockMarkerRe.test(html)) {
      html = html.replace(blockMarkerRe, '');
    }

    const putResult = await ghPut(currentFile, html, sha, `[admin] cap nhat: ${title.slice(0,50)}`);

    // Update local state — với bài mới, lấy sha thật từ kết quả commit để lần
    // lưu tiếp theo được nhận diện là "sửa bài đã tồn tại" thay vì tạo lại.
    currentSha = putResult?.content?.sha || sha;
    currentRawHtml = html;
    let art = ARTICLES.find(a => a.file === currentFile);
    if (art) { art.title = title; art.desc = desc; art.hero = hero; art.cat = cat; }
    else { art = { file: currentFile, sha: currentSha, title, desc, hero, cat, date: '' }; ARTICLES.unshift(art); }

    HAS_UNSAVED_CHANGES = false;
    if (dot) dot.className = 'status-dot';
    if (txt) txt.textContent = 'Đã lưu • ' + new Date().toLocaleTimeString('vi-VN');
    const log = document.getElementById('save-log');
    if (log) log.innerHTML = `✅ Commit lúc ${new Date().toLocaleTimeString('vi-VN')}<br>` + log.innerHTML;

    toast('success', '✅ Đã lưu và deploy! Chờ ~1-2 phút để live.');

    if (isNewFile && confirm('Bài viết mới đã được lưu.\n\nBạn có muốn tự động thêm bài này vào Trang chủ, trang chuyên mục, Tìm kiếm, RSS và Sitemap không?')) {
      await syncNewArticle({ file: currentFile, title, desc, cat, hero });
    }
  } catch(e) {
    if (dot) dot.className = 'status-dot error';
    if (txt) txt.textContent = 'Lỗi: ' + e.message;
    toast('error', 'Lỗi lưu: ' + e.message);
  } finally {
    btn.textContent = '💾 Lưu & Deploy'; btn.disabled = false;
  }
}

// ── Rankings Editor ────────────────────────────────────────────────────────
let rankingsHtml = '';
let rankingsSha  = '';
let CATS_DATA    = null;
let currentRankTab = 'pc';

async function loadRankings() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải bảng xếp hạng...</span></div>`);
  try {
    const data = await ghGet('rankings.html');
    rankingsHtml = decodeURIComponent(escape(atob(data.content)));
    rankingsSha  = data.sha;
    // Extract CATS object
    const m = rankingsHtml.match(/const CATS\s*=\s*(\{[\s\S]*?\n\})\s*;/);
    if (!m) throw new Error('Không tìm thấy dữ liệu CATS trong rankings.html');
    CATS_DATA = new Function('return ' + m[1])();
    renderRankingsEditor();
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi: ${e.message}</p></div>`);
  }
}

function renderRankingsEditor() {
  const tabs = Object.keys(CATS_DATA).map(k => `
    <button class="rank-tab ${k===currentRankTab?'active':''}" onclick="switchRankTab('${k}')">
      ${CATS_DATA[k].icon} ${CATS_DATA[k].label}
    </button>`).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Bảng xếp hạng <small>rankings.html</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="https://otahub.asia/rankings" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" id="rank-save-btn" onclick="saveRankings()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px">
        <div class="rank-tabs" id="rank-tabs">${tabs}</div>
        <div id="rank-content"></div>
      </div>
    </div>
  `);
  renderRankTab(currentRankTab);
}

function switchRankTab(key) {
  currentRankTab = key;
  document.querySelectorAll('.rank-tab').forEach((t,i) => {
    t.classList.toggle('active', Object.keys(CATS_DATA)[i] === key);
  });
  renderRankTab(key);
}

function renderRankTab(key) {
  const cat = CATS_DATA[key];
  if (!cat) return;
  const el = document.getElementById('rank-content');
  if (!el) return;

  const topHtml = (cat.top||[]).map((e,i) => renderRankEntry(key,'top',i,e,true)).join('');
  const restHtml = (cat.rest||[]).map((e,i) => renderRankEntry(key,'rest',i,e,false)).join('');

  el.innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">
      💡 Chỉnh URL ảnh, tên, điểm số rồi nhấn <strong style="color:var(--cyan)">💾 Lưu & Deploy</strong>
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">🏆 Top 3</div>
    ${topHtml}
    ${restHtml ? `<div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px">Còn lại</div>${restHtml}` : ''}
  `;
}

function renderRankEntry(catKey, listKey, idx, e, isTop) {
  const numLabel = listKey==='top' ? ['🥇','🥈','🥉'][idx]||`#${idx+1}` : `#${idx+4}`;
  const numClass = listKey==='top' ? ['gold','silver','bronze'][idx]||'' : '';
  const imgId    = `ri_${catKey}_${listKey}_${idx}`;
  const titleId  = `rt_${catKey}_${listKey}_${idx}`;
  const studioId = `rs_${catKey}_${listKey}_${idx}`;
  const scoreId  = `rsc_${catKey}_${listKey}_${idx}`;
  const trendId  = `rtr_${catKey}_${listKey}_${idx}`;

  return `
    <div class="rank-entry${isTop?' top3':''}">
      <div style="text-align:center">
        <div class="rank-num ${numClass}">${numLabel}</div>
        <img class="rank-img-prev" id="prev_${imgId}" src="${esc(e.img||'')}"
          onerror="this.style.opacity=.3" alt="${esc(e.title||'')}"/>
      </div>
      <div class="rank-fields">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">URL ảnh</div>
          <input class="rank-input-sm" style="width:100%" id="${imgId}" value="${esc(e.img||'')}"
            oninput="document.getElementById('prev_${imgId}').src=this.value;updateRankData('${catKey}','${listKey}',${idx},'img',this.value)"/>
        </div>
        <div class="rank-row">
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Tên</div>
            <input class="rank-input-sm" id="${titleId}" value="${esc(e.title||'')}"
              oninput="updateRankData('${catKey}','${listKey}',${idx},'title',this.value)"/>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Điểm</div>
            <input class="rank-input-sm" id="${scoreId}" value="${esc(e.score||'')}"
              oninput="updateRankData('${catKey}','${listKey}',${idx},'score',this.value)"/>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">Trend</div>
            <input class="rank-input-sm" id="${trendId}" value="${esc(e.trend||'')}"

function updateRankData(catKey, listKey, idx, field, value) {

  list[idx][field] = value;
}

async function saveRankings() {
  const btn = document.getElementById('rank-save-btn');
  btn.textContent = '⏳ Đang lưu...'; btn.disabled = true;
  try {
    // Re-fetch to get latest SHA
    const latest = await ghGet('rankings.html');
    const sha = latest.sha;
    let html = decodeURIComponent(escape(atob(latest.content)));

    // Rebuild CATS entries via targeted replacements
    // Replace each entry's img and title in the CATS block
    for (const catKey of Object.keys(CATS_DATA)) {
      const cat = CATS_DATA[catKey];
      for (const listKey of ['top','rest']) {
        (cat[listKey]||[]).forEach((entry, idx) => {
          // Replace img URL
          if (entry._origImg && entry._origImg !== entry.img) {
            html = html.replace(
              new RegExp(entry._origImg.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'),
              entry.img
            );
          }
        });
      }
    }

    // Better: replace full CATS block with serialized version
    const newCats = 'const CATS = ' + serializeCats(CATS_DATA) + ';';
    html = html.replace(/const CATS\s*=\s*\{[\s\S]*?\n\}\s*;/, newCats);

    await ghPut('rankings.html', html, sha, '[admin] cap nhat bang xep hang');
    toast('success', '✅ Đã lưu bảng xếp hạng! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  } finally {
    btn.textContent = '💾 Lưu & Deploy'; btn.disabled = false;
  }
}

function serializeCats(cats) {
  // Custom serializer to keep JS object style
  function serEntry(e) {
    const parts = [];
    for (const [k,v] of Object.entries(e)) {
      if (v === null) parts.push(`${k}:null`);
      else if (typeof v === 'object') parts.push(`${k}:${JSON.stringify(v)}`);
      else if (typeof v === 'string') parts.push(`${k}:'${v.replace(/'/g,"\\'")}'`);
      else parts.push(`${k}:${v}`);
    }
    return '{' + parts.join(',') + '}';
  }
  function serList(arr) {
    return '[' + arr.map(serEntry).join(',\n      ') + ']';
  }
  const catParts = Object.entries(cats).map(([k,cat]) => {
    const entryParts = [];
    for (const [ck,cv] of Object.entries(cat)) {
      if (Array.isArray(cv)) entryParts.push(`${ck}:${serList(cv)}`);
      else if (typeof cv === 'string') entryParts.push(`${ck}:'${cv.replace(/'/g,"\\'")}'`);
      else entryParts.push(`${ck}:${JSON.stringify(cv)}`);
    }
    return `  ${k}:{\n    ${entryParts.join(',\n    ')}\n  }`;
  });
  return '{\n' + catParts.join(',\n') + '\n}';
}

function fieldGet(raw, re) { const m = raw.match(re); return m ? m[1] : ''; }
function replaceField(raw, pattern, newVal) {
  if (newVal === undefined) return raw;
  return pattern.test(raw) ? raw.replace(pattern, (full, p1, p2) => p1 + esc(newVal) + p2) : raw;
}
function splitBlocks(html, startPattern) {
  const re = new RegExp(startPattern.source, 'g');
  const starts = [];
  let mm;
  while ((mm = re.exec(html))) starts.push(mm.index);
  const blocks = [];
  for (let i = 0; i < starts.length; i++) blocks.push(html.slice(starts[i], i + 1 < starts.length ? starts[i + 1] : html.length));
  return blocks;
}
async function ghSpliceInsert(path, anchorPattern, insertHtml, after, commitMsg) {
  const data = await ghGet(path);
  let content = decodeURIComponent(escape(atob(data.content)));
  if (!anchorPattern.test(content)) throw new Error('Không tìm thấy điểm chèn trong ' + path);
  content = after
    ? content.replace(anchorPattern, (m) => m + insertHtml)
    : content.replace(anchorPattern, (m) => insertHtml + m);
  await ghPut(path, content, data.sha, commitMsg);
}

}
function acApply(raw, f) {

let DRAG_HUB_IDX = null;

// ── Bộ phân tích/tái tạo HTML trang chủ (đã kiểm chứng round-trip byte-perfect) ──
function hUnesc(s) { return String(s ?? '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"); }
function splitBlocksTrimmed(html, startPattern, closeTag) {
  const re = new RegExp(startPattern.source, 'g');
  const starts = [];
  let mm;
  while ((mm = re.exec(html))) starts.push(mm.index);
  const blocks = [];
  for (let i = 0; i < starts.length; i++) {
    const raw = html.slice(starts[i], i + 1 < starts.length ? starts[i + 1] : html.length);
    const ci = raw.indexOf(closeTag);
    blocks.push(ci === -1 ? raw : raw.slice(0, ci + closeTag.length));
  }
  return blocks;
}
function hSection(str, startAnchor, endAnchor) {
  const si = str.indexOf(startAnchor);
  if (si === -1) return { ok: false };
  const from = si + startAnchor.length;
  const ei = str.indexOf(endAnchor, from);
  if (ei === -1) return { ok: false };
  return { ok: true, raw: str.slice(from, ei) };
}
function hReplaceSection(html, startAnchor, endAnchor, rebuildFn) {
  const si = html.indexOf(startAnchor);
  if (si === -1) { console.log('MISSING SECTION:', startAnchor); return html; }
  const from = si + startAnchor.length;
  const ei = html.indexOf(endAnchor, from);
  if (ei === -1) { console.log('MISSING END ANCHOR for:', startAnchor); return html; }
  return html.slice(0, from) + rebuildFn() + html.slice(ei);
}

    meta: fieldGet(item, /class="mi-meta">([^<]*)</),
    score: fieldGet(item, /class="mi-score"[^>]*>([^<]*)</),
  };
}
function mangaItemApply(item, f) {
  let out = item;
  out = replaceField(out, /(<a class="manga-item[^"]*" href=")[^"]*(")/, f.href);
  out = replaceField(out, /(<img src=")[^"]*(")/, f.img);
  out = replaceField(out, /(<img[^>]+alt=")[^"]*(")/, f.alt);
  out = replaceField(out, /(class="mi-title">)[^<]*(<)/, f.title);
  out = replaceField(out, /(class="mi-meta">)[^<]*(<)/, f.meta);
  out = replaceField(out, /(class="mi-score"[^>]*>)[^<]*(<)/, f.score);
  return out;
}

// ── w-card (tin mới nhất) ──
function wCardFields(item) {

    alt: fieldGet(item, /<img[^>]+alt="([^"]*)"/),

    title: fieldGet(item, /class="wc-t">([^<]*)</),
    meta: fieldGet(item, /class="wc-m">([^<]*)</),
  };
}
function wCardApply(item, f) {
  let out = item;
  out = replaceField(out, /(<a href=")[^"]*(")/, f.href);
  out = replaceField(out, /(<img src=")[^"]*(")/, f.img);
  out = replaceField(out, /(<img[^>]+alt=")[^"]*(")/, f.alt);
  out = replaceField(out, /(class="wc-c"[^>]*>)[^<]*(<)/, f.cat);
  out = replaceField(out, /(class="wc-t">)[^<]*(<)/, f.title);
  out = replaceField(out, /(class="wc-m">)[^<]*(<)/, f.meta);

}

// ── t-item (đang hot) ──
function tItemFields(item) {

    title: fieldGet(item, /class="ti-t">([^<]*)</),
    meta: fieldGet(item, /class="ti-m">([^<]*)</),
  };
}
function tItemApply(item, f) {
  let out = item;
  out = replaceField(out, /(<a class="t-item" href=")[^"]*(")/, f.href);
  out = replaceField(out, /(<img src=")[^"]*(")/, f.img);
  out = replaceField(out, /(<img[^>]+alt=")[^"]*(")/, f.alt);
  out = replaceField(out, /(class="ti-t">)[^<]*(<)/, f.title);

}

// ── cat-b (danh mục) ──
function catTileFields(item) {
  return {
    href: fieldGet(item, /<a href="([^"]*)"/),
    name: fieldGet(item, /class="cat-name">([^<]*)</),
    count: fieldGet(item, /class="cat-ct">([^<]*) bài viết</),

}
function catTileApply(item, f) {

// ── mục anime theo mùa (đối tượng JS thuần) ──
function animeItemStr(f) {
  return `{title:'${String(f.title).replace(/'/g,"\\'")}',genre:'${String(f.genre).replace(/'/g,"\\'")}',score:'${f.score}',day:'${String(f.day).replace(/'/g,"\\'")}',ep:'${String(f.ep).replace(/'/g,"\\'")}',status:'${f.status}',img:'${f.img}'}`;
}

function loadHomeData(raw) {
  const hero = homeHeroFields(raw);

  const heroSideSec = hSection(raw, '<aside class="hero-side">', '</aside>');
  const heroSidePrefix = heroSideSec.ok ? heroSideSec.raw.slice(0, heroSideSec.raw.indexOf('<article')) : '';
  const heroSide = heroSideSec.ok ? splitBlocksTrimmed(heroSideSec.raw, /<article class="s-art"/, '</article>').map(r => ({ raw: r })) : [];

  const tickerSec = hSection(raw, '<div class="tick-track">', '</div></div>');
  const ticker = tickerSec.ok ? [...tickerSec.raw.matchAll(/<span class="tick-item">([^<]*)<\/span>/g)].map(m => hUnesc(m[1])) : [];

  const marqueeSec = hSection(raw, '<div class="mq-track">', '</div>');
  const marquee = marqueeSec.ok ? splitBlocksTrimmed(marqueeSec.raw, /<a class="mq-item"/, '</a>').map(r => ({ raw: r })) : [];

  const fm = raw.match(/<!-- ADMIN:FEATURED_START -->([\s\S]*?)<!-- ADMIN:FEATURED_END -->/);
  let featured = { fc: '', sc: [] };
  if (fm) {
    const featuredHtml = fm[1];
    const scStart = featuredHtml.indexOf('<a class="sc"');
    const fcRaw = (scStart === -1 ? featuredHtml : featuredHtml.slice(0, scStart)).trim();
    const scBlocks = scStart === -1 ? [] : splitBlocksTrimmed(featuredHtml.slice(scStart), /<a class="sc" href="[^"]*"/, '</a>');
    featured = { fc: fcRaw, sc: scBlocks.map(r => ({ raw: r })) };
  }

  const rankSec = hSection(raw, '<div class="rank-grid">', '<div class="wrap rv">\n\n\n  <div class="sec-h"><span class="sec-t">Anime');
  let rankings = { pc: [], mobile: [], pcPrefix: '', mobilePrefix: '' };
  if (rankSec.ok) {
    const cardsRaw = rankSec.raw.split('<div class="rk-card">').slice(1);
    function parseCard(cardChunk) {
      const firstItemIdx = cardChunk.indexOf('<a class="rk-item');
      const prefix = firstItemIdx === -1 ? cardChunk : cardChunk.slice(0, firstItemIdx);
      const items = firstItemIdx === -1 ? [] : splitBlocksTrimmed(cardChunk.slice(firstItemIdx), /<a class="rk-item[^"]*"/, '</a>');
      return { prefix, items: items.map(r => ({ raw: r })) };
    }
    if (cardsRaw[0]) { const c = parseCard(cardsRaw[0]); rankings.pc = c.items; rankings.pcPrefix = c.prefix; }
    if (cardsRaw[1]) { const c = parseCard(cardsRaw[1]); rankings.mobile = c.items; rankings.mobilePrefix = c.prefix; }
  }

  const mangaSec = hSection(raw, '<div class="manga-grid">', '<div class="wrap rv" style="padding-top:0">');
  let manga = { manga: [], manhwa: [], manhua: [], mangaPrefix: '', manhwaPrefix: '', manhuaPrefix: '' };
  if (mangaSec.ok) {
    const colsRaw = mangaSec.raw.split('<div class="manga-col">').slice(1);
    const keys = ['manga', 'manhwa', 'manhua'];
    colsRaw.forEach((chunk, i) => {
      if (!keys[i]) return;
      const firstItemIdx = chunk.indexOf('<a class="manga-item');
      const prefix = firstItemIdx === -1 ? chunk : chunk.slice(0, firstItemIdx);
      const items = firstItemIdx === -1 ? [] : splitBlocksTrimmed(chunk.slice(firstItemIdx), /<a class="manga-item[^"]*"/, '</a>');
      manga[keys[i]] = items.map(r => ({ raw: r }));
      manga[keys[i] + 'Prefix'] = prefix;
    });
  }

  const latestSec = hSection(raw, '<div class="latest-wrap">', '<div class="wrap rv" style="padding-bottom:0">');
  let latestNews = [], trending = [], latestSuffix = '', trendingPrefix = '';
  if (latestSec.ok) {
    latestNews = splitBlocksTrimmed(latestSec.raw, /<article class="w-card">/, '</article>').map(r => ({ raw: r }));
    const lastArticleEnd = latestSec.raw.lastIndexOf('</article>') + '</article>'.length;
    const asideStart = latestSec.raw.indexOf('<aside class="latest-side">');
    latestSuffix = latestSec.raw.slice(lastArticleEnd, asideStart);
    const asideSec = latestSec.raw.slice(asideStart);
    const trendHeadEnd = asideSec.indexOf('<a class="t-item"');
    trendingPrefix = asideSec.slice(0, trendHeadEnd);
    trending = splitBlocksTrimmed(asideSec.slice(trendHeadEnd), /<a class="t-item"/, '</a>').map(r => ({ raw: r }));
  }

  const catSec = hSection(raw, '<div class="cat-grid">', '<section class="nl"');
  const catGrid = catSec.ok ? splitBlocksTrimmed(catSec.raw, /<a href="[^"]*" class="cat-b/, '</a>').map(r => ({ raw: r })) : [];

  const newsletter = {
    title: hUnesc(fieldGet(raw, /id="nl-title">([^<]*)</)), sub: hUnesc(fieldGet(raw, /id="nl-sub">([^<]*)</)),
    label: hUnesc(fieldGet(raw, /id="nl-label">([^<]*)</)), note: hUnesc(fieldGet(raw, /id="nl-note">([^<]*)</)),
    btn: hUnesc(fieldGet(raw, /id="nl-btn">([^<]*)</)),
  };
  const footer = { desc: hUnesc(fieldGet(raw, /class="ft-desc">([^<]*)</)), copy: hUnesc(fieldGet(raw, /class="ft-copy">([^<]*)</)) };

  const animeMatch = raw.match(/const ANIME=\{([\s\S]*?)\n\};/);
  let anime = { summer: [], spring: [], winter: [], fall: [] };
  if (animeMatch) {
    const body = animeMatch[1];
    const seasonRe = /(summer|spring|winter|fall):\[([\s\S]*?)\n  \],?\n/g;
    let sm2;
    while ((sm2 = seasonRe.exec(body))) {
      const items = [...sm2[2].matchAll(/\{title:'([^']*)',genre:'([^']*)',score:'([^']*)',day:'([^']*)',ep:'([^']*)',status:'([^']*)',img:'([^']*)'\}/g)];
      anime[sm2[1]] = items.map(m => ({ title: hUnesc(m[1]), genre: hUnesc(m[2]), score: m[3], day: hUnesc(m[4]), ep: hUnesc(m[5]), status: m[6], img: m[7] }));
    }
  }

  return { hero, heroSide, heroSidePrefix, ticker, marquee, featured, rankings, manga, latestNews, trending, latestSuffix, trendingPrefix, catGrid, newsletter, footer, anime };
}

function buildHomeHtml(rawHtml, D) {
  let html = rawHtml;
  const h = D.hero;
  html = html.replace(/(id="h-title">)[^<]*(<)/, (m,p1,p2)=>p1+esc(h.title)+p2);
  html = html.replace(/(id="h-sub">)[^<]*(<)/, (m,p1,p2)=>p1+esc(h.sub)+p2);
  html = html.replace(/(class="h-meta-cat">)[^<]*(<)/, (m,p1,p2)=>p1+esc(h.cat)+p2);
  html = html.replace(/(id="h-time">)[^<]*(<)/, (m,p1,p2)=>p1+esc(h.date)+p2);
  html = html.replace(/(<a href=")[^"]*(" class="read-more" id="h-read")/, (m,p1,p2)=>p1+esc(h.href)+p2);
  html = html.replace(/(<div class="hero-main" onclick="location\.href=')[^']*(')/, (m,p1,p2)=>p1+h.href.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+p2);
  html = html.replace(/(\.h-img\{[^}]*background:url\(')[^']*('\))/, (m,p1,p2)=>p1+h.img.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+p2);

  html = hReplaceSection(html, '<aside class="hero-side">', '</aside>', () =>
    D.heroSidePrefix + D.heroSide.map(x=>x.raw).join('\n\n\n    ') + '\n\n\n  ');

  html = hReplaceSection(html, '<div class="tick-track">', '</div></div>', () =>
    D.ticker.map(t=>`<span class="tick-item">${esc(t)}</span>`).join(''));

  html = hReplaceSection(html, '<div class="mq-track">', '</div>', () =>
    D.marquee.map(x=>x.raw).join(''));

  const newFeatured = '\n    ' + D.featured.fc.trim() + '\n\n\n    ' + D.featured.sc.map(c=>c.raw.trim()).join('\n\n\n    ') + '\n    ';
  html = html.replace(/(<!-- ADMIN:FEATURED_START -->)[\s\S]*?(<!-- ADMIN:FEATURED_END -->)/, (m,p1,p2)=>p1+newFeatured+p2);

  html = hReplaceSection(html, '<div class="rank-grid">', '<div class="wrap rv">\n\n\n  <div class="sec-h"><span class="sec-t">Anime', () => {
    const cardClose = '\n\n\n      </div>\n\n\n    </div>';
    const pcCard = '<div class="rk-card">' + D.rankings.pcPrefix + D.rankings.pc.map(x=>x.raw).join('\n\n\n        ') + cardClose;
    const mobCard = '<div class="rk-card">' + D.rankings.mobilePrefix + D.rankings.mobile.map(x=>x.raw).join('\n\n\n        ') + cardClose;
    return '\n\n\n    ' + pcCard + '\n\n\n    ' + mobCard + '\n\n\n  </div>\n\n\n</div>\n\n\n';
  });

  html = hReplaceSection(html, '<div class="manga-grid">', '<div class="wrap rv" style="padding-top:0">', () => {
    const cols = ['manga','manhwa','manhua'].map(k =>
      '<div class="manga-col">' + D.manga[k+'Prefix'] + D.manga[k].map(x=>x.raw).join('\n\n\n      ') + '\n\n\n    </div>'
    );
    return '\n\n\n    ' + cols.join('\n\n\n    ') + '\n\n\n  </div>\n\n\n</div>\n\n\n';
  });

  html = hReplaceSection(html, '<div class="latest-wrap">', '<div class="wrap rv" style="padding-bottom:0">', () => {
    const newsCol = '\n\n\n    <div>\n\n\n      ' + D.latestNews.map(x=>x.raw).join('\n\n\n      ') + D.latestSuffix;
    const trendCol = D.trendingPrefix + D.trending.map(x=>x.raw).join('\n\n\n      ') + '\n\n\n    </aside>\n\n\n  </div>\n\n\n</div>\n\n\n';
    return newsCol + trendCol;
  });

  html = hReplaceSection(html, '<div class="cat-grid">', '<section class="nl"', () =>
    '\n\n\n    ' + D.catGrid.map(x=>x.raw).join('\n\n\n    ') + '\n\n\n  </div>\n\n\n</div>\n\n\n');

  const nl = D.newsletter;
  html = html.replace(/(id="nl-title">)[^<]*(<)/, (m,p1,p2)=>p1+esc(nl.title)+p2);
  html = html.replace(/(id="nl-sub">)[^<]*(<)/, (m,p1,p2)=>p1+esc(nl.sub)+p2);
  html = html.replace(/(id="nl-label">)[^<]*(<)/, (m,p1,p2)=>p1+esc(nl.label)+p2);
  html = html.replace(/(id="nl-note">)[^<]*(<)/, (m,p1,p2)=>p1+esc(nl.note)+p2);
  html = html.replace(/(id="nl-btn">)[^<]*(<)/, (m,p1,p2)=>p1+esc(nl.btn)+p2);

  const ft = D.footer;
  html = html.replace(/(class="ft-desc">)[^<]*(<)/, (m,p1,p2)=>p1+esc(ft.desc)+p2);
  html = html.replace(/(class="ft-copy">)[^<]*(<)/, (m,p1,p2)=>p1+esc(ft.copy)+p2);

  html = hReplaceSection(html, 'const ANIME={', '\n};', () => {
    const seasons = ['summer','spring','winter','fall'].map(k => {
      const items = D.anime[k].map(x => '    ' + animeItemStr(x) + ',\n\n\n').join('');
      return `\n\n\n  ${k}:[\n\n\n${items}  ],`;
    });
    return seasons.join('') + '\n\n';
  });

  return html;
}

async function homeEditor(file) {
  HAS_UNSAVED_CHANGES = false;
  file = file || 'index.html';
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải trang chủ...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-home')?.classList.add('active');
  try {
    const data = await ghGet(file);
    const raw = decodeURIComponent(escape(atob(data.content)));
    HOME_FILE = file;
    HOME_RAW = raw;

  `);

}

function homeItemListBody(typeKey, path) {
  const type = HOME_ITEM_TYPES[typeKey];

    const fieldsHtml = type.fields.map(([k,label]) => `<label class="form-label">${label}</label><input class="form-input" value="${esc(f[k]||'')}" oninput="homeItemFieldEdit('${path}',${i},'${typeKey}','${k}',this.value)">`).join('');

  }).join('');
  return `<button class="btn btn-secondary btn-sm" style="margin-bottom:10px" onclick="homeItemAdd('${path}','${typeKey}')">➕ Thêm mục</button><div class="home-item-list">${rows || '<div class="empty-state-mini">Chưa có mục nào.</div>'}</div>`;
}
function homeItemListPanelHtml(typeKey, path, title) {
  return `<div class="home-panel-head"><h3>${title}</h3></div>${homeItemListBody(typeKey, path)}`;
}
function homeTabbedListPanel(blockKey, tabs, title) {
  const active = HOME_SUBTAB[blockKey] || tabs[0][0];
  HOME_SUBTAB[blockKey] = active;
  const tabBar = tabs.map(([tk,label]) => `<button class="home-tab-btn ${tk===active?'active':''}" onclick="homeSetSubtab('${blockKey}','${tk}')">${label}</button>`).join('');
  const cur = tabs.find(t => t[0] === active);
  const typeKey = cur[2], path = cur[3];
  return `<div class="home-panel-head"><h3>${title}</h3></div><div class="home-tab-bar">${tabBar}</div>${homeItemListBody(typeKey, path)}`;

function homeItemFieldEdit(path, i, typeKey, key, val) {
  const arr = getArr(path);
  const type = HOME_ITEM_TYPES[typeKey];
  arr[i].raw = type.apply(arr[i].raw, { [key]: val });
  markChanged();
  schedulePreviewRefresh();
}
function homeItemMove(path, i, dir) {
  const arr = getArr(path);
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  markChanged();
  openHomeBlockPanel(HOME_PANEL);
  schedulePreviewRefresh();
}
function homeItemDelete(path, i) {
  if (!confirm('Xoá mục này?')) return;
  getArr(path).splice(i, 1);
  markChanged();
  openHomeBlockPanel(HOME_PANEL);
  schedulePreviewRefresh();
}
function homeItemAdd(path, typeKey) {
  const arr = getArr(path);
  const type = HOME_ITEM_TYPES[typeKey];
  if (!arr.length) { toast('error', 'Không có mục mẫu để nhân bản.'); return; }
  const ph = {};
  type.fields.forEach(([k]) => {
    if (k === 'href') ph[k] = '/duong-dan-moi';
    else if (k === 'img') ph[k] = '/assets/img/placeholder.svg';
    else if (k === 'alt') ph[k] = 'Ảnh minh hoạ';
    else if (k === 'score') ph[k] = '8.0';
    else if (k === 'count') ph[k] = '0';
    else ph[k] = 'Nội dung mới';
  });
  const clone = { raw: type.apply(arr[0].raw, ph) };
  arr.unshift(clone);
  markChanged();
  openHomeBlockPanel(HOME_PANEL);
  schedulePreviewRefresh();
}

async function saveVisualHome() {
  const btn = document.getElementById('save-btn');
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (btn) { btn.textContent = '⏳ Đang lưu...'; btn.disabled = true; }
  if (dot) dot.className = 'status-dot saving';
  if (txt) txt.textContent = 'Đang commit lên GitHub...';
  try {
    const latest = await ghGet(HOME_FILE);
    const latestRaw = decodeURIComponent(escape(atob(latest.content)));
    const html = buildHomeHtml(latestRaw, HOME_DATA);
    await ghPut(HOME_FILE, html, latest.sha, '[admin] cap nhat trang chu (visual editor)');
    HOME_RAW = latestRaw;
    HAS_UNSAVED_CHANGES = false;
    if (dot) dot.className = 'status-dot';
    if (txt) txt.textContent = 'Đã lưu • ' + new Date().toLocaleTimeString('vi-VN');
    const log = document.getElementById('save-log');
    if (log) log.innerHTML = `✅ Commit lúc ${new Date().toLocaleTimeString('vi-VN')}<br>` + log.innerHTML;
    toast('success', '✅ Đã lưu trang chủ! Deploy trong ~1-2 phút.');
  } catch(e) {
    if (dot) dot.className = 'status-dot error';
    if (txt) txt.textContent = 'Lỗi khi lưu';
    toast('error', 'Lỗi lưu: ' + e.message);
  } finally {
    if (btn) { btn.textContent = '💾 Lưu & Deploy'; btn.disabled = false; }
  }
}

// ── Tự động đồng bộ bài viết mới ra toàn site ────────────────────────────────
async function syncNewArticle(meta) {
  const slug = meta.file.replace(/\.html$/, '');
  const url = '/' + slug;
  const CAT_MAP = {
    Gaming: { hub: 'gaming.html', story: 'gaming', tag: 'tc' },
    Anime:  { hub: 'anime.html',  story: 'anime',  tag: 'ts' },
    Manga:  { hub: 'manga.html',  story: 'manga',  tag: 'tv' },
  };
  const info = CAT_MAP[meta.cat] || CAT_MAP.Gaming;
  const now = new Date();
  const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
  const isoDate = now.toISOString().slice(0, 10);
  const hero = meta.hero || '/assets/img/placeholder.svg';
  const results = [];

  try {
    const newsCard = `<a href="${url}" style="display:block;background:#150a2c;border:1px solid rgba(255,255,255,.12);color:#f3efff;text-decoration:none"><img src="${hero}" alt="${esc(meta.title)}" width="1200" height="675" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover"><div style="padding:18px"><span style="color:#00e5ff;font-size:11px;letter-spacing:.15em">${meta.cat.toUpperCase()}</span><h3 style="font-size:20px;line-height:1.3;margin:8px 0">${esc(meta.title)}</h3><p style="color:#aaa1ba;font-size:14px">${esc(meta.desc)}</p></div></a>`;
    const data = await ghGet('news.html');
    let content = decodeURIComponent(escape(atob(data.content)));
    const gridAnchor = /gap:18px">/;
    if (!gridAnchor.test(content)) throw new Error('Không tìm thấy điểm chèn trong news.html');
    content = content.replace(gridAnchor, (m) => m + newsCard);
    content = content.replace(/(\d+)( tin mới đã kiểm chứng)/, (m, n, rest) => (parseInt(n, 10) + 1) + rest);
    await ghPut('news.html', content, data.sha, `[admin] them bai moi vao news.html: ${meta.title.slice(0, 50)}`);
    results.push('✅ news.html');
  } catch(e) { results.push('❌ news.html — ' + e.message); }

  try {
    const cardHtml = `\n      <a href="${url}" class="ac" data-cat="pc"><div class="ac-thumb"><img src="${hero}" alt="${esc(meta.title)}" loading="lazy" width="1280" height="720"></div><div class="ac-info"><div><div class="ac-top"><span class="tag ${info.tag}">${meta.cat}</span></div><div class="ac-title">${esc(meta.title)}</div></div><div class="ac-meta"><span>OtaHub Editorial</span><span class="ac-meta-sep">·</span><span>Hôm nay</span><span class="ac-meta-sep">·</span><span>5 min</span></div></div></a>`;
    await ghSpliceInsert(info.hub, /<!-- ADMIN:ARTICLES_START -->/, cardHtml, true, `[admin] them bai moi vao ${info.hub}: ${meta.title.slice(0, 50)}`);
    results.push(`✅ ${info.hub}`);
  } catch(e) { results.push(`❌ ${info.hub} — ` + e.message); }

  try {
    const wcard = `<article class="w-card"><a href="${slug}" style="text-decoration:none;display:contents"><div class="wc-info"><div class="wc-c" style="color:var(--cyan)">${meta.cat} · OtaHub Editorial</div><div class="wc-t">${esc(meta.title)}</div><div class="wc-m">OtaHub Editorial · ${dateStr} · 5 min</div></div><div class="wc-thumb"><img src="${hero}" alt="${esc(meta.title)}" loading="lazy" width="2000" height="1125"></div></a></article>\n\n`;
    await ghSpliceInsert('index.html', /<article class="w-card">/, wcard, false, `[admin] them bai moi vao trang chu: ${meta.title.slice(0, 50)}`);
    results.push('✅ index.html');
  } catch(e) { results.push('❌ index.html — ' + e.message); }

  try {
    const tuple = `\n      ['${slug}',${JSON.stringify(meta.title)},${JSON.stringify(meta.title)}],`;
    await ghSpliceInsert('assets/category-latest.js', new RegExp(info.story + ':\\['), tuple, true, `[admin] them bai moi vao category-latest.js: ${meta.title.slice(0, 50)}`);
    results.push('✅ category-latest.js');
  } catch(e) { results.push('❌ category-latest.js — ' + e.message); }

  try {
    const entry = JSON.stringify({ u: url, t: meta.title, c: meta.cat, s: (meta.desc || '').slice(0, 150) }) + ',';
    await ghSpliceInsert('assets/search.js', /var IDX=\[/, entry, true, `[admin] them bai moi vao search index: ${meta.title.slice(0, 50)}`);
    results.push('✅ search.js');
  } catch(e) { results.push('❌ search.js — ' + e.message); }

  try {
    const urlBlock = `<url><loc>https://otahub.asia${url}</loc><lastmod>${isoDate}</lastmod><changefreq>weekly</changefreq><priority>0.7</priority></url>\n`;
    await ghSpliceInsert('sitemap.xml', /<\/urlset>/, urlBlock, false, `[admin] them bai moi vao sitemap: ${meta.title.slice(0, 50)}`);
    results.push('✅ sitemap.xml');
  } catch(e) { results.push('❌ sitemap.xml — ' + e.message); }

  try {
    const item = `  <item><title>${esc(meta.title)}</title><link>https://otahub.asia${url}</link><guid isPermaLink="true">https://otahub.asia${url}</guid><pubDate>${now.toUTCString()}</pubDate><description>${esc(meta.desc)}</description><media:content url="https://otahub.asia${hero}" medium="image"/></item>\n`;
    await ghSpliceInsert('feed.xml', /<item>/, item, false, `[admin] them bai moi vao feed.xml: ${meta.title.slice(0, 50)}`);
    results.push('✅ feed.xml');
  } catch(e) { results.push('❌ feed.xml — ' + e.message); }

  alert('Kết quả đồng bộ bài viết mới:\n\n' + results.join('\n') + '\n\nLưu ý: chỉ đồng bộ bản Tiếng Việt. Nếu cần bản Tiếng Anh, tạo và nối thủ công vào en/.');
}

let ARR_CFG = null;
let ARR_DATA = [];
let ARR_SHA = null;

async function arrayEditor(cfgKey) {
  const cfg = ARRAY_PAGE_CONFIGS[cfgKey];
  if (!cfg) return;
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải ${cfg.label}...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-arr-' + cfgKey)?.classList.add('active');
  try {
    const data = await ghGet(cfg.file);
    const raw = decodeURIComponent(escape(atob(data.content)));
    const re = new RegExp('const\\s+' + cfg.varName + '\\s*=\\s*(\\[[\\s\\S]*?\\n\\]);');
    const m = raw.match(re);
    if (!m) throw new Error(`Không tìm thấy mảng dữ liệu "${cfg.varName}" trong ${cfg.file}`);
    ARR_CFG = { ...cfg, key: cfgKey };
    ARR_DATA = new Function('return ' + m[1])();
    ARR_SHA = data.sha;
    renderArrayEditor();
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải ${cfg.label}: ${e.message}</p></div>`);
  }
}

function renderArrayEditor() {
  const cfg = ARR_CFG;
  const rows = ARR_DATA.map((entry, i) => {
    const thumb = cfg.imgField && entry[cfg.imgField]
      ? `<img class="rank-img-prev" src="${esc(entry[cfg.imgField])}" onerror="this.style.opacity=.3" alt=""/>`
      : `<div class="rank-img-prev" style="display:flex;align-items:center;justify-content:center;font-size:16px">📄</div>`;

    const fieldInputs = cfg.fields.map(f => {
      const val = entry[f.key];
      const displayVal = f.type === 'array' ? (Array.isArray(val) ? val.join(', ') : (val || '')) : (val ?? '');
      if (f.type === 'textarea') {
        return `<div style="grid-column:1/-1"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${esc(f.label)}</div><textarea class="rank-input-sm" style="width:100%;min-height:50px;font-family:inherit" oninput="arrUpdate(${i},'${f.key}','${f.type}',this.value)">${esc(displayVal)}</textarea></div>`;
      }
      return `<div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${esc(f.label)}</div><input class="rank-input-sm" style="width:100%" value="${esc(displayVal)}" oninput="arrUpdate(${i},'${f.key}','${f.type}',this.value)"/></div>`;
    }).join('');

    return `<div class="rank-entry" style="grid-template-columns:70px 1fr">
      <div style="text-align:center">${thumb}<div style="display:flex;gap:4px;justify-content:center;margin-top:6px">
        <button class="tb-btn" onclick="arrMove(${i},-1)" title="Lên">↑</button>
        <button class="tb-btn" onclick="arrMove(${i},1)" title="Xuống">↓</button>
      </div></div>
      <div>
        <div class="rank-row" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${fieldInputs}</div>
        <details style="margin-top:8px">
          <summary style="font-size:11px;color:var(--muted);cursor:pointer">⚙️ JSON thô (sửa mọi trường, kể cả trường không có ở trên)</summary>
          <textarea class="rank-input-sm" style="width:100%;min-height:80px;font-family:monospace;font-size:11px;margin-top:6px" onblur="arrUpdateJson(${i},this.value)">${esc(JSON.stringify(entry, null, 2))}</textarea>
        </details>
        <button class="btn btn-danger btn-sm" style="margin-top:8px" onclick="arrDelete(${i})">🗑 Xoá mục này</button>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">${esc(cfg.label)} <small>${cfg.file} · ${ARR_DATA.length} mục</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="${cfg.urlBase}" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" onclick="saveArrayEditor()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      ${cfg.note ? `<div style="font-size:11px;color:var(--muted);margin-bottom:14px">${cfg.note}</div>` : ''}
      <button class="btn btn-secondary" style="margin-bottom:14px" onclick="arrAdd()">➕ Thêm mục mới vào đầu danh sách</button>
      ${rows}
    </div>
  `);
}

function arrUpdate(i, key, type, value) {
  if (type === 'array') {
    ARR_DATA[i][key] = value.split(',').map(s => s.trim()).filter(Boolean);
  } else if (type === 'number') {
    ARR_DATA[i][key] = parseFloat(value) || 0;
  } else {
    ARR_DATA[i][key] = value;
  }
}
function arrUpdateJson(i, text) {
  try {
    ARR_DATA[i] = JSON.parse(text);
    renderArrayEditor();
  } catch(e) {
    toast('error', 'JSON không hợp lệ, chưa áp dụng thay đổi này.');
  }
}
function arrMove(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= ARR_DATA.length) return;
  const t = ARR_DATA[i]; ARR_DATA[i] = ARR_DATA[j]; ARR_DATA[j] = t;
  renderArrayEditor();
}
function arrDelete(i) {
  if (!confirm('Xoá mục này?')) return;
  ARR_DATA.splice(i, 1);
  renderArrayEditor();
}
function arrAdd() {
  const entry = ARR_CFG.newEntry ? ARR_CFG.newEntry() : JSON.parse(JSON.stringify(ARR_DATA[0] || {}));
  ARR_DATA.unshift(entry);
  renderArrayEditor();
  toast('success', 'Đã thêm mục mới — nhớ điền thông tin trước khi lưu.');
}
async function saveArrayEditor() {
  const cfg = ARR_CFG;
  try {
    const latest = await ghGet(cfg.file);
    let raw = decodeURIComponent(escape(atob(latest.content)));
    const re = new RegExp('const\\s+' + cfg.varName + '\\s*=\\s*\\[[\\s\\S]*?\\n\\];');
    const newBlock = 'const ' + cfg.varName + ' = ' + JSON.stringify(ARR_DATA, null, 2) + ';';
    if (!re.test(raw)) throw new Error(`Không tìm thấy mảng "${cfg.varName}" để ghi lại.`);
    raw = raw.replace(re, newBlock);
    await ghPut(cfg.file, raw, latest.sha, `[admin] cap nhat ${cfg.varName} trong ${cfg.file}`);
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Trình soạn thảo "Đang Hot" (choi-gi.html) ─────────────────────────────
// Khối này là 8 thẻ <div class="hot-card"> lồng nhau nhiều cấp — không dùng
// regex non-greedy đơn giản được vì có nhiều div con. Ta đếm độ sâu thẻ <div>
// để tìm đúng vị trí đóng của khối "hot-grid".
function extractBalancedBlock(html, startTag) {
  const startIdx = html.indexOf(startTag);
  if (startIdx === -1) return null;
  let i = startIdx + startTag.length;
  let depth = 1;
  while (depth > 0 && i < html.length) {
    const nextOpen = html.indexOf('<div', i);
    const nextClose = html.indexOf('</div>', i);
    if (nextClose === -1) return null;
    if (nextOpen !== -1 && nextOpen < nextClose) { depth++; i = html.indexOf('>', nextOpen) + 1; }
    else { depth--; i = nextClose + 6; }
  }
  return { start: startIdx, end: i, block: html.slice(startIdx, i) };
}

const HOT_COLORS = {
  amber: '251,191,36', cyan: '0,229,255', green: '52,211,153',
  lavender: '167,139,250', sakura: '255,48,128', violet: '124,58,237',
};
let HOT_CARDS = [];

function hotFields(raw) {
  const colorM = raw.match(/background:var\(--([a-z]+)\);width:0/);
  return {
    name: fieldGet(raw, /class="hot-name">([^<]*)</),
    meta: fieldGet(raw, /class="hot-meta">([^<]*)</),
    width: fieldGet(raw, /data-w="([^"]*)"/),
    badge: fieldGet(raw, /class="hot-badge">([^<]*)</),
    pill: fieldGet(raw, /class="hot-pill"[^>]*>([^<]*)</),
    color: colorM ? colorM[1] : 'cyan',
    gameId: fieldGet(raw, /pickGame\('([^']*)'\)/),
  };
}
function hotApply(raw, f) {
  let out = raw;
  out = replaceField(out, /(class="hot-name">)[^<]*(<)/, f.name);
  out = replaceField(out, /(class="hot-meta">)[^<]*(<)/, f.meta);
  out = replaceField(out, /(data-w=")[^"]*(")/, f.width);
  out = replaceField(out, /(class="hot-badge">)[^<]*(<)/, f.badge);
  out = replaceField(out, /(class="hot-pill"[^>]*>)[^<]*(<)/, f.pill);
  out = replaceField(out, /(pickGame\(')[^']*('\))/, f.gameId);
  if (f.color && HOT_COLORS[f.color]) {
    out = out.replace(/background:var\(--[a-z]+\);width:0/, `background:var(--${f.color});width:0`);
    out = out.replace(/border-color:rgba\([^)]*\);color:var\(--[a-z]+\)/, `border-color:rgba(${HOT_COLORS[f.color]},.3);color:var(--${f.color})`);
  }
  return out;
}

async function hotGridEditor() {
  setMain(`<div class="loading"><div class="spinner"></div><span>Đang tải Đang Hot...</span></div>`);
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-hotgrid')?.classList.add('active');
  try {
    const data = await ghGet('choi-gi.html');
    const raw = decodeURIComponent(escape(atob(data.content)));
    const grid = extractBalancedBlock(raw, '<div class="hot-grid">');
    if (!grid) throw new Error('Không tìm thấy khối "hot-grid" trong choi-gi.html');
    const inner = grid.block.slice('<div class="hot-grid">'.length, -'</div>'.length);
    HOT_CARDS = splitBlocks(inner, /<div class="hot-card"/).map(r => ({ raw: r }));
    renderHotGridEditor();
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-icon">⚠️</div><p>Lỗi tải: ${e.message}</p></div>`);
  }
}

function renderHotGridEditor() {
  const colorOpts = Object.keys(HOT_COLORS).map(c => `<option value="${c}">${c}</option>`).join('');
  const rows = HOT_CARDS.map((c, i) => {
    const f = hotFields(c.raw);
    return `<div class="rank-entry">
      <div style="text-align:center"><div class="rank-num">#${i+1}</div><div style="font-size:20px;font-weight:700;color:var(--cyan)">${esc(f.badge)}</div></div>
      <div class="rank-fields">
        <div class="rank-row">
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Tên game</div><input class="rank-input-sm" value="${esc(f.name)}" oninput="hotUpdate(${i},'name',this.value)"/></div>
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Meta (nền tảng · thể loại · giờ)</div><input class="rank-input-sm" value="${esc(f.meta)}" oninput="hotUpdate(${i},'meta',this.value)"/></div>
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Điểm</div><input class="rank-input-sm" value="${esc(f.badge)}" oninput="hotUpdate(${i},'badge',this.value)"/></div>
        </div>
        <div class="rank-row" style="margin-top:6px">
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">% thanh điểm (vd 95%)</div><input class="rank-input-sm" value="${esc(f.width)}" oninput="hotUpdate(${i},'width',this.value)"/></div>
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Nhãn pill</div><input class="rank-input-sm" value="${esc(f.pill)}" oninput="hotUpdate(${i},'pill',this.value)"/></div>
          <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Màu</div><select class="rank-input-sm" onchange="hotUpdate(${i},'color',this.value)">${colorOpts.replace(`value="${f.color}"`,`value="${f.color}" selected`)}</select></div>
        </div>
        <div style="margin-top:8px;display:flex;gap:6px">
          <button class="tb-btn" onclick="hotMove(${i},-1)">↑ Lên</button>
          <button class="tb-btn" onclick="hotMove(${i},1)">↓ Xuống</button>
          <button class="btn btn-danger btn-sm" onclick="hotDelete(${i})">🗑 Xoá</button>
        </div>
      </div>
    </div>`;
  }).join('');

  setMain(`
    <div class="page-header">
      <div class="page-title">Đang Hot <small>choi-gi.html · top ${HOT_CARDS.length}</small></div>
      <div class="header-actions">
        <a class="btn btn-secondary btn-sm" href="https://otahub.asia/choi-gi" target="_blank">🔗 Xem live</a>
        <button class="btn btn-primary" onclick="saveHotGrid()">💾 Lưu & Deploy</button>
      </div>
    </div>
    <div class="content-area">
      <div style="font-size:11px;color:var(--muted);margin-bottom:14px">💡 Thứ hạng (#1-#${HOT_CARDS.length}) tự tính theo vị trí trong danh sách. Không thêm/xoá mục ở đây — chỉ sắp xếp lại và sửa nội dung.</div>
      ${rows}
    </div>
  `);
}

function hotUpdate(i, field, value) { HOT_CARDS[i].raw = hotApply(HOT_CARDS[i].raw, { [field]: value }); }
function hotMove(i, dir) { const j = i + dir; if (j < 0 || j >= HOT_CARDS.length) return; const t = HOT_CARDS[i]; HOT_CARDS[i] = HOT_CARDS[j]; HOT_CARDS[j] = t; renderHotGridEditor(); }
function hotDelete(i) { if (!confirm('Xoá mục này?')) return; HOT_CARDS.splice(i, 1); renderHotGridEditor(); }
async function saveHotGrid() {
  try {
    const latest = await ghGet('choi-gi.html');
    let raw = decodeURIComponent(escape(atob(latest.content)));
    const grid = extractBalancedBlock(raw, '<div class="hot-grid">');
    if (!grid) throw new Error('Không tìm thấy khối "hot-grid" để lưu.');
    const ranks = HOT_CARDS.map((c, i) => c.raw.replace(/class="hot-rank">[^<]*</, `class="hot-rank">${String(i+1).padStart(2,'0')}<`));
    const newInner = ranks.map(r => r.trim()).join('');
    const newBlock = '<div class="hot-grid">' + newInner + '</div>';
    raw = raw.slice(0, grid.start) + newBlock + raw.slice(grid.end);
    await ghPut('choi-gi.html', raw, latest.sha, '[admin] cap nhat Dang Hot choi-gi.html');
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

function switchReleasesTab(c) { RELEASES_TAB = c; renderReleasesEditor(); }

function renderReleasesTab() {
  const el = document.getElementById('releases-content');
  const groups = RELEASES_DATA[RELEASES_TAB] || [];
  const fields = RELEASES_FIELDS[RELEASES_TAB];

  const groupsHtml = groups.map((g, gi) => {
    const itemsHtml = (g.items || []).map((item, ii) => {
      const inputs = fields.map(f => {
        const val = item[f.key];
        const displayVal = f.type === 'array' ? (Array.isArray(val) ? val.join(', ') : (val || '')) : (val ?? '');
        return `<div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">${esc(f.label)}</div><input class="rank-input-sm" style="width:100%" value="${esc(displayVal)}" oninput="releasesUpdate('${RELEASES_TAB}',${gi},${ii},'${f.key}','${f.type}',this.value)"/></div>`;
      }).join('');
      return `<div class="rank-entry" style="grid-template-columns:1fr">

          <div style="margin-top:6px;display:flex;gap:6px">
            <button class="tb-btn" onclick="releasesMoveItem('${RELEASES_TAB}',${gi},${ii},-1)">↑</button>
            <button class="tb-btn" onclick="releasesMoveItem('${RELEASES_TAB}',${gi},${ii},1)">↓</button>
            <button class="btn btn-danger btn-sm" onclick="releasesDeleteItem('${RELEASES_TAB}',${gi},${ii})">🗑 Xoá mục</button>
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <input class="rank-input-sm" style="font-weight:700;font-size:14px;width:220px" value="${esc(g.month||'')}" oninput="releasesUpdateMonth('${RELEASES_TAB}',${gi},this.value)"/>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="releasesAddItem('${RELEASES_TAB}',${gi})">➕ Thêm mục</button>
          <button class="btn btn-danger btn-sm" onclick="releasesDeleteGroup('${RELEASES_TAB}',${gi})">🗑 Xoá cả tháng này</button>
        </div>
      </div>
      ${itemsHtml || '<div style="color:var(--muted);font-size:12px">Chưa có mục nào trong tháng này.</div>'}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">💡 Mỗi nhóm là 1 tháng/quý. "Nổi bật?" gõ đúng chữ <code style="color:var(--cyan)">true</code> hoặc <code style="color:var(--cyan)">false</code>.</div>
    <button class="btn btn-secondary" onclick="releasesAddGroup('${RELEASES_TAB}')">➕ Thêm nhóm tháng mới</button>
    ${groupsHtml}
  `;
}

function releasesUpdate(cat, gi, ii, key, type, value) {
  const item = RELEASES_DATA[cat][gi].items[ii];
  if (type === 'array') item[key] = value.split(',').map(s => s.trim()).filter(Boolean);
  else if (key === 'hot') item[key] = value.trim().toLowerCase() === 'true';
  else item[key] = value;
}
function releasesUpdateMonth(cat, gi, value) { RELEASES_DATA[cat][gi].month = value; }
function releasesMoveItem(cat, gi, ii, dir) {
  const arr = RELEASES_DATA[cat][gi].items;
  const j = ii + dir;
  if (j < 0 || j >= arr.length) return;
  const t = arr[ii]; arr[ii] = arr[j]; arr[j] = t;
  renderReleasesTab();
}
function releasesDeleteItem(cat, gi, ii) {
  if (!confirm('Xoá mục này?')) return;
  RELEASES_DATA[cat][gi].items.splice(ii, 1);
  renderReleasesTab();
}
function releasesAddItem(cat, gi) {
  const cur = RELEASES_DATA[cat][gi].items;
  const template = cur[0] ? JSON.parse(JSON.stringify(cur[0])) : { cat, title: 'Tên mới', date: '', dateRaw: '', hot: false, img: '', genres: [] };
  template.title = 'Tên mới'; template.hot = false;
  cur.unshift(template);
  renderReleasesTab();
}
function releasesDeleteGroup(cat, gi) {
  if (!confirm('Xoá cả nhóm tháng này (và mọi mục bên trong)?')) return;
  RELEASES_DATA[cat].splice(gi, 1);
  renderReleasesTab();
}
function releasesAddGroup(cat) {
  RELEASES_DATA[cat].unshift({ month: 'Tháng mới', items: [] });
  renderReleasesTab();
}
async function saveReleases() {
  try {
    const latest = await ghGet('sap-ra-mat.html');
    let raw = decodeURIComponent(escape(atob(latest.content)));
    const re = /const RELEASES\s*=\s*\{[\s\S]*?\n\s*\};/;
    if (!re.test(raw)) throw new Error('Không tìm thấy RELEASES để ghi lại.');
    const newBlock = 'const RELEASES = ' + JSON.stringify(RELEASES_DATA, null, 2) + ';';
    raw = raw.replace(re, newBlock);
    await ghPut('sap-ra-mat.html', raw, latest.sha, '[admin] cap nhat RELEASES trong sap-ra-mat.html');
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

let SECTION_CTX = null;

async function saveNews() {
  try {
    const latest = await ghGet('news.html');
    let html = decodeURIComponent(escape(atob(latest.content)));
    const newSection = NEWS_CARDS.map(c => c.raw.trim()).join('');
    html = html.replace(/(<!-- OTAHUB_NEW30_START -->[\s\S]*?<h2[^>]*>)\d+( tin mới đã kiểm chứng<\/h2><div[^>]*>)[\s\S]*?(<\/div><\/section><!-- OTAHUB_NEW30_END -->)/,
      (m, p1, p2, p3) => p1 + NEWS_CARDS.length + p2 + newSection + p3);
    await ghPut('news.html', html, latest.sha, `[admin] cap nhat danh sach tin tuc news.html`);
    toast('success', '✅ Đã lưu! Deploy trong ~1-2 phút.');
  } catch(e) {
    toast('error', 'Lỗi lưu: ' + e.message);
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function openSite()   { window.open('https://otahub.asia', '_blank'); }
function openGitHub() { window.open('https://github.com/Embisu/otahub-', '_blank'); }

function toast(type, msg) {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.innerHTML = `<span class="toast-icon">${type==='success'?'✅':'❌'}</span><span>${msg}</span>`;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
</script>
